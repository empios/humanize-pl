name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,morfeusz,xlsx,pdf]"
      - run: ruff check .
      - run: pytest -q
      - run: humanize-pl-benchmark --engines basic --mode standard --allow-fallback --fail-on-status
      # The SAOS ruling corpus stays local, so ruling metrics are skipped here.
      - run: humanize-pl-eval
