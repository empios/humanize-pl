    - {span: [73, 88], text: sąd i wydział}
    - {span: [104, 117], text: data wyroku}
  - p: 23
    role: body
    layout: {align: justify, size: 11.0}
    text: Wyrok zaskarżam ………………… (w całości albo w części, ze wskazaniem zakresu).
    slots:
    - {id: zakres_zaskarzenia, span: [16, 23], type: text, hint: 'w całości albo w części, ze wskazaniem zakresu'}
    inline_hints:
    - {span: [24, 72], text: 'w całości albo w części, ze wskazaniem zakresu'}
  - {p: 24, role: spacer}
  - p: 25
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Zaskarżonemu wyrokowi zarzucam:'
  - p: 26
    role: item
    layout: {align: justify, size: 11.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
    text: '………………… (naruszone przepisy postępowania lub prawa materialnego i na czym polega naruszenie).'
    slots:
    - {id: zarzuty, span: [0, 7], type: text, hint: naruszone przepisy postępowania lub prawa materialnego i na czym polega naruszenie}
    inline_hints:
    - {span: [8, 92], text: naruszone przepisy postępowania lub prawa materialnego i na czym polega naruszenie}
  - {p: 27, role: spacer}
  - p: 28
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Wskazując na powyższe, wnoszę o:'
  - p: 29
    role: item
    layout: {align: justify, size: 11.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
    text: '………………… (zmianę wyroku przez określone rozstrzygnięcie albo jego uchylenie i przekazanie sprawy do ponownego rozpoznania);'
    slots:
    - {id: wnioski_apelacyjne, span: [0, 7], type: text, hint: zmianę wyroku przez określone rozstrzygnięcie albo jego uchylenie i przekazanie sprawy do ponownego rozpoznania}
    inline_hints:
    - {span: [8, 121], text: zmianę wyroku przez określone rozstrzygnięcie albo jego uchylenie i przekazanie sprawy do ponownego rozpoznania}
  - p: 30
    role: item
    layout: {align: justify, size: 11.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
    text: zasądzenie zwrotu kosztów postępowania odwoławczego.
  - {p: 31, role: spacer}
  - p: 32
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: Uzasadnienie
  - p: 33
    role: blank_line
    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………'
    slots:
