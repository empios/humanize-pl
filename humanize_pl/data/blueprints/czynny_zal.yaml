# Szkielet struktury: czynny żal.
# Wzorce `matches` oparte o sformułowania z szablonów kancelarii.

category: czynny_zal
label_pl: czynny żal
check_order: false
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  matches: [dnia, ' r.', miejscowość, (data]
- id: wnoszący
  label_pl: oznaczenie wnoszącego
  severity: required
  matches: [dane wnoszącego, imię i nazwisko, adres]
- id: adresat
  label_pl: organ
  severity: required
  matches: [naczelnik, urząd skarbowy, organ]
- id: podstawa
  label_pl: podstawa (art. 16 k.k.s.)
  severity: required
  matches: [art. 16, kodeks karny skarbowy, na podstawie]
- id: czyn
  label_pl: opis czynu zabronionego
  severity: required
  matches: [czyn zabroniony, polegającego na, zawiadamiam o popełnieniu]
- id: uzasadnienie
  label_pl: uzasadnienie
  severity: required
  matches: [uzasadnienie, uzasadnieniem]
- id: podpis
  label_pl: podpis
  severity: required
  matches: [podpis, własnoręczny]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  template: Czynny żal (k.p.a.).docx
  label_pl: Czynny żal (k.k.s.)
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 2269, bottom: 2268, left: 1418, right: 1418}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, indent: {first: 708}, size: 10.0, spans: [{start: 12, end: 23, italic: true}]}
    text: …………………………… miejscowość, dnia ……………………r.
    slots:
    - {id: p0_1, span: [0, 11], type: text, context: ▢ miejscowość dnia}
    - {id: p0_2, span: [30, 38], type: date, context: miejscowość dnia ▢ r.}
  - {p: 1, role: spacer}
  - p: 2
    role: blank_line
    layout: {indent: {left: 4820}, size: 10.0}
    text: …………………………………………
    slots:
    - {id: p2_1, span: [0, 16], type: text, context: ▢}
  - p: 3
    role: blank_line
