    slots:
    - {id: powod, span: [0, 36], type: text, hint: 'imię i nazwisko lub nazwa, adres', label: Powód}
  - p: 9
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(imię i nazwisko lub nazwa, adres)'
    hint_for: 8
    hint_kind: label
  - p: 10
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Pozwany:'
  - p: 11
