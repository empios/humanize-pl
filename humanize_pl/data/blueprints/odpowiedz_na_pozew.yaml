# Szkielet struktury: odpowiedź na pozew i sprzeciwy pozwanego (k.p.c.).
#
# Pismo procesowe pozwanego (art. 126 k.p.c.): oznaczenie sądu, stron i sygnatury,
# wnioski co do powództwa, stanowisko z zarzutami, twierdzenia i dowody. Sprzeciw
# od nakazu zapłaty (art. 505 § 2) i od wyroku zaocznego (art. 344 § 2) mają tę samą
# budowę i są wzorami szczególnymi tej kategorii.

category: odpowiedz_na_pozew
label_pl: odpowiedź na pozew
check_order: false
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  # Linia „miejscowość, data” albo jej podpis we wzorze.
  patterns:
  - '^(?=.{0,90}$)[\p{L}…. ()\t\-]{1,60},\s*(?:dnia\s+)?(?:\d{1,2}\b|…|\.{2,})'
  - '\(miejscowość\W+(?:i\s+)?data'
- id: sad
  label_pl: oznaczenie sądu
  severity: required
  matches: ['sąd:', sąd rejonowy, sąd okręgowy]
- id: strony
  label_pl: oznaczenie stron
  severity: required
  matches: [powód, pozwan]
- id: sygnatura
  label_pl: sygnatura akt
  severity: expected
  matches: [sygn]
- id: wnioski
  label_pl: wnioski co do powództwa
  severity: required
  matches: ['wnoszę o:']
- id: uzasadnienie
  label_pl: uzasadnienie
  severity: required
  matches: [uzasadnienie]
- id: dowody
  label_pl: dowody
  severity: expected
  matches: ['dowody:']
- id: podpis
  label_pl: podpis
  severity: required
  matches: [podpis]

# Dokument ogólny: wzór do wypełnienia, bez nazwy konkretnego sądu ani organu.
# Przy użyciu wypełnia się wyłącznie pola (`slots`); treść, kolejność i układ
# zostają jak we wzorze.
document:
  label_pl: Odpowiedź na pozew
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 1417, bottom: 1417, left: 1417, right: 1417}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, size: 11.0}
    text: '………………… (miejscowość), dnia ………………… (data)'
    slots:
    - {id: miejscowosc, span: [0, 7], type: place, hint: miejscowość}
    - {id: data, span: [28, 35], type: date, hint: data}
    inline_hints:
    - {span: [8, 21], text: miejscowość}
    - {span: [36, 42], text: data}
  - {p: 1, role: spacer}
  - p: 2
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Sąd:'
  - p: 3
    role: blank_line
    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………'
    slots:
    - {id: sad, span: [0, 36], type: text, hint: 'nazwa sądu, wydział i adres', label: Sąd}
  - p: 4
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(nazwa sądu, wydział i adres)'
    hint_for: 3
    hint_kind: label
  - p: 5
    role: field
    layout: {align: justify, size: 11.0}
