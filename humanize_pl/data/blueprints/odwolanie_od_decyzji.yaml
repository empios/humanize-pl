  - {p: 12, role: spacer}
  - p: 13
    role: field
    layout: {align: justify, size: 11.0}
    text: 'Znak sprawy: …………………'
    slots:
    - {id: znak_sprawy, span: [13, 20], type: text, label: Znak sprawy}
  - {p: 14, role: spacer}
  - p: 15
    role: title
    layout: {align: center, size: 14.0, bold: true}
    text: ODWOŁANIE OD DECYZJI
  - {p: 16, role: spacer}
  - p: 17
    role: body
    layout: {align: justify, size: 11.0}
    text: Na podstawie ………………… (podstawa prawna odwołania) wnoszę odwołanie od decyzji ………………… (organ, który wydał decyzję) z dnia ………………… (data decyzji) nr ………………… (numer decyzji).
    slots:
    - {id: podstawa_prawna_odwolania, span: [13, 20], type: text, hint: podstawa prawna odwołania}
    - {id: organ_wydajacy_decyzje, span: [77, 84], type: text, hint: 'organ, który wydał decyzję'}
    - {id: data_decyzji, span: [121, 128], type: date, hint: data decyzji}
    - {id: numer_decyzji, span: [147, 154], type: text, hint: numer decyzji}
    inline_hints:
