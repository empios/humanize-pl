# Szkielet struktury: odwołanie od decyzji.
# Wzorce `matches` oparte o sformułowania z szablonów kancelarii.

category: odwolanie_od_decyzji
label_pl: odwołanie od decyzji
check_order: false
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  # Linia „miejscowość, data” albo jej podpis we wzorze. Same „dnia” i „r.”
  # trafiały też w „ustawy z dnia 26 czerwca 1974 r.”, więc usunięta data
  # uchodziła za obecną.
  patterns:
  - '^(?=.{0,90}$)[\p{L}…. ()\t\-]{1,60},\s*(?:dnia\s+)?(?:\d{1,2}\b|…|\.{2,})'
  - '\(miejscowość\W+(?:i\s+)?data'
  - 'zawart\w*\s+(?:w\s+dniu|dnia)\b'
- id: adresat
  label_pl: oznaczenie organu
  severity: required
  matches: [organ, sąd, urząd, prezys, dyrektor, naczelnik, zakład ubezpieczeń, ubezpieczyciel]
- id: wnoszący
  label_pl: oznaczenie wnoszącego
  severity: required
  matches: [dane, imię i nazwisko, adres, zam., ubezpieczon]
- id: decyzja
  label_pl: oznaczenie zaskarżonej decyzji
  severity: required
  matches: [decyzji, decyzję, postanowienie, od decyzji]
- id: zadanie
  label_pl: żądanie
  severity: required
  matches: [wnoszę o, odwołuję, zaskarżam, uchylenie, zmianę, odwołanie]
- id: uzasadnienie
  label_pl: uzasadnienie
  severity: required
  matches: [uzasadnienie, uzasadnieniem, powody, w związku z, powo]
- id: podpis
  label_pl: podpis
  severity: required
  matches: [podpis]
  # „Z poważaniem” zamyka pismo, nie tytułuje sekcji: pod nim jest tylko
  # odręczny podpis. Wzorzec, w przeciwieństwie do `matches`, nie każe
  # szukać pod nim treści.
  patterns: ['z poważaniem']

# Dokument ogólny: odwołanie do organu odwoławczego, bez nazwy konkretnego organu,
# więc pasuje do decyzji każdego organu. Wzór dla decyzji ZUS jest wzorem
# szczególnym w data/templates/odwolanie_od_decyzji/. Przy użyciu wypełnia się
# wyłącznie pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  label_pl: Odwołanie od decyzji
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 1417, bottom: 1417, left: 1417, right: 1417}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, size: 11.0}
    text: '………………… (miejscowość), dnia ………………… (data)'
    slots:
    - {id: miejscowosc, span: [0, 7], type: place, hint: miejscowość}
    - {id: data, span: [28, 35], type: date, hint: data}
    inline_hints:
    - {span: [8, 21], text: miejscowość}
    - {span: [36, 42], text: data}
  - {p: 1, role: spacer}
  - p: 2
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Odwołujący się:'
  - p: 3
    role: blank_line
    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………'
    slots:
    - {id: odwolujacy, span: [0, 36], type: text, hint: 'imię i nazwisko lub nazwa, adres, PESEL lub NIP', label: Odwołujący się}
  - p: 4
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(imię i nazwisko lub nazwa, adres, PESEL lub NIP)'
    hint_for: 3
    hint_kind: label
  - {p: 5, role: spacer}
  - p: 6
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Organ odwoławczy:'
  - p: 7
    role: blank_line
    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………'
    slots:
    - {id: organ_odwolawczy, span: [0, 36], type: text, hint: nazwa i siedziba organu odwoławczego, label: Organ odwoławczy}
  - p: 8
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(nazwa i siedziba organu odwoławczego)'
    hint_for: 7
    hint_kind: label
  - p: 9
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Za pośrednictwem:'
  - p: 10
    role: blank_line
    layout: {align: justify, size: 11.0}
