    - {id: organ_pierwszej_instancji, span: [0, 36], type: text, hint: 'nazwa i siedziba organu, który wydał decyzję', label: Za pośrednictwem}
  - p: 11
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(nazwa i siedziba organu, który wydał decyzję)'
    hint_for: 10
