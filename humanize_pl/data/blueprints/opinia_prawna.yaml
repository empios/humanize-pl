# Szkielet opinii prawnej.
#
# Zastrzeżenia są tu `required` nie z pedanterii: opinia bez zakreślenia
# granic (stan na dzień, oparcie na przekazanych dokumentach) bywa czytana
# szerzej, niż autor zamierzał.

category: opinia_prawna
label_pl: opinia prawna
numbering: roman

sections:
  - id: przedmiot
    label_pl: przedmiot opinii (pytanie)
    severity: required
    matches: ["przedmiot opinii", "przedmiotem opinii", "pytanie prawne", "zakres opinii"]

  - id: stan_faktyczny
    label_pl: stan faktyczny
    severity: required
    matches: ["stan faktyczny", "stanu faktycznego"]

  - id: podstawa_prawna
    label_pl: podstawa prawna
    severity: required
    matches: ["podstawa prawna", "podstawy prawne", "stan prawny"]

  - id: analiza
    label_pl: analiza prawna
    severity: required
    matches: ["analiza", "ocena prawna", "rozważania"]

  - id: wnioski
    label_pl: wnioski
    severity: required
    matches: ["wnioski", "konkluzje", "podsumowanie"]

  - id: zastrzezenia
    label_pl: zastrzeżenia i granice opinii
    severity: required
    matches: ["zastrzeżenia", "opinia została sporządzona", "stan prawny na dzień"]

  - id: orzecznictwo
    label_pl: powołane orzecznictwo lub piśmiennictwo
    severity: expected
    matches: ["wyrok sn", "orzecznictwo", "sygn. akt", "w doktrynie"]

  - id: podpis
    label_pl: data i podpis sporządzającego
    severity: required
    matches: ["podpis", "radca prawny", "adwokat", "sporządził"]

# Dokument ogólny napisany dla tej kategorii: wśród realnych wzorów nie było
# ogólnego. Przy użyciu wypełnia się wyłącznie pola (`slots`).
document:
  label_pl: Opinia prawna
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 1417, bottom: 1417, left: 1417, right: 1417}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, size: 11.0}
    text: ………………………… (miejscowość), dnia ………………… (data)
    slots:
    - {id: miejscowosc, span: [0, 10], type: place, hint: miejscowość}
    - {id: data, span: [31, 38], type: date, hint: data}
    inline_hints:
    - {span: [11, 24], text: miejscowość}
    - {span: [39, 45], text: data}
  - {p: 1, role: spacer}
  - p: 2
    role: title
    layout: {align: center, size: 14.0, bold: true}
    text: OPINIA PRAWNA
  - {p: 3, role: spacer}
  - p: 4
    role: field
    layout: {align: justify, size: 11.0}
    text: 'Zleceniodawca: ……………………………………… (imię i nazwisko lub firma)'
    slots:
    - {id: zleceniodawca, span: [15, 30], type: person, hint: imię i nazwisko lub firma, label: Zleceniodawca}
