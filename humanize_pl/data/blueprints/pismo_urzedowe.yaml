# Szkielet pisma do organu.
#
# Oznaczenie wnioskodawcy jest wymagane, bo pismo bez niego organ pozostawia
# bez rozpoznania — brak dotkliwszy niż cokolwiek w warstwie stylistycznej.
#
# Wzorce `matches` poszerzone o sformułowania z szablonów kancelarii (adresat:
# sąd/pracodawca/ubezpieczyciel; wnioskodawca: dane klienta/pracownika).
# `podstawa prawna` jest `expected` — nie każde pismo ją zawiera (np. wniosek
# o zmianę terminu). Podpis jest `expected`, bo w szablonach bywa jedynie
# "(własnoręczny podpis)" albo "Z poważaniem" jako nagłówek, a nie treść.

category: pismo_urzedowe
label_pl: pismo urzędowe
check_order: false
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  # Linia „miejscowość, data” albo jej podpis we wzorze. Same „dnia” i „r.”
  # trafiały też w „ustawy z dnia 26 czerwca 1974 r.”, więc usunięta data
  # uchodziła za obecną.
  patterns:
  - '^(?=.{0,90}$)[\p{L}…. ()\t\-]{1,60},\s*(?:dnia\s+)?(?:\d{1,2}\b|…|\.{2,})'
  - '\(miejscowość\W+(?:i\s+)?data'
  - 'zawart\w*\s+(?:w\s+dniu|dnia)\b'
- id: adresat
  label_pl: oznaczenie organu (adresat)
  severity: required
  matches: ['do:', urząd, organ, prezydent, wójt, starost, naczelnik, sąd rejonowy, sąd okręgowy, sąd,
    zakład ubezpieczeń, ubezpieczyciel, pracodawc, sprzedawcy, odbiorcy]
- id: wnioskodawca
  label_pl: oznaczenie wnioskodawcy z adresem
  severity: required
  matches: ['wnioskodawca:', imię i nazwisko, 'imię, nazwisko', adres do doręczeń, zam., adres wnioskodawcy,
    dane wnioskodawcy, dane klienta, dane pracownika, dane pracodawcy, dane zawiadamiającego, dane wnoszącego,
    dane reklamującego, dane odbiorcy, (dane]
- id: zadanie
  label_pl: treść żądania
  severity: required
  matches: [wnoszę o, zwracam się, proszę o, składam wniosek, zawiadamiam o, nakładam, odwołuję, wzywam,
    oświadczam]
- id: podstawa
  label_pl: podstawa prawna
  severity: expected
  matches: [na podstawie art, podstawą wniosku, zgodnie z art, na podstawie ustawy, na podstawie kodeksu,
    na podstawie]
- id: sposob_odpowiedzi
  label_pl: wskazany sposób doręczenia odpowiedzi
  severity: expected
  matches: [w formie elektronicznej, na adres, drogą pocztową, na mój adres, przesłanie, odpowiedzi]
- id: podpis
  label_pl: podpis wnioskodawcy
  severity: expected
  matches: [podpis, własnoręczny podpis, z wyrazami szacunku]

# Dokument ogólny: pismo do urzędu lub sądu bez nazwy konkretnej sprawy, więc
# pasuje do odpowiedzi na wezwanie, wyjaśnień i zwykłych wniosków. Wniosek
# o udostępnienie informacji publicznej jest wzorem szczególnym
# w data/templates/pismo_urzedowe/. Przy użyciu wypełnia się wyłącznie pola
# (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  label_pl: Pismo do urzędu lub sądu
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 1417, bottom: 1417, left: 1417, right: 1417}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, size: 11.0}
    text: '………………… (miejscowość), dnia ………………… (data)'
    slots:
    - {id: miejscowosc, span: [0, 7], type: place, hint: miejscowość}
    - {id: data, span: [28, 35], type: date, hint: data}
    inline_hints:
    - {span: [8, 21], text: miejscowość}
    - {span: [36, 42], text: data}
  - {p: 1, role: spacer}
  - p: 2
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Wnoszący pismo:'
  - p: 3
    role: blank_line
    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………'
    slots:
    - {id: wnoszacy, span: [0, 36], type: text, hint: 'imię i nazwisko lub nazwa, adres do doręczeń, PESEL lub NIP', label: Wnoszący pismo}
  - p: 4
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(imię i nazwisko lub nazwa, adres do doręczeń, PESEL lub NIP)'
    hint_for: 3
    hint_kind: label
  - {p: 5, role: spacer}
  - p: 6
    role: field_header
    layout: {align: justify, size: 11.0}
    text: 'Do:'
  - p: 7
    role: blank_line
    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………'
    slots:
    - {id: adresat, span: [0, 36], type: text, hint: nazwa i siedziba urzędu lub sądu, label: Do}
  - p: 8
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(nazwa i siedziba urzędu lub sądu)'
    hint_for: 7
    hint_kind: label
  - {p: 9, role: spacer}
  - p: 10
    role: field
    layout: {align: justify, size: 11.0}
    text: 'Znak sprawy: …………………'
    slots:
    - {id: znak_sprawy, span: [13, 20], type: text, label: Znak sprawy}
  - p: 11
    role: field
    layout: {align: justify, size: 11.0}
    text: 'Dotyczy: …………………'
    slots:
    - {id: dotyczy, span: [9, 16], type: text, label: Dotyczy}
  - {p: 12, role: spacer}
  - p: 13
    role: title
    layout: {align: center, size: 14.0, bold: true}
    text: PISMO
  - {p: 14, role: spacer}
  - p: 15
    role: body
    layout: {align: justify, size: 11.0}
    text: Działając w imieniu własnym, nawiązując do pisma z dnia ………………… (data otrzymanego pisma), zwracam się z następującym stanowiskiem.
    slots:
    - {id: data_otrzymanego_pisma, span: [56, 63], type: date, hint: data otrzymanego pisma}
    inline_hints:
    - {span: [64, 88], text: data otrzymanego pisma}
  - p: 16
    role: blank_line
    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………'
    slots:
    - {id: tresc, span: [0, 108], type: text, hint: 'wyjaśnienia, wnioski lub żądanie wraz z uzasadnieniem'}
  - p: 17
    role: hint
    layout: {align: justify, size: 8.0, italic: true}
    text: '(wyjaśnienia, wnioski lub żądanie wraz z uzasadnieniem)'
    hint_for: 16
    hint_kind: instruction
  - {p: 18, role: spacer}
  - p: 19
    role: body
    layout: {align: justify, size: 11.0}
    text: Pismo składam na podstawie ………………… (podstawa prawna).
    slots:
    - {id: podstawa_prawna, span: [27, 34], type: text, hint: podstawa prawna}
    inline_hints:
    - {span: [35, 52], text: podstawa prawna}
  - p: 20
    role: body
    layout: {align: justify, size: 11.0}
    text: Odpowiedź proszę przesłać na adres ………………… (adres pocztowy lub elektroniczny).
    slots:
    - {id: adres_odpowiedzi, span: [35, 42], type: text, hint: adres pocztowy lub elektroniczny}
    inline_hints:
    - {span: [43, 77], text: adres pocztowy lub elektroniczny}
  - {p: 21, role: spacer}
  - p: 22
    role: blank_line
    layout: {align: right, size: 11.0}
    text: '………………………………'
    slots:
    - {id: podpis, span: [0, 12], type: signature, hint: podpis}
  - p: 23
    role: hint
    layout: {align: right, size: 8.0, italic: true}
    text: '(podpis)'
    hint_for: 22
    hint_kind: label
  - {p: 24, role: spacer}
  - p: 25
    role: field_header
    layout: {align: justify, size: 11.0, bold: true}
    text: 'Załączniki:'
  - p: 26
    role: item
    layout: {align: justify, size: 11.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
    text: '………………… (kopie dokumentów, jeśli są dołączone).'
    slots:
    - {id: zalaczniki, span: [0, 7], type: text, hint: 'kopie dokumentów, jeśli są dołączone'}
    inline_hints:
    - {span: [8, 46], text: 'kopie dokumentów, jeśli są dołączone'}
