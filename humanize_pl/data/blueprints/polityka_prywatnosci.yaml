    inline_hints:
    - {span: [29, 46], text: określenie celu}
  - p: 12
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 42, end: 55, italic: true}]}
