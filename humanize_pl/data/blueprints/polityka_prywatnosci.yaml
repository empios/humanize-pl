# Szkielet polityki prywatności.
#
# Sekcje wymagane odpowiadają obowiązkowi informacyjnemu z art. 13 RODO.
# Brak pouczenia o prawie skargi do organu nadzorczego to nie stylistyka —
# to brak elementu, którego przepis wymaga wprost.
#
# Wzorce poszerzone o sformułowania z klauzul informacyjnych kancelarii
# (administrator "jest", kontakt "@"/e-mail, cele "w celu", podstawy
# "na podstawie", odbiorcy "udostępnić/kategoriom podmiotów").

category: polityka_prywatnosci
label_pl: polityka prywatności
numbering: paragraph
check_order: false
sections:
- id: administrator
  label_pl: tożsamość administratora
  severity: required
  matches: [administratorem danych, administrator danych, administratorem pani/pana danych, administratora
      jest, administratorem jest, administratorem danych osobowych jest]
- id: kontakt
  label_pl: dane kontaktowe (administrator lub IOD)
  severity: required
  matches: [inspektor ochrony danych, kontakt, adres e-mail, '@', można się kontaktować, adres korespondencyjny,
    e-mail, mail, telefon]
- id: cele
  label_pl: cele przetwarzania
  severity: required
  matches: [cele przetwarzania, cel przetwarzania, przetwarzane w celu, w następujących celach, w celach,
    w celu]
- id: podstawy
  label_pl: podstawa prawna przetwarzania
  severity: required
  matches: [podstawa prawna, podstawy prawne, podstawą przetwarzania, przetwarzane na podstawie, na podstawie,
    obowiązku]
- id: odbiorcy
  label_pl: odbiorcy danych
  severity: required
  matches: [odbiorcy danych, odbiorcami danych, podmioty przetwarzające, odbiorcami pani/pana danych,
    udostępnić, kategoriom podmiotów]
- id: okres
  label_pl: okres przechowywania
  severity: required
  matches: [okres przechowywania, przechowywane przez okres, przez okres, okres przetwarzania, okresu]
- id: prawa
  label_pl: prawa osoby, której dane dotyczą
  severity: required
  matches: [prawo dostępu, prawa osoby, przysługuje prawo, przysługuje pani/panu prawo, prawo do, żądania
      od administratora]
- id: skarga
  label_pl: prawo skargi do organu nadzorczego
  severity: required
  matches: [skargi do, organu nadzorczego, prezesa urzędu ochrony danych, uodo]
- id: panstwa_trzecie
  label_pl: przekazywanie do państw trzecich
  severity: expected
  matches: [państwa trzeciego, poza europejski obszar, państw trzecich, państwa trzeciej]
- id: profilowanie
  label_pl: informacja o profilowaniu
  severity: expected
  matches: [profilowani, zautomatyzowanego podejmowania decyzji, zautomatyzowanemu podejmowaniu decyzji]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  template: Klauzula RODO.docx
  label_pl: Klauzula RODO
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 2269, bottom: 2268, left: 1418, right: 1418}}
  blocks:
  - p: 0
    role: title
    layout: {align: center, size: 14.0, bold: true}
    text: 'KLAUZULA INFORMACYJNA '
  - p: 1
    role: body
    layout: {align: center, size: 14.0, bold: true}
    text: DOTYCZĄCA PRZETWARZANIA DANYCH OSOBOWYCH
  - {p: 2, role: spacer}
  - p: 3
    role: body
    layout: {align: justify, size: 10.0}
    text: 'Wypełniając obowiązek, o którym mowa w art. 13 rozporządzenia Parlamentu Europejskiego i Rady (UE) 2016/679 z dnia 27 kwietnia 2016 r.
      w sprawie ochrony osób fizycznych w związku z przetwarzaniem danych osobowych i w sprawie swobodnego przepływu takich danych oraz uchylenia
      dyrektywy 95/46/WE (ogólne rozporządzenie o ochronie danych) (Dz.U.UE.L.2016.119.1 ze zm.) (dalej jako RODO), informujemy, że:'
  - p: 4
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 97, end: 119, italic: true},
        {start: 150, end: 176, italic: true}, {start: 237, end: 255, italic: true}]}
    text: 'Administratorem Pani/Pana danych osobowych (dalej jako Administrator) jest ……………………………………………………… (nazwa Administratora) z siedzibą w
      ………………………………………… (siedziba Administratora), prowadzący działalność gospodarczą pod firmą …………………………………… (oznaczenie firmy) NIP: ………………………,
      REGON: ………………………….'
    slots:
    - {id: nazwa_administratora, span: [75, 96], type: text, hint: nazwa Administratora}
    - {id: siedziba_administratora, span: [133, 149], type: address, hint: siedziba Administratora}
    - {id: oznaczenie_firmy, span: [222, 236], type: company, hint: oznaczenie firmy}
    - {id: p4_4, span: [261, 270], type: id_number, context: gospodarczą pod firmą NIP ▢ REGON}
    - {id: p4_5, span: [279, 290], type: id_number, context: pod firmą NIP REGON ▢}
    inline_hints:
    - {span: [97, 119], text: nazwa Administratora}
    - {span: [150, 175], text: siedziba Administratora}
    - {span: [237, 255], text: oznaczenie firmy}
  - p: 5
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 83, end: 122, italic: true},
        {start: 180, end: 209, italic: true}]}
    text: 'Z Administratorem można się kontaktować pisemnie na adres ……………………………………………………………… (adres korespondencyjny Administratora) lub poprzez
      pocztę elektroniczną na adres: ………………………………… (adres e-mail Administratora).'
    slots:
    - {id: adres_korespondencyjny_administratora, span: [58, 82], type: address, hint: adres korespondencyjny Administratora}
    - {id: adres_e_mail_administratora, span: [166, 179], type: address, hint: adres e-mail Administratora}
    inline_hints:
    - {span: [83, 122], text: adres korespondencyjny Administratora}
    - {span: [180, 209], text: adres e-mail Administratora}
  - p: 6
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: 'Pani/Pana dane osobowe są przetwarzane na podstawie:'
  - p: 7
    role: item
    layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
    text: ………… (przepis) RODO - …………………………………… (ewentualnie podstawy przetwarzania danych).
    slots:
    - {id: przepis, span: [0, 4], type: text, hint: przepis}
    - {id: ewentualnie_podstawy_przetwarzania_danych, span: [22, 36], type: text, hint: ewentualnie podstawy przetwarzania danych}
    inline_hints:
    - {span: [5, 14], text: przepis}
    - {span: [37, 80], text: ewentualnie podstawy przetwarzania danych}
  - p: 8
    role: item
    layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
    text: ………… (przepis) RODO - …………………………………… (ewentualnie podstawy przetwarzania danych).
    slots:
    - {id: przepis_2, span: [0, 4], type: text, hint: przepis}
    - {id: ewentualnie_podstawy_przetwarzania_danych_2, span: [22, 36], type: text, hint: ewentualnie podstawy przetwarzania danych}
    inline_hints:
    - {span: [5, 14], text: przepis}
    - {span: [37, 80], text: ewentualnie podstawy przetwarzania danych}
  - p: 9
    role: item
    layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
    text: ………… (przepis) RODO - …………………………………… (ewentualnie podstawy przetwarzania danych).
    slots:
    - {id: przepis_3, span: [0, 4], type: text, hint: przepis}
    - {id: ewentualnie_podstawy_przetwarzania_danych_3, span: [22, 36], type: text, hint: ewentualnie podstawy przetwarzania danych}
    inline_hints:
    - {span: [5, 14], text: przepis}
    - {span: [37, 80], text: ewentualnie podstawy przetwarzania danych}
  - p: 10
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: 'Dane osobowe są przetwarzane przez Administratora w następujących celach:'
  - p: 11
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 29, end: 46, italic: true}]}
    text: w celu ……………………………………………………… (określenie celu) w ramach prowadzonej przez Administratora działalności gospodarczej;
    slots:
