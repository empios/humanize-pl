    layout: {align: justify, size: 10.0, marker: {text: '13.', kind: decimal, src: auto, level: 0}}
    text: Pani/Pana dane osobowe nie będą wykorzystywane do zautomatyzowanego podejmowania decyzji, w tym do profilowania.
  - {p: 29, role: spacer}
