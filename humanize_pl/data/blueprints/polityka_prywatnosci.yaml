    - {span: [42, 55], text: nazwa umowy}
  - p: 13
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}, spans: [{start: 306, end: 320, italic: true}]}
    text: "Odbiorcami Pani/Pana danych osobowych mogą być podmioty świadczące na rzecz Administratora w szczególności usługi telekomunikacyjne,\
      \ informatyczne i księgowe oraz inne podmioty, które muszą zostać dopuszczone do przetwarzania Pani/Pana danych osobowych \nw celu należytego\
      \ wykonania umowy …………………………………………… (nazwa umowy)."
    slots:
    - {id: nazwa_umowy_2, span: [288, 305], type: text, hint: nazwa umowy}
    inline_hints:
    - {span: [306, 319], text: nazwa umowy}
  - p: 14
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}}
    text: Pani/Pana dane osobowe nie będą przekazywane do państwa trzeciego lub organizacji międzynarodowej.
  - p: 15
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '9.', kind: decimal, src: auto, level: 0}, spans: [{start: 69, end: 97, italic: true}]}
    text: Pani/Pana dane osobowe będą przetwarzane przez okres ……………………………………… (okres przetwarzania danych).
    slots:
    - {id: okres_przetwarzania_danych, span: [53, 68], type: text, hint: okres przetwarzania danych}
    inline_hints:
    - {span: [69, 97], text: okres przetwarzania danych}
  - p: 16
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '10.', kind: decimal, src: auto, level: 0}}
    text: 'W związku z przetwarzaniem Pani/Pana danych osobowych przysługuje Pani/Panu prawo do:'
  - p: 17
    role: item
    layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
    text: żądania od Administratora dostępu do Pani/Pana danych osobowych;
  - p: 18
    role: item
    layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
    text: żądania od Administratora sprostowania Pani/Pana danych osobowych;
  - p: 19
    role: item
    layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
    text: żądania od Administratora usunięcia Pani/Pana danych osobowych;
  - p: 20
    role: item
    layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
    text: żądania od Administratora ograniczenia przetwarzania Pani/Pana danych osobowych;
  - p: 21
    role: item
    layout: {align: justify, size: 10.0, marker: {text: e), kind: lowerLetter, src: auto, level: 0}}
    text: wniesienia sprzeciwu wobec przetwarzania Pani/Pana danych osobowych;
  - p: 22
    role: item
    layout: {align: justify, size: 10.0, marker: {text: f), kind: lowerLetter, src: auto, level: 0}}
    text: przenoszenia Pani/Pana danych osobowych;
  - p: 23
    role: item
    layout: {align: justify, size: 10.0, marker: {text: g), kind: lowerLetter, src: auto, level: 0}}
