    text: W przypadku pozyskania danych osobowych w sposób inny niż od osoby, której dane dotyczą, źródłem pochodzenia takich danych są …………………………………………………………………
      ………………………………………………………………… (źródła pozyskania danych, np. Internet)
    slots:
    - {id: zrodla_pozyskania_danych_np_internet, span: [126, 177], type: text, hint: 'źródła pozyskania danych, np. Internet'}
    inline_hints:
    - {span: [178, 218], text: 'źródła pozyskania danych, np. Internet'}
  - p: 25
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '12.', kind: decimal, src: auto, level: 0}}
    text: 'Podanie przez Panią/Pana danych osobowych:'
  - p: 26
    role: item
    layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
    text: jest dobrowolne i może być w każdej chwili cofnięte – dotyczy osób, które wyraziły zgodę na przetwarzanie swoich danych osobowych;
  - p: 27
    role: item
    layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 61, end: 74, italic: true},
        {start: 221, end: 234, italic: true}]}
    text: jest niezbędne i jest warunkiem zawarcia umowy ………………………………… (nazwa umowy) i jej należytego wykonania – dotyczy osób, z którymi Administrator
      zawarł umowę lub podjął czynności zmierzające do wykonania umowy ………………………………… (nazwa umowy).
    slots:
    - {id: nazwa_umowy_3, span: [47, 60], type: text, hint: nazwa umowy}
    - {id: nazwa_umowy_4, span: [207, 220], type: text, hint: nazwa umowy}
    inline_hints:
