  - p: 63
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 181,
          end: 202, bold: true}]}
    text: Podmiot przetwarzający oświadcza, że w związku ze zobowiązaniem do zachowania w tajemnicy danych poufnych nie będą one wykorzystywane,
      ujawniane ani udostępniane bez pisemnej zgody Administratora danych w innym celu niż wykonanie Umowy, chyba że konieczność ujawnienia posiadanych
      informacji wynika z obowiązujących przepisów prawa lub Umowy.
  - p: 64
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Strony zobowiązują się do dołożenia wszelkich starań w celu zapewnienia, aby środki łączności wykorzystywane do odbioru, przekazywania
      oraz przechowywania danych poufnych gwarantowały zabezpieczenie danych poufnych w tym w szczególności danych osobowych powierzonych do przetwarzania,
      przed dostępem osób trzecich nieupoważnionych do zapoznania się z ich treścią.
  - {p: 65, role: spacer}
  - p: 66
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
    text: '§ 9

      Postanowienia końcowe'
  - {p: 67, role: spacer}
  - p: 68
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Umowa została sporządzona w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron.
  - p: 69
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: W sprawach nieuregulowanych zastosowanie będą miały przepisy ustawy Kodeks cywilny oraz Rozporządzenia RODO.
  - p: 70
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 137, end: 158, bold: true}]}
    text: 'Sądem właściwym dla rozpatrzenia sporów wynikających z niniejszej umowy będzie sąd właściwy miejsmiejscowo cowego ze względu na siedzibę
      Administratora danych. '
