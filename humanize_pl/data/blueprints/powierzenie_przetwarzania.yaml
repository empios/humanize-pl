    layout: {align: center, size: 12.0, bold: true, marker: {text: § 1, kind: paragraph, src: manual, level: 0}}
    text: '§ 1

      Powierzenie przetwarzania danych osobowych'
  - {p: 17, role: spacer}
  - p: 18
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 26, end: 47, bold: true}, {start: 56,
          end: 83, bold: true}]}
    text: "Na mocy niniejszej Umowy, Administrator danych powierza Podmiotowi przetwarzającemu dane osobowe do przetwarzania na zasadach i w celach\
      \ określonych w Umowie, w trybie art. 28 Rozporządzenia Parlamentu Europejskiego i Rady (UE) 2016/679 z dnia 27 kwietnia 2016 r. \nw sprawie\
      \ ochrony osób fizycznych w związku z przetwarzaniem danych osobowych i w sprawie swobodnego przepływu takich danych oraz uchylenia dyrektywy\
      \ 95/46/WE (ogólne rozporządzenie o ochronie danych) (zwanego w dalszej części umowy Rozporządzeniem RODO)."
  - p: 19
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
    text: "Podmiot przetwarzający zobowiązuje się przetwarzać powierzone mu dane osobowe zgodnie \nz niniejszą umową, Rozporządzeniem RODO oraz\
      \ z innymi przepisami prawa powszechnie obowiązującego, które chronią prawa osób, których dane dotyczą."
  - p: 20
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
    text: Podmiot przetwarzający oświadcza, że stosuje środki bezpieczeństwa spełniające wymogi Rozporządzenia RODO.
