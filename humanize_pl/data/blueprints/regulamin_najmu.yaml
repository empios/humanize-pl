    layout: {align: justify, size: 10.0}
    text: Przedmiotem regulaminu jest krótkoterminowy najem lokalu, którego cechy są określone w ofercie wynajmu krótkoterminowego. Właściciel obiektu
      nie świadczy na rzecz Najemcy żadnych dodatkowych usług. W szczególności właściciel obiektu nie świadczy na rzecz Najemcy usług hotelarskich
