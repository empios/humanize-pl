    text: Niniejszy Regulamin określa warunki wynajmu krótkoterminowego lokalu położonego w ……….. przy ul. ……………. w …………………………………………… Warunkiem
      rezerwacji jest zaakceptowanie postanowień niniejszego regulaminu.
    slots:
