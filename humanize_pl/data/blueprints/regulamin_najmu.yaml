    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Najemca zobowiązany jest poinformować właściciela obiektu o planowanej godzinie przyjazdu, najpóźniej w dniu poprzedzającym planowany
      dzień przyjazdu. Najemca zobowiązany jest natychmiast poinformować właściciela obiektu o braku możliwości dotarcia na umówioną wcześniej godzinę.
      Właściciel obiektu nie ponosi odpowiedzialności wobec Najemcy za ewentualne opóźnienia w wydaniu obiektu spowodowane brakiem właściwego zawiadomienia
      o godzinie przyjazdu.
