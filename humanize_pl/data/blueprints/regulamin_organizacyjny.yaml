    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Podstawą do udzielenia świadczeń zdrowotnych, o których mowa, jest okazanie dokumentu potwierdzającego prawo do korzystania z gwarantowanych
      świadczeń zdrowotnych, dowodu osobistego lub innego dokumentu ze zdjęciem wskazującego wiek, numer PESEL oraz adres zameldowania pacjenta
      w celu zweryfikowania ubezpieczenia na portalu e-WUŚ.
  - p: 105
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: Świadczenia zdrowotne wykraczające poza zakres świadczeń finansowanych ze środków publicznych są udzielane odpłatnie.
  - {p: 106, role: spacer}
  - p: 107
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
    text: § 11
  - {p: 108, role: spacer}
  - p: 109
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Rejestracja pacjentów i umawianie wizyt odbywa się w formie elektronicznej, za pośrednictwem systemu/strony internetowej/telefonicznie/mailowo.
  - p: 110
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Niezbędne informacji w zakresie dostępu do świadczeń zdrowotnych można uzyskać …………………………
    slots:
    - {id: p110_1, span: [79, 89], type: text, context: świadczeń zdrowotnych można uzyskać ▢}
  - p: 111
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Wszystkie skargi i wnioski składane są w rejestracji/w innej formie i przekazywane Kierownikowi, który je rozpatruje.
  - {p: 112, role: spacer}
  - p: 113
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 12, kind: paragraph, src: manual, level: 0}}
    text: § 12
  - {p: 114, role: spacer}
  - p: 115
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Pacjent zamierzający skorzystać z usług ……………….. jest umawiany na wizytę.
    slots:
    - {id: p115_1, span: [40, 48], type: text, context: zamierzający skorzystać z usług ▢ jest umawiany}
  - p: 116
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Liczba przyjęć w danym dniu pacjentów jest zmienna i zależy od harmonogramu pracy ……………..
    slots:
    - {id: p116_1, span: [82, 89], type: text, context: zależy od harmonogramu pracy ▢}
  - p: 117
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Pacjentowi zgłaszającemu się z bólem świadczenia zdrowotne udzielane są w dniu zgłoszenia. Ocena zakresu udzielanego świadczenia należy
      do ……………………... Pacjent taki jest przyjmowany pomiędzy wizytami innych pacjentów, w sposób jak najmniej zakłócający udzielanie świadczeń planowanych.
    slots:
    - {id: p117_1, span: [139, 150], type: date, context: udzielanego świadczenia należy do ▢ Pacjent taki}
  - {p: 118, role: spacer}
  - p: 119
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 13, kind: paragraph, src: manual, level: 0}}
    text: § 13
  - {p: 120, role: spacer}
  - p: 121
    role: body
    layout: {align: justify, size: 10.0}
    text: Pacjentom zgłaszającym się do przychodni po raz pierwszy zakładana jest indywidualna dokumentacja medyczna.
  - {p: 122, role: spacer}
  - p: 123
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: ROZDZIAŁ 8
  - p: 124
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: Udostępnienie dokumentacji medycznej
  - {p: 125, role: spacer}
  - p: 126
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 14, kind: paragraph, src: manual, level: 0}}
    text: § 14
  - {p: 127, role: spacer}
  - p: 128
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Dokumentację medyczną udostępnia się pacjentowi lub jego przedstawicielowi ustawowemu, bądź osobie upoważnionej przez pacjenta, na podstawie
      wniosku pisemnego, ustnego lub przesłanego drogą elektroniczną.
  - p: 129
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'Dokumentacja medyczna jest udostępniana:'
  - p: 130
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
    text: do wglądu, w tym także do baz danych w zakresie ochrony zdrowia, w miejscu udzielania świadczeń zdrowotnych, z wyłączeniem medycznych
      czynności ratunkowych, albo w siedzibie podmiotu udzielającego świadczeń zdrowotnych, z zapewnieniem pacjentowi lub innym uprawnionym organom
      lub podmiotom możliwości sporządzenia notatek lub zdjęć;
  - p: 131
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
    text: przez sporządzenie jej wyciągu, odpisu, kopii lub wydruku;
  - p: 132
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
    text: przez wydanie oryginału za potwierdzeniem odbioru i z zastrzeżeniem zwrotu po wykorzystaniu, na żądanie organów władzy publicznej albo
      sądów powszechnych, a także w przypadku gdy zwłoka w wydaniu dokumentacji mogłaby spowodować zagrożenie życia lub zdrowia pacjenta;
  - p: 133
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
    text: "za pośrednictwem środków komunikacji elektronicznej na wskazany przez pacjenta adres \ne-mail;"
  - p: 134
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
    text: na informatycznym nośniku danych.
  - p: 135
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Zdjęcia wykonane na kliszy, przechowywane przez podmiot udzielający świadczeń zdrowotnych, są udostępniane za potwierdzeniem odbioru i
      z zastrzeżeniem zwrotu po wykorzystaniu.
  - p: 136
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: "Dokumentacja medyczna prowadzona w postaci papierowej może być udostępniona przez sporządzenie kopii w formie odwzorowania cyfrowego\
      \ (skanu) i przekazana w sposób określony \nw ust. 2 lit. d i e, na żądanie pacjenta lub innych uprawnionych organów lub podmiotów."
  - p: 137
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
    text: Osoba uprawniona do udostępnienia jej dokumentacji medycznej określa, czy chce całość dokumentacji medycznej, czy jej część, oraz określa,
      w jakim zakresie wnosi o udostępnienie dokumentacji medycznej.
  - p: 138
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
    text: Za udostępnienie dokumentacji medycznej w sposób określony w ust. 2 lit. b i e oraz w ust. 4 podmiot udzielający świadczeń zdrowotnych
      może pobierać opłatę.
  - p: 139
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}}
    text: 'Zgodnie z powyższym ustala się obowiązujące stawki opłaty:'
  - p: 140
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
    text: jedna strona wyciągu lub odpisu dokumentacji medycznej – ......... zł,
    slots:
    - {id: p140_1, span: [57, 66], type: text, context: lub odpisu dokumentacji medycznej ▢ zł}
  - p: 141
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
    text: jedna strona kopii albo wydruku dokumentacji medycznej – ......... zł,
    slots:
    - {id: p141_1, span: [57, 66], type: text, context: albo wydruku dokumentacji medycznej ▢ zł}
  - p: 142
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
    text: dokumentacja medyczna na elektronicznym nośniku danych – ......... zł.
    slots:
    - {id: p142_1, span: [57, 66], type: text, context: na elektronicznym nośniku danych ▢ zł.}
  - p: 143
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}}
    text: Opłaty, o której mowa w ust. 6-7, nie pobiera się w przypadku udostępnienia dokumentacji medycznej pacjentowi albo jego przedstawicielowi
      ustawowemu po raz pierwszy w żądanym zakresie i w sposób, o którym mowa w ust. 2 lit. b i e oraz w ust. 4.
  - p: 144
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '9.', kind: decimal, src: auto, level: 0}, tabs: 1}
    text: "Dokumentację udostępnia się niezwłocznie.\t"
  - p: 145
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '10.', kind: decimal, src: auto, level: 0}}
    text: Dokumentacji medycznej udostępnia się do wglądu wyłącznie na terenie podmiotu leczniczego.
  - {p: 146, role: spacer}
