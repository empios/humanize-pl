# Szkielet struktury: skarga do wojewódzkiego sądu administracyjnego.
#
# Art. 57 § 1 p.p.s.a.: wymogi pisma w postępowaniu sądowym oraz wskazanie
# zaskarżonego aktu lub czynności, oznaczenie organu i określenie naruszenia prawa
# lub interesu prawnego. Skargę wnosi się za pośrednictwem organu (art. 54 § 1).

category: skarga_wsa
label_pl: skarga do sądu administracyjnego
check_order: false
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  # Linia „miejscowość, data” albo jej podpis we wzorze.
  patterns:
  - '^(?=.{0,90}$)[\p{L}…. ()\t\-]{1,60},\s*(?:dnia\s+)?(?:\d{1,2}\b|…|\.{2,})'
  - '\(miejscowość\W+(?:i\s+)?data'
- id: sad
  label_pl: oznaczenie sądu
  severity: required
  matches: [wojewódzki sąd administracyjny]
- id: posrednictwo
  label_pl: organ pośredniczący
  severity: expected
  matches: [za pośrednictwem]
- id: skarzacy
  label_pl: oznaczenie skarżącego
  severity: required
  matches: [skarżący]
- id: organ
  label_pl: oznaczenie organu
  severity: required
  matches: ['organ:']
- id: akt
  label_pl: wskazanie zaskarżonego aktu
  severity: required
  matches: [wnoszę skargę]
- id: naruszenie
  label_pl: określenie naruszenia prawa
  severity: required
  matches: [zarzucam]
- id: wnioski
  label_pl: wnioski
  severity: required
  matches: ['wnoszę o:']
- id: uzasadnienie
  label_pl: uzasadnienie
  severity: required
  matches: [uzasadnienie]
- id: podpis
  label_pl: podpis
  severity: required
  matches: [podpis]

# Dokument ogólny: wzór do wypełnienia, bez nazwy konkretnego sądu ani organu.
# Przy użyciu wypełnia się wyłącznie pola (`slots`); treść, kolejność i układ
# zostają jak we wzorze.
document:
  label_pl: Skarga do wojewódzkiego sądu administracyjnego
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 1417, bottom: 1417, left: 1417, right: 1417}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, size: 11.0}
    text: '………………… (miejscowość), dnia ………………… (data)'
    slots:
    - {id: miejscowosc, span: [0, 7], type: place, hint: miejscowość}
    - {id: data, span: [28, 35], type: date, hint: data}
    inline_hints:
    - {span: [8, 21], text: miejscowość}
    - {span: [36, 42], text: data}
  - {p: 1, role: spacer}
