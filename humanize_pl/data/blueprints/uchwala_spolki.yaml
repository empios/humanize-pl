# Szkielet struktury: uchwała spółki.
# Wzorce `matches` oparte o sformułowania z szablonów kancelarii.

category: uchwala_spolki
label_pl: uchwała spółki
# Kolejności sekcji nie sprawdzamy: realne wzory tej kategorii układają je różnie.
check_order: false
numbering: paragraph
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  matches: [dnia, ' r.', miejscowość, (data]
- id: nr
  label_pl: numer uchwały
  severity: required
  matches: [uchwała nr, uchwał]
- id: spolka
  label_pl: oznaczenie spółki
  severity: required
  matches: [spółki, wspólników, spółka, wspólnik]
- id: przedmiot
  label_pl: przedmiot uchwały
  severity: required
  matches: [postanawia, uchwala, w sprawie, postanowienie, uchwał]
- id: glosowanie
  label_pl: wynik głosowania
  severity: expected
  matches: [głosów za, głosów przeciw, jednogłośnie, głosowaniu]
- id: wscie
  label_pl: wejście w życie
  severity: required
  matches: [wchodzi w życie, z dniem jej podjęcia]
- id: podpisy
  label_pl: podpisy wspólników
  severity: required
  matches: [podpisy wspólników, podpis]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  template: Ogólny wzór uchwały spółki.docx
  label_pl: Ogólny wzór uchwały spółki
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 2269, bottom: 2268, left: 1418, right: 1418}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, indent: {first: 708}, size: 10.0}
    text: ……………………………, dnia …………………… r.
    slots:
    - {id: miejscowosc_i_data, span: [0, 11], type: place_date, hint: miejscowość i data}
    - {id: miejscowosc_i_data_2, span: [18, 26], type: place_date, hint: miejscowość i data}
  - p: 1
    role: hint
    layout: {align: right, indent: {first: 708}, size: 10.0, italic: true}
    text: (miejscowość i data)
    hint_for: 0
    hint_kind: label
  - {p: 2, role: spacer}
  - p: 3
    role: title
    layout: {align: center, size: 14.0, bold: true}
    text: UCHWAŁA nr …………………
    slots:
    - {id: p3_1, span: [11, 18], type: text, context: UCHWAŁA nr ▢}
  - p: 4
    role: body
    layout: {align: center, size: 14.0, bold: true}
    text: z dnia ………………………
    slots:
    - {id: p4_1, span: [7, 16], type: date, context: z dnia ▢}
  - p: 5
    role: body
    layout: {align: center, size: 14.0, bold: true}
    text: 'Wspólników Spółki ……………………………… '
    slots:
    - {id: nalezy_wskazac_nawzw_spolki_oraz_jej_forme_prawn, span: [18, 30], type: text, hint: należy wskazać nawzw spółki oraz jej formę prawną
        np. z ograniczoną odpowiedzialnością}
  - p: 6
    role: hint
    layout: {align: justify, size: 10.0}
    text: (należy wskazać nawzw spółki oraz jej formę prawną np. z ograniczoną odpowiedzialnością)
    hint_for: 5
    hint_kind: instruction
  - {p: 7, role: spacer}
  - p: 8
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 1, kind: paragraph, src: manual, level: 0}}
    text: § 1
  - p: 9
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: ……………………………………………………………………………………………………………………………………
    slots:
    - {id: p9_1, span: [0, 50], type: text, context: ▢}
  - p: 10
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: ……………………………………………………………………………………………………………………………………
    slots:
    - {id: p10_1, span: [0, 50], type: text, context: ▢}
  - p: 11
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: ……………………………………………………………………………………………………………………………………
    slots:
    - {id: przedmiot_podjetej_uchwaly_powinien_w_sposob_jed, span: [0, 50], type: text, hint: przedmiot podjętej uchwały powinien w sposób jednoznaczny  określać
        decyzję podjętą przez wspólników}
  - p: 12
    role: hint
    layout: {align: justify, size: 10.0}
    text: (przedmiot podjętej uchwały powinien w sposób jednoznaczny  określać decyzję podjętą przez wspólników)
    hint_for: 11
    hint_kind: instruction
  - {p: 13, role: spacer}
  - p: 14
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
    text: § 2
  - p: 15
    role: body
    layout: {align: justify, size: 10.0}
    text: Uchwała wchodzi w życie z dniem jej podjęcia.
  - {p: 16, role: spacer}
  - {p: 17, role: spacer}
  - p: 18
    role: body
    layout: {align: justify, size: 10.0}
    text: Uchwała została podjęta w głosowaniu jawnym/tajnym jednogłośnie/za uchwałą oddano ……… głosów za, ……… głosów przeciw.
    slots:
    - {id: p18_1, span: [82, 85], type: text, context: jednogłośnie za uchwałą oddano ▢ głosów za}
    - {id: p18_2, span: [97, 100], type: text, context: uchwałą oddano głosów za ▢ głosów przeciw.}
  - {p: 19, role: spacer}
  - {p: 20, role: spacer}
  - p: 21
    role: field_header
    layout: {align: right, indent: {first: 708}, size: 10.0, bold: true}
    text: 'Podpisy wspólników:'
  - {p: 22, role: spacer}
  - {p: 23, role: spacer}
  - p: 24
    role: blank_line
    layout: {align: right, indent: {first: 708}, size: 10.0}
    text: ……………………………………………
    slots:
    - {id: podpisy_wspolnikow, span: [0, 17], type: signature, label: Podpisy wspólników}
  - {p: 25, role: spacer}
  - p: 26
    role: blank_line
    layout: {align: right, indent: {first: 708}, size: 10.0}
    text: ……………………………………………
    slots:
    - {id: podpisy_wspolnikow_2, span: [0, 17], type: signature, label: Podpisy wspólników}
  - {p: 27, role: spacer}
  - {p: 28, role: spacer}
