    layout: {align: justify, size: 10.0}
    text: 'Strony zgodnie oświadczają, że:'
  - p: 26
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 8, bold: true}]}
    text: "Strona A posiada, gromadzi, przetwarza oraz wykorzystuje w swej działalności, w tym prowadzonej działalności gospodarczej informacje,\
      \ co do których podejmuje działania \nw kierunku ich nieujawniania osobom trzecim, chronione na podstawie przepisów prawa, jak również, co\
      \ do których obowiązana jest zachować je w tajemnicy w związku z umowami, oświadczeniami i innymi stosunkami prawnymi, których jest stroną;"
  - p: 27
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
    text: "widzą potrzebę uregulowania kwestii ochrony informacji poufnych w celu zachowania ich \nw tajemnicy przez wszystkie strony umowy i w\
      \ związku z tym zawierają niniejszą umowę."
  - {p: 28, role: spacer}
