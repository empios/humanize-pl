# Szkielet struktury: umowa o pracę.
# Wzorce `matches` oparte o sformułowania z szablonów kancelarii.

category: umowa_o_prace
label_pl: umowa o pracę
# Kolejności sekcji nie sprawdzamy: realne wzory tej kategorii układają je różnie.
check_order: false
numbering: paragraph
sections:
- id: komparycja
  label_pl: komparycja (pracodawca, pracownik)
  severity: required
  # Formuły zawarcia i oznaczenia stron, nie nazwy ról: „najemca” czy „zawarta”
  # powtarzają się w całej umowie i utrzymywały usuniętą komparycję jako obecną.
  matches: [zawarta w dniu, zawarta dnia, zawarta pomiędzy, zawarta między, zawarto umowę,
    zwanym dalej, zwaną dalej, zwanymi dalej, zwany dalej, zwana dalej, zwanego dalej,
    zwanej dalej, zwani dalej, z siedzibą w, zamieszkał, pesel, 'nip:', 'nip ', krs, legitymując]
- id: stanowisko
  label_pl: rodzaj pracy / warunki zatrudnienia
  severity: expected
  matches: [rodzaj umówionej pracy, stanowisko, miejsce wykonywania pracy, zakres obowiązków, warunki
      zatrudnienia, warunki odbywania, kwalifikacj, konkurencyjn, zakaz]
- id: wynagrodzenie
  label_pl: wynagrodzenie
  severity: expected
  matches: [wynagrodzenie, stypendium, kwota, zwrot kosztów, koszt, odprawa, kara umowna]
- id: czas
  label_pl: czas trwania / wymiar czasu
  severity: required
  matches: [czas trwania, czas nieokreślony, czas określony, wymiar czasu pracy, okres, na czas, od dnia,
    do dnia]
- id: urlop
  label_pl: urlop
  severity: expected
  matches: [urlop, urlopie]
- id: koncowe
  label_pl: postanowienia końcowe / rozwiązanie
  severity: required
  matches: [postanowienia końcowe, w sprawach nieuregulowanych, egzemplarzach, porozumienie, za porozumieniem,
    w przedmiocie rozwiązania, formę pisemną, wymagają formy]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
