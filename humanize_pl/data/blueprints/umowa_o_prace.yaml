      o których Pracownik dowiedział się w związku z wykonywaną pracą.
  - p: 51
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'W przypadku rozwiązania umowy Pracownik zobowiązuje się do zwrotu Pracodawcy najpóźniej

      w dniu rozwiązania umowy wszelkich dokumentów i innych materiałów dotyczących tajemnicy przedsiębiorstwa, jakie sporządził, zebrał, opracował
      lub otrzymał w czasie trwania umowy albo

      w związku lub przy okazji jej wykonywania.'
  - {p: 52, role: spacer}
  - p: 53
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
    text: § 5
  - {p: 54, role: spacer}
  - p: 55
