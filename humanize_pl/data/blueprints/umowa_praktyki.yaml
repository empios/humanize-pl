    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Każda ze stron może wypowiedzieć umowę w każdym czasie.
  - p: 37
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Strony zobowiązują się do uprzedniego zawiadomienia drugiej strony o zamiarze wypowiedzenia umowy z co najmniej 2-dniowym wyprzedzeniem
      przynajmniej w formie ustnej.
  - {p: 38, role: spacer}
  - p: 39
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
    text: § 5
  - p: 40
    role: body
    layout: {align: justify, size: 10.0}
    text: Przyjmujący na praktykę, na wniosek Praktykanta, jest obowiązany wystawić na piśmie zaświadczenie o rodzaju wykonywanej pracy i umiejętnościach
      nabytych w czasie odbywania praktyki.
  - {p: 41, role: spacer}
  - p: 42
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
    text: § 6
  - p: 43
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Praktykant zobowiązuje się do zachowania w tajemnicy wszelkich materiałów, dokumentów oraz informacji otrzymanych lub uzyskanych w związku
      z odbywaniem praktyki.
  - p: 44
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Obowiązek zachowania w tajemnicy materiałów, dokumentów oraz informacji opisanych w § 1 ust. 1 niniejszej umowy obejmuje w szczególności
      zakaz ich udostępniania osobom trzecim.
  - p: 45
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Obowiązek zachowania w tajemnicy materiałów, dokumentów oraz informacji opisanych w § 1 ust. 1 niniejszej umowy obowiązuje w trakcie trwania
      umowy, a także bezterminowo po jej wygaśnięciu lub rozwiązaniu.
  - {p: 46, role: spacer}
  - p: 47
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
    text: § 7
  - p: 48
    role: body
    layout: {align: justify, size: 10.0}
    text: "Obowiązek zachowania w tajemnicy informacji nie dotyczy sytuacji, gdy obowiązek ich udostępnienia osobom trzecim wynika z obowiązujących\
      \ przepisów prawa i osoby te zażądają od Praktykanta ich przekazania. Praktykant jest zobowiązany niezwłocznie poinformować Przyjmującego\
      \ na praktykę \no zgłoszeniu powyższego żądania."
  - {p: 49, role: spacer}
  - p: 50
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: §  8, kind: paragraph, src: manual, level: 0}}
    text: §  8
  - p: 51
    role: body
    layout: {align: justify, size: 10.0}
    text: Niniejszym Przyjmujący na praktykę upoważnia Praktykanta do przetwarzania danych osobowych, do których posiada dostęp w celu realizacji
      niniejszej umowy.
  - {p: 52, role: spacer}
  - p: 53
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
    text: § 9
  - p: 54
    role: body
    layout: {align: justify, size: 10.0}
    text: W sprawach nieuregulowanych niniejszą umową stosuje się przepisy ustawy o praktykach absolwenckich oraz przepisy Kodeksu cywilnego.
  - {p: 55, role: spacer}
  - p: 56
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: §  10, kind: paragraph, src: manual, level: 0}}
    text: §  10
  - p: 57
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Wszelkie zmiany niniejszej umowy wymagają zachowania formy pisemnej, pod rygorem nieważności.
  - p: 58
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: "W sprawach nieuregulowanych niniejszą umową stosuje się przepisy ustawy z dnia 17 lipca 2009 r. \no praktykach absolwenckich oraz ustawy\
      \ z dnia 23 kwietnia 1964 r.  – Kodeks cywilny."
  - p: 59
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Umowę sporządzono w dwóch egzemplarzach, po jednym egzemplarzu dla stron.
