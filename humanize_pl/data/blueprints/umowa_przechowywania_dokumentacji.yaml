  - {p: 34, role: spacer}
  - p: 35
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
    text: § 4
  - p: 36
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 60,
          end: 72, bold: true}]}
    text: Przechowawca zobowiązuje się do przechowywania dokumentacji Składającego w stanie niepogorszonym, umożliwiającym pełne korzystanie z nich
      przez cały okres zakwalifikowany do przechowywania.
  - p: 37
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 13, bold: true}]}
