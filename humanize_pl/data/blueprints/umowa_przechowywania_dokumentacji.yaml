  - {p: 39, role: spacer}
  - p: 40
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
    text: § 5
  - p: 41
    role: body
    layout: {align: justify, size: 10.0, spans: [{start: 131, end: 143, bold: true}]}
    text: "Przejęta do przechowania dokumentacja medyczna po upływie obligatoryjnych okresów wskazanych \nw § 1 ust. 2 Umowy, podlega na koszt Przechowawcy\
      \ zniszczeniu w trybie przewidzianym w art. 29 ust. 2 u.p.p."
  - {p: 42, role: spacer}
  - p: 43
    role: clause_heading
