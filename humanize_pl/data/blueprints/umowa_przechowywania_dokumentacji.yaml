  - p: 22
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 134, end: 145, bold: true}, {
          start: 159, end: 172, bold: true}]}
    text: "Na podstawie art. 30a ust. 3 pkt 2 ustawy z dnia 6 listopada 2008 r. o prawach pacjenta i Rzeczniku Praw Pacjenta (dalej jako u.p.p.),\
      \ Składający powierza, \na Przechowawca przyjmuje do przechowania dokumentację medyczną."
  - p: 23
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}]}
    text: Przechowawca zobowiązuje się przechowywać dokumentację medyczną przez okres czasu, który został szczegółowo wskazany w art. 29 u.p.p.
  - {p: 24, role: spacer}
  - p: 25
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
    text: § 2
  - p: 26
