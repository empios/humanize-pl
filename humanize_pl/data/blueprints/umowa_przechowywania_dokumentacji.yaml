# Szkielet struktury: umowa o przechowywanie dokumentacji.
# Wzorce `matches` oparte o sformułowania z szablonów kancelarii.

category: umowa_przechowywania_dokumentacji
label_pl: umowa o przechowywanie dokumentacji
# Kolejności sekcji nie sprawdzamy: realne wzory tej kategorii układają je różnie.
check_order: false
numbering: paragraph
sections:
- id: komparycja
  label_pl: komparycja
  severity: required
  matches: [zawarta, pomiędzy, przechowawc, składaj]
- id: podstawa
  label_pl: podstawa (art. 30a u.p.p.)
  severity: required
  matches: [art. 30a, praw pacjenta, na podstawie, przechowywanie]
- id: przedmiot
  label_pl: przedmiot (dokumentacja medyczna)
  severity: required
  matches: [dokumentację medyczną, dokumentacja, przechow]
- id: miejsce
  label_pl: miejsce przechowywania
  severity: required
  matches: [miejsce przechowywania, budynek, przy ul]
- id: czas
  label_pl: okres przechowywania
  severity: required
  matches: [okres, czas, art. 29, termin]
- id: postanowienia_koncowe
  label_pl: postanowienia końcowe
  severity: required
  matches: [postanowienia końcowe, w sprawach nieuregulowanych, egzemplarzach, formę pisemną, wymagają
      formy pisemnej, wymagają zachowania formy pisemnej]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  template: umowa o przechowywanie dokumentacji medycznej.docx
  label_pl: Umowa o przechowywanie dokumentacji medycznej
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 2269, bottom: 2268, left: 1418, right: 1418}}
  blocks:
  - p: 0
    role: title
    layout: {align: center, size: 14.0, bold: true}
    text: UMOWA
  - p: 1
    role: body
    layout: {align: center, size: 14.0, bold: true}
    text: o przechowywanie dokumentacji medycznej
  - {p: 2, role: spacer}
  - p: 3
    role: body
    layout: {align: justify, size: 10.0}
    text: 'zawarta w ………………. w dniu ……………………….. roku, pomiędzy:'
    slots:
    - {id: p3_1, span: [10, 17], type: place, context: zawarta w ▢ w dniu}
    - {id: p3_2, span: [25, 36], type: date, context: zawarta w w dniu ▢ roku pomiędzy}
  - {p: 4, role: spacer}
  - p: 5
    role: blank_line
    layout: {align: justify, size: 10.0}
    text: ………………………………………………………………………………………………
    slots:
    - {id: p5_1, span: [0, 36], type: text, context: ▢}
