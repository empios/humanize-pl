    - {id: p28_1, span: [53, 66], type: date, context: przejęcia dokumentów na dzień ▢}
  - p: 29
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 259,
          end: 270, bold: true}]}
    text: 'Przechowawca w razie likwidacji lub upadłości zobowiązuje się przekazać przechowywaną dokumentację wskazanemu przez siebie podmiotowi
      do dalszego przechowywania, zapewniając na ten cel środki finansowe na okres, jaki pozostał do wygaśnięcia Umowy zawartej ze Składającym. '
  - {p: 30, role: spacer}
  - p: 31
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
    text: § 3
  - p: 32
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 67,
          end: 79, bold: true}]}
    text: Przechowawca za czynności określone w niniejszej umowie otrzyma od Składającego jednorazowe wynagrodzenie w wysokości ………………………...
    slots:
