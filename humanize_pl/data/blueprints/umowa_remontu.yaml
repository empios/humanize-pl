    text: § 3
  - p: 21
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: "Wykonawca zobowiązuje się do wykonania prac będących przedmiotem umowy zgodnie \nz Projektem stanowiącym Załącznik nr 1 do niniejszej\
      \ umowy, aktualnym poziomem wiedzy technicznej i należytą starannością, z własnych materiałów."
  - p: 22
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Zamawiający odpowiada solidarnie z Wykonawcą za zapłatę wynagrodzenia należnego podwykonawcy z tytułu wykonanych przez niego robót budowlanych,
      których szczegółowy przedmiot został zgłoszony Zamawiającemu przez Wykonawcę lub podwykonawcę przed przystąpieniem do wykonywania tych robót,
      chyba że w ciągu trzydziestu dni od dnia doręczenia Zamawiającemu zgłoszenia Zamawiający złożył podwykonawcy i Wykonawcy sprzeciw wobec wykonywania
      tych robót przez podwykonawcę.
  - p: 23
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Zgłoszenie, o którym mowa w ust. 2, nie jest wymagane, jeżeli Zamawiający i Wykonawca określili w umowie szczegółowy przedmiot robót budowlanych
      wykonywanych przez oznaczonego podwykonawcę.
  - p: 24
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: Zlecenie wykonania części robót Podwykonawcom nie zmienia odpowiedzialności Wykonawcy wobec Zamawiającego za wykonanie tej części robót.
      Wykonawca jest odpowiedzialny za działania, uchybienia i zaniedbania Podwykonawców i ich pracowników w takim samym stopniu, jakby to były
      działania, uchybienia lub zaniedbania jego własnych pracowników.
  - p: 25
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
    text: Zamawiający nie odpowiada za bezpieczeństwo pracowników Wykonawcy i nie ponosi odpowiedzialności odszkodowawczej za ewentualne wypadki
      przy wykonywaniu prac, o których mowa w § 1 niniejszej umowy.
  - p: 26
