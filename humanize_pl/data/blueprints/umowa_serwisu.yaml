    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Zamawiający w terminie do ….. dni od momentu zaakceptowania projektu graficznego serwisu internetowego, zobowiązany jest dostarczyć wskazane
      przez Wykonawcę materiały, niezbędne do wykonania przedmiotu Umowy. Po otrzymaniu materiałów, o których mowa w zdaniu poprzednim, Wykonawca
      przystąpi do wykonania serwisu internetowego '
