  - p: 33
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 236, end: 250, bold: true}]}
    text: Wykonawca w terminie ….. dni od dnia podpisania Umowy przedstawi Zamawiającemu projekt graficzny serwisu internetowego. Projekt graficzny
      serwisu internetowego zawierający oprawę graficzną, czyli tak zwaną wizualizację, będzie stanowił załącznik nr 2 do Umowy.
    slots:
    - {id: p33_1, span: [21, 24], type: text, context: Wykonawca w terminie ▢ dni od}
  - p: 34
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Przedstawienie projektu graficznego Zamawiającemu nastąpi drogą elektroniczną, poprzez wysłanie e-maila z projektem graficznym serwisu
      internetowego na adres e-mailowy Zamawiającego wskazany w § 10 ust. 1 Umowy.
  - p: 35
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: "Jeżeli Zamawiający nie zawiadomi Wykonawcy w terminie …… dni od dnia wysłania przez Wykonawcę e-maila z projektem graficznym serwisu\
      \ internetowego, o jego przyjęciu, nieprzyjęciu lub uzależnieniu przyjęcia od dokonania określonych zmian w wyznaczonym w tym celu ….. dniowym\
      \ terminie, uważa się, że projekt graficzny serwisu internetowego został przyjęty be zastrzeżeń. \nW przypadku uzależnienia przyjęcia od dokonania\
      \ określonych zmian, Zamawiający zawiadomi Wykonawcę w terminie ….. dni od dnia dostarczenia poprawionego projektu o jego przyjęciu, nieprzyjęciu\
      \ lub uzależnieniu przyjęcia poprawionego projektu od wprowadzenia dalszych zmian w dodatkowym ….. dniowym terminie."
    slots:
    - {id: p35_1, span: [54, 56], type: text, context: zawiadomi Wykonawcy w terminie ▢ dni od}
    - {id: p35_2, span: [262, 265], type: text, context: wyznaczonym w tym celu ▢ dniowym terminie}
    - {id: p35_3, span: [480, 483], type: text, context: zawiadomi Wykonawcę w terminie ▢ dni od}
    - {id: p35_4, span: [655, 658], type: text, context: dalszych zmian w dodatkowym ▢ dniowym terminie.}
  - p: 36
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: 'Po upływie terminu, o którym mowa w ust. 3 zd. 1 powyżej, Zamawiającemu nie przysługuje prawo do zgłaszania jakichkolwiek poprawek bądź
