    - {id: p41_1, span: [26, 29], type: date, context: Zamawiający w terminie do ▢ dni od}
  - p: 42
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'Wykonanie serwisu internetowego nastąpi w terminie ….. dni roboczych od daty otrzymania od Zamawiającego materiałów niezbędnych do wykonania
      przedmiotu Umowy. '
    slots:
    - {id: p42_1, span: [51, 54], type: text, context: internetowego nastąpi w terminie ▢ dni roboczych}
  - p: 43
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Przesunięcie terminu wykonania serwisu internetowego będzie możliwe jedynie w przypadku pojawienia się okoliczności, których Strony nie
      mogły przewidzieć w chwili zawierania niniejszej Umowy, a które utrudniają jej wykonanie. W takim przypadku Wykonawca zobowiązany jest o tychże
      okolicznościach poinformować Zamawiającego wraz ze wskazaniem terminu, do którego serwis internetowy zostanie wykonany
  - {p: 44, role: spacer}
  - p: 45
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
    text: § 5
  - p: 46
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: Uruchomienie serwisu internetowego
  - p: 47
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: O wykonaniu serwisu internetowego, miejscu jego umieszczenia i gotowości do jego przekazania, Wykonawca powiadomi Zamawiającego, wysyłając
      mu e-mail na adres wskazany w § 10 ust. 1 Umowy.
  - p: 48
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: "Jeżeli Zamawiający nie zawiadomi Wykonawcy w terminie ….. dni od dnia wysłania przez Wykonawcę e-maila z informacją o wykonaniu serwisu\
      \ internetowego, miejscu jego umieszczenia \ni gotowości do jego przekazania, o jego przyjęciu, nieprzyjęciu lub uzależnieniu przyjęcia od\
      \ dokonania określonych zmian w wyznaczonym w tym celu ….. dniowym terminie, uważa się, że serwis internetowy został zaakceptowany, przyjęty\
      \ i skutecznie odebrany przez Zamawiającego. "
    slots:
