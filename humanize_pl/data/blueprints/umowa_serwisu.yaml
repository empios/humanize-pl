    - {id: ze_strony_zamawiajacego_2, span: [46, 50], type: text, label: ze strony Zamawiającego}
    - {id: ze_strony_zamawiajacego_3, span: [57, 61], type: text, label: ze strony Zamawiającego}
  - p: 91
    role: item
    layout: {align: justify, size: 10.0, marker: {text: b., kind: lowerLetter, src: auto, level: 1}}
    text: 'ze strony Wykonawcy: …………  (adres mailowy: ……. , tel. ………….).'
    slots:
    - {id: ze_strony_wykonawcy, span: [21, 25], type: text, label: ze strony Wykonawcy}
    - {id: ze_strony_wykonawcy_2, span: [43, 46], type: text, label: ze strony Wykonawcy}
    - {id: ze_strony_wykonawcy_3, span: [54, 59], type: text, label: ze strony Wykonawcy}
  - p: 92
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'Załączniki wymienione w umowie stanowią jej integralną część. '
  - p: 93
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: 'Treść niniejszej Umowy stanowi zupełną regulację stosunku prawnego pomiędzy Stronami i wyłącza skuteczność wcześniejszych czy równoczesnych
      porozumień. '
  - p: 94
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: 'Zmiany niniejszej Umowy wymagają zachowania formy pisemnej pod rygorem nieważności. '
  - p: 95
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
    text: 'Strony zobowiązane są do wzajemnego informowania o każdej zmianie adresu siedziby w terminie …… dni od nastąpienia zmiany. W przypadku
      niedopełnienia tego obowiązku pisma kierowane na ostatni wskazany adres będą miały skutek doręczenia. '
    slots:
    - {id: p95_1, span: [93, 95], type: text, context: adresu siedziby w terminie ▢ dni od}
  - p: 96
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
    text: 'Wszelkie ewentualne spory z związku z wykonaniem Umowy Strony zobowiązują się rozstrzygać polubownie. W razie wyczerpania możliwości
      polubownego rozstrzygnięcia sporu strony uzgadniają, że spory rozstrzygać będzie sąd powszechny właściwy dla siedziby Zamawiającego. '
  - p: 97
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}}
    text: Termin rozpoczęcia dzieła strony ustaliły na dzień ................................, a wykonania na dzień ...............................................
      .
    slots:
    - {id: p97_1, span: [51, 83], type: date, context: strony ustaliły na dzień ▢ a wykonania}
    - {id: p97_2, span: [106, 153], type: date, context: a wykonania na dzień ▢}
  - p: 98
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}}
    text: 'W sprawach nieuregulowanych do niniejszej Umowy mają zastosowanie przepisy ustawy z dnia 23 kwietnia 1964 r. - Kodeks cywilny (t.j. Dz.U.2023.1610
      ze zm.) za wyjątkiem postanowień § 9, do których mają zastosowanie przepisy ustawy z dnia 4 lutego 1994 r. o prawie autorskim i prawach pokrewnych
      (t.j. Dz.U.2022.2509). '
  - p: 99
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '9.', kind: decimal, src: auto, level: 0}}
    text: Umowę sporządzono w dwóch jednobrzmiących egzemplarzach po jednym dla każdej ze stron.
