  - p: 58
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: Gwarancja serwisu internetowego
  - p: 59
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: W przypadku zaistnienia w serwisie internetowym błędów niepowstałych na skutek działania siły wyższej, osób trzecich lub Zamawiającego,
      Wykonawca zobowiązuje do ich nieodpłatnego usunięcia w ramach gwarancji, w terminie ….. dni od daty zgłoszenia błędu, w okresie, o którym
      mowa w ust. 2 poniżej. Zgłoszenie nieprawidłowości działania serwisu internetowego może nastąpić w każdy dzień roboczy w godzinach od …..
      do …… i winno być przesłane drogą elektroniczną poprzez wysłanie e-mail na adres wskazany w § 10 ust. 1.
    slots:
    - {id: p59_1, span: [220, 223], type: text, context: ramach gwarancji w terminie ▢ dni od}
    - {id: p59_2, span: [408, 411], type: date, context: roboczy w godzinach od ▢ do i}
    - {id: p59_3, span: [415, 417], type: date, context: w godzinach od do ▢ i winno}
  - p: 60
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'Wykonawca udziela Zamawiającemu gwarancji na wykonany przez siebie serwis internetowy. Gwarancja, o której mowa w zdaniu pierwszym, zostanie
      udzielona na okres …. (słownie: ….) miesięcy, począwszy od daty odebrania serwisu internetowego przez Zamawiającego.'
