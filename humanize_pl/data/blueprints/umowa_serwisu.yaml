    - {id: p60_2, span: [173, 175], type: amount, context: udzielona na okres słownie ▢ miesięcy począwszy}
  - p: 61
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Wykonawca zastrzega sobie, że w przypadku jakichkolwiek modyfikacji kodu struktury serwisu internetowego przez kogokolwiek, za wyjątkiem
