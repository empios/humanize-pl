  - p: 64
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: Wynagrodzenie
  - p: 65
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Za wykonanie przedmiotu umowy oraz przeniesienie autorskich praw majątkowych do serwisu internetowego na wszystkich polach eksploatacji
      określonych w Umowie Zamawiający zapłaci Wykonawcy wynagrodzenie w kwocie ….. zł netto (słownie: …. złotych netto) plus należny podatek od
      towarów i usług w stawce obowiązującej w dniu wystawienia faktury.'
    slots:
    - {id: p65_1, span: [210, 213], type: text, context: Wykonawcy wynagrodzenie w kwocie ▢ zł netto}
    - {id: p65_2, span: [233, 235], type: amount, context: kwocie zł netto słownie ▢ złotych netto}
  - p: 66
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: "Wykonawca w terminie …. dni od dnia podpisania Umowy otrzyma od Zamawiającego zaliczkę \nw kwocie brutto … (słownie: ……. złotych brutto).\
      \ Wynagrodzenie, o którym mowa w ust. 1 powyżej, zostanie pomniejszone o wypłaconą zaliczkę i będzie płatne jednorazowo na podstawie faktury\
      \ VAT wystawionej przez Wykonawcę w dniu odbioru serwisu internetowego przez Zamawiającego."
    slots:
    - {id: p66_1, span: [21, 23], type: text, context: Wykonawca w terminie ▢ dni od}
    - {id: p66_2, span: [116, 119], type: amount, context: w kwocie brutto słownie ▢ złotych brutto}
  - p: 67
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Wynagrodzenie, o którym mowa w ust. 1 powyżej będzie płatne przelewem na rachunek bankowy Wykonawcy prowadzony przez ….. o numerze…….
      niezwłocznie, jednakże nie później niż w terminie ….. dni od dnia otrzymania faktury VAT przez Zamawiającego.
    slots:
    - {id: p67_1, span: [117, 120], type: person, context: bankowy Wykonawcy prowadzony przez ▢ o numerze}
    - {id: p67_2, span: [130, 133], type: text, context: prowadzony przez o numerze ▢ niezwłocznie jednakże}
    - {id: p67_3, span: [184, 187], type: text, context: później niż w terminie ▢ dni od}
  - p: 68
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: "Za dokonanie płatności przez Zamawiającego uznaje się dzień wpływu środków pieniężnych, \no których mowa w ust. 1 powyżej, na rachunek\
      \ bankowy Wykonawcy."
  - p: 69
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
    text: Wynagrodzenie, o którym mowa w § 8 ust. 1 obejmuje wszelkie wydatki poczynione przez Wykonawcę w związku z wykonaniem przedmiotu umowy.
  - {p: 70, role: spacer}
  - p: 71
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
    text: § 9
  - p: 72
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: Przeniesienie praw autorskich majątkowych
  - p: 73
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Wykonawca przenosi na Zamawiającego całość autorskich praw majątkowych do serwisu internetowego oraz poszczególnych elementów graficznych
      indywidualizujących serwis internetowy, a Zamawiający prawa te nabywa, z chwilą wpływu środków pieniężnych, o których mowa w § 8 ust. 1, na
      rachunek bankowy Wykonawcy. '
  - p: 74
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'Przejście autorskich praw majątkowych obejmuje następujące pola eksploatacji: '
  - p: 75
    role: item
    layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
    text: 'utrwalanie i zwielokrotnianie przez wykonywanie kopii plików tworzących dzieło, jak również wydruk kodów źródłowych; '
  - p: 76
    role: item
    layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
    text: 'przeglądanie zawartości, co jest równoznaczne ze zwielokrotnianiem utworu w pamięci komputera; '
  - p: 77
    role: item
    layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
    text: 'sprzedaż gotowego projektu strony www bądź udzielaniu na niego licencji; '
  - p: 78
    role: item
    layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
    text: 'publiczne odtwarzanie (np. na rzutniku multimedialnym podczas konferencji); '
  - p: 79
    role: item
    layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
    text: publiczne udostępnianie dowolną techniką, w tym za pomocą sieci Internet.
  - p: 80
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: 'Zamawiający nabywa ponadto wyłączne prawo zezwalania na wykonywanie zależnych praw autorskich do dzieła. '
  - p: 81
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: 'Zamawiający nabywa także wyłączne prawo do korzystania z dzieła i rozporządzania nim w celach reklamowych i promocyjnych. '
  - p: 82
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
    text: 'Autorskie prawa osobiste związane z projektem, poszczególnymi elementami graficznymi indywidualizującymi serwis internetowy pozostają
      przy Wykonawcy. '
  - p: 83
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
    text: Na mocy umowy Zamawiający nabywa prawo własności dostarczonych mu przez Wykonawcę egzemplarzy dzieła (oryginału, kopii, negatywu) bez
      względu na technikę utrwalenia i nośnik, na którym nastąpiło utrwalenie.
  - p: 84
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}}
    text: Wykonawca w ramach otrzymanego wynagrodzenia od Zamawiającego udziela Zamawiającemu licencji na korzystanie z kodu struktury internetowej
      dla jednego serwisu internetowego Wykonawcy, w zakresie dostępu do niego i korzystania dla jednego serwisu internetowego. Zabronione jest
      w szczególności kopiowanie kodu i jego powielanie dla innych lub podobnych serwisów internetowych Zamawiającego lub osób trzecich. Niedozwolona
      jest także jego modyfikacja i udostępnianie osobom trzecim bez pisemnej zgody Wykonawcy.
  - p: 85
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}}
    text: Wykonawca oświadcza, że będzie wyłącznym właścicielem praw autorskich do dzieła będącego przedmiotem umowy, które to prawa będą nieograniczone
      i wolne od wszelkich obciążeń na rzecz osób trzecich.
  - {p: 86, role: spacer}
