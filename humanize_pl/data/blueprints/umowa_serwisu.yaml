  - p: 53
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: 'Usługa reklamowania '
  - p: 54
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Zamawiający zleca, a Wykonawca zobowiązuje się świadczyć na rzecz Zamawiającego usługę reklamowania wykonanego serwisu internetowego
