  - p: 89
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Dla potrzeb realizacji niniejszej Umowy Strony będą reprezentowane przez: '
  - p: 90
    role: item
    layout: {align: justify, size: 10.0, marker: {text: a., kind: lowerLetter, src: auto, level: 1}}
    text: 'ze strony Zamawiającego: …….. (adres mailowy :…….., tel. …………);'
