  - p: 19
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Wykonawca oświadcza, że prowadzi działalność gospodarczą w zakresie marketingu, w tym zarządzania stronami internetowymi. '
  - p: 20
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'Wykonawca zobowiązuje się do wykonania przedmiotu umowy z dołożeniem należytej staranności uwzględniając staranność profesjonalisty oraz
      zgodnie z uwagami Zamawiającego i zamierzoną funkcją serwisu internetowego. '
  - p: 21
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Strony zgodnie oświadczają i akceptują, że prace określone w niniejszej umowie, związane ze stworzeniem serwisu internetowego, Wykonawca
      zleci osobom trzecim w ramach podwykonawstwa.
  - {p: 22, role: spacer}
  - p: 23
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
    text: § 2
  - p: 24
    role: body
    layout: {align: center, size: 12.0, bold: true}
    text: Przedmiot umowy
  - p: 25
    role: field_header
    layout: {align: justify, size: 10.0}
    text: 'Zamawiający zamawia, a Wykonawca zobowiązuje się do:'
  - p: 26
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}, spans: [{start: 227, end: 241, bold: true}]}
    text: "wykonania na rzecz Zamawiającego serwisu internetowego, który będzie zgodny z projektem graficznym zaakceptowanym przez Zamawiającego\
      \ oraz zgodny z elementami określonymi \nw specyfikacji projektu; specyfikacja projektu stanowi załącznik nr 1 do Umowy;"
  - p: 27
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
    text: bieżącego prowadzenia serwisu internetowego zgodnie ze wskazówkami Zamawiającego;
  - p: 28
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
    text: '[opcjonalnie] świadczenia na rzecz Zamawiającego usług reklamowania zamówionego serwisu internetowego w wyszukiwarkach internetowych;'
  - p: 29
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
    text: '[opcjonalnie] przeszkolenia wskazanych pracowników Zamawiającego w zakresie samodzielnej aktualizacji i uzupełniania informacji znajdujących
      się w serwisie internetowym. '
  - {p: 30, role: spacer}
  - p: 31
