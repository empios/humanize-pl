    - {id: p54_2, span: [243, 277], type: text, context: użycia słów i fraz ▢}
  - p: 55
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Usługa pozycjonowania będzie świadczona po odbiorze serwisu internetowego i zapłacie wynagrodzenia, o którym mowa w § 8 ust. 1.
  - {p: 56, role: spacer}
  - p: 57
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
