# Szkielet umowy o świadczenie usług.
#
# `required` blokuje gotowość, `expected` tylko odnotowuje. Podział jest
# celowy: umowa bez klauzuli odpowiedzialności jest wadliwa, umowa bez
# klauzuli poufności bywa po prostu inną umową.
#
# Wzorce poszerzone o sformułowania z szablonów kancelarii (komparycja "w
# dniu", przedmiot "zleca, a"/"powierza", termin "okres od"). Odpowiedzialność
# jest `expected` — umowa o usługi prawne nie ma osobnej klauzuli
# odpowiedzialności (odpowiada starannością), a to inny kształt, nie wada.

category: umowa_uslug
label_pl: umowa o świadczenie usług
# Kolejności sekcji nie sprawdzamy: realne wzory tej kategorii układają je różnie.
check_order: false
numbering: paragraph
sections:
- id: komparycja
  label_pl: komparycja (data, miejsce, strony)
  severity: required
  matches: [zawarta w dniu, zawarto umowę, pomiędzy, zawarta dnia, zawarta w, w dniu]
- id: przedmiot
  label_pl: przedmiot umowy
  severity: required
  matches: [przedmiot umowy, przedmiotem umowy, przedmiotem niniejszej umowy, 'zleca, a', powierza, zobowiązuje
      się do wykonywania, oświadczenia i zapewnienia]
- id: termin
  label_pl: termin i sposób wykonania
  severity: required
  matches: [termin wykonania, terminy i sposób, sposób wykonania, harmonogram, czas trwania umowy, okres
      od, w okresie od, na czas nieokreślony, na czas określony, okres rozliczeniowy, w ramach usługi,
    w okresie, od dnia]
- id: wynagrodzenie
  label_pl: wynagrodzenie
  severity: required
  matches: [wynagrodzenie]
- id: odpowiedzialnosc
  label_pl: odpowiedzialność
  severity: expected
  matches: [odpowiedzialność, odpowiada za, odpowiedzialności]
- id: poufnosc
  label_pl: poufność
  severity: expected
  matches: [poufnoś, informacje poufne, zachowania w tajemnicy, w tajemnicy]
- id: rozwiazanie
  label_pl: rozwiązanie i wypowiedzenie umowy
  severity: required
  matches: [rozwiązanie umowy, wypowiedzenie, odstąpienie od umowy, rozwiązać umowę, rozwiązać niniejszą
      umowę]
- id: postanowienia_koncowe
  label_pl: postanowienia końcowe
  severity: required
  matches: [postanowienia końcowe, w sprawach nieuregulowanych, egzemplarzach, formę pisemną, wymagają
      formy pisemnej, wymagają zachowania formy pisemnej]
- id: wlasciwosc
  label_pl: właściwość sądu
  severity: expected
  matches: [właściwy sąd, sądem właściwym, właściwości sądu, sąd powszechny właściwy, właściwy miejscowo
      sąd]
- id: podpisy
  label_pl: podpisy stron
  severity: required
  matches: [podpis, jednobrzmiących egzemplarzach, 'egzemplarzach, po jednym', 'egzemplarzach, po 1',
    egzemplarzu dla każdej]

