  - p: 44
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
    text: 'Biorący ma prawo rozwiązać umowę bez zachowania okresu wypowiedzenia w przypadku, gdy Przedmiot użyczenia okaże się posiadać wady lub
