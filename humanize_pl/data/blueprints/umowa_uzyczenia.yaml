  - p: 17
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Użyczający oświadcza, że lokal o którym mowa w § 1 ust. 1,  jest wolny od obciążeń na rzecz osób trzecich, które mogłyby utrudnić lub
      uniemożliwić wykonywanie Biorącemu w używanie uprawnień wynikających z niniejszej umowy.
  - {p: 18, role: spacer}
  - p: 19
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
    text: § 2
  - {p: 20, role: spacer}
  - p: 21
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 89, end: 91, bold: true}, {start: 103,
          end: 124, bold: true}]}
    text: Użyczający użycza i daje w bezpłatne używanie Biorącemu lokal, o którym mowa w § 1 ust. 1, zwany dalej Przedmiotem użyczenia.
  - p: 22
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Biorący wraz z zawarciem niniejszej umowy potwierdza odbiór opisanego wyżej Przedmiotu użyczenia.
  - p: 23
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Biorący oświadcza, iż Przedmiot użyczenia został mu użyczony w stanie zdatnym do użytku oraz Biorący nie wnosi z tego tytułu żadnych zastrzeżeń.
  - p: 24
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 211, end: 225, bold: true}]}
    text: Strony oświadczają, że stan techniczny lokalu, jego wyposażenie, wskazania liczników oraz ilość kompletów kluczy przekazanych Biorącemu,
      zostały szczegółowo opisane w protokole zdawczo-odbiorczym, który stanowi Załącznik nr 1 do niniejszej umowy.
  - {p: 25, role: spacer}
  - p: 26
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
    text: § 3
  - {p: 27, role: spacer}
  - p: 28
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Biorący nie ma prawa oddawać Przedmiotu użyczenia w najem albo użyczenie osobom trzecim, bez zgody Użyczającego wyrażonej w formie pisemnej
      pod rygorem nieważności. '
  - p: 29
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Biorący zobowiązuje się korzystać z Przedmiotu użyczenia zgodnie z umową, w tym zgodnie z jego przeznaczeniem i właściwościami, oraz zasadami
      prawidłowej gospodarki, a w szczególności utrzymywać Przedmiot użyczenia w niepogorszonym stanie ponad jego zużycie będące następstwem prawidłowego
      używania.
  - p: 30
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Wszelkie naprawy Przedmiotu użyczenia, których dokonanie stanie się konieczne w trakcie trwania niniejszego stosunku użyczenia, obciążają
      Biorącego.
  - p: 31
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: Wszystkie koszty i opłaty eksploatacyjne wynikające z korzystania z Przedmiotu użyczenia przez cały czas trwania Umowy poniesie Biorący.
