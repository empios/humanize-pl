# Szkielet struktury: wniosek procesowy (pismo w toczącej się sprawie albo
# wniosek wszczynający, np. o uchylenie mandatu karnego).
#
# Wnioski kadrowe (urlop, świadectwo pracy) nie są kierowane do sądu i nie mają
# tej struktury: mają własną kategorię, wniosek_pracowniczy.

category: wniosek_procesowy
label_pl: wniosek procesowy
check_order: false
sections:
- id: data
  label_pl: miejscowość i data
  severity: required
  matches: [dnia, ' r.', (data]
- id: sad
  label_pl: oznaczenie sądu
  severity: required
  matches: [sąd, wydział]
- id: strony
  label_pl: oznaczenie stron lub wnioskodawcy
  severity: required
  matches: [powód, pozwan, wnioskodawc, uczestnik, obwinion, oskarżon, dane klienta, imię i nazwisko, 'imię, nazwisko']
- id: sygnatura
  label_pl: sygnatura akt
  severity: expected
  matches: [sygn]
- id: wniosek
  label_pl: treść wniosku
  severity: required
  matches: [wnoszę, składam wniosek, wnioskiem o, wnioskuję, wniosek o]
- id: uzasadnienie
  label_pl: uzasadnienie
  severity: expected
  matches: [uzasadnienie, motywuję, uzasadniając]
- id: podpis
  label_pl: podpis wnioskodawcy
  severity: required
  matches: [podpis, z poważaniem]
- id: zalaczniki
  label_pl: załączniki
  severity: expected
  matches: [załącznik, odpis]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  template: wniosek o zmianę terminu przesłuchania.docx
  label_pl: Wniosek o zmianę terminu przesłuchania
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 2269, bottom: 2268, left: 1418, right: 1418}}
  blocks:
  - {p: 0, role: spacer}
  - p: 1
    role: body
    layout: {align: right, indent: {first: 708}, size: 10.0, spans: [{start: 8, end: 21, italic: true}, {start: 35, end: 41, italic: true}]}
    text: ………………… (miejscowość), dnia ……………… (data)
    slots:
    - {id: miejscowosc, span: [0, 7], type: place, hint: miejscowość}
    - {id: data, span: [28, 34], type: date, hint: data}
    inline_hints:
    - {span: [8, 21], text: miejscowość}
