    text: Zapłata kwoty określonej w ust. 1 zostanie dokonana na rachunek bankowy Zamieniającego nr 1/Zamieniającego nr 2 (należy wybrać odpowiednią
      opcję) o numerze ..................., prowadzony przez ................... z chwilą zawarcia niniejszej Umowy.
    slots:
    - {id: p22_1, span: [156, 175], type: text, context: nr 2 o numerze ▢ prowadzony przez}
    - {id: p22_2, span: [194, 213], type: person, context: o numerze prowadzony przez ▢ z chwilą}
  - {p: 23, role: spacer}
  - p: 24
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
    text: § 3 (w przypadku zamiany bez dopłaty)
  - p: 25
    role: body
    layout: {align: justify, size: 10.0}
    text: Strony zgodnie oświadczają, że nie kwestionują podanych w § 1 i 2 wartości rzeczy podlegających zamianie i dokonają zamiany bez żadnych
      dopłat.
  - {p: 26, role: spacer}
  - p: 27
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
    text: § 4
  - p: 28
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Koszty związane z wydaniem i objęciem Przedmiotów zamiany ponosi każda ze stron w równej części.
  - p: 29
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: 'Podatek od czynności cywilnoprawnych związany z zawarciem niniejszej Umowy obciąża Zamieniającego nr 1 i Zamieniającego nr 2 w równej
      części. '
  - {p: 30, role: spacer}
  - p: 31
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
    text: § 5
  - p: 32
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Wszelkie doręczenia związane z wykonaniem niniejszej Umowy dokonywane będą na adresy stron wypisane w komparycji.
  - p: 33
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: Strony zobowiązują się pisemnie informować o wszelkich zmianach danych adresowych. W razie zaniechania tego obowiązku korespondencja wysłana
      na adres zgodnie z ust. 1 będzie traktowana jako skutecznie doręczona.
  - {p: 34, role: spacer}
  - p: 35
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
    text: § 6
  - p: 36
    role: body
    layout: {align: justify, size: 10.0}
    text: W sprawach nieuregulowanych niniejszą Umową zastosowanie mają przepisy ustawy z dnia 23 kwietnia 1964 r. - Kodeks cywilny.
  - {p: 37, role: spacer}
  - p: 38
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
    text: § 7
  - p: 39
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Niniejsza Umowa stanowi całość uzgodnień pomiędzy stronami i uchyla wszelkie poprzedzające je umowy, porozumienia i uzgodnienia, pisemne
      i ustne, dotyczące przedmiotów Umowy.
  - p: 40
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 176, end: 209, italic: true}]}
    text: Ewentualne spory powstałe na tle wykonania niniejszej Umowy rozstrzygać będzie sąd właściwy ze względu na miejsce zamieszkania/siedzibę
      Zamieniającego nr 1/Zamieniającego nr 2 (należy wybrać odpowiednią opcję).
  - p: 41
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Wszelkie zmiany niniejszej Umowy wymagają formy pisemnej pod rygorem nieważności.
  - p: 42
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
    text: Umowę sporządzono w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron.
  - p: 43
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
    text: Koszy zawarcia niniejszej Umowy ponoszą obie strony po połowie.
