# Szkielet struktury: umowa zamiany.
# Wzorce `matches` oparte o sformułowania z szablonów kancelarii.

category: zamiana
label_pl: umowa zamiany
numbering: paragraph
sections:
- id: komparycja
  label_pl: komparycja
  severity: required
  matches: [zawarta, pomiędzy, stron, zamieniaj]
- id: przedmiot
  label_pl: przedmiot zamiany
  severity: required
  matches: [zamien, rzecz, przedmiot, własność]
- id: wartosc
  label_pl: wartość
  severity: required
  matches: [wartość, wartości, równowarto, dopłat, kwota, o wartości]
- id: przeniesienie
  label_pl: przeniesienie własności
  severity: required
  matches: [przeniesienie, własność, wydanie, przenosi, przenieść]
- id: postanowienia_koncowe
  label_pl: postanowienia końcowe
  severity: required
  matches: [postanowienia końcowe, w sprawach nieuregulowanych, egzemplarzach, formę pisemną, wymagają
      formy pisemnej, wymagają zachowania formy pisemnej]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
