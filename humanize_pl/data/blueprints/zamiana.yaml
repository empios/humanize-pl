    inline_hints:
    - {span: [91, 104], text: opis rzeczy}
  - p: 10
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: 'Strony oświadczają, każda we własnym imieniu i w odniesieniu do Przedmiotu zamiany stanowiącego jej własność, że:'
  - p: 11
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
    text: Przedmiot zamiany jest wolny od wad fizycznych i prawnych;
  - p: 12
    role: item
    layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
    text: Nie występują ograniczenia w rozporządzeniu Przedmiotem zamiany.
  - {p: 13, role: spacer}
  - p: 14
    role: clause_heading
    layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
    text: § 2
  - p: 15
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: Zamieniający  nr 1 zobowiązuje się przenieść Przedmiot zamiany nr 1 na własność Zamieniającego nr 2.
  - p: 16
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
    text: Zamieniający nr 2 zobowiązuje się przenieść Przedmiot zamiany nr 2 na własność Zamieniającego nr 1.
  - p: 17
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
    text: Strony zgodnie oświadczają, że wydanie i objęcie Przedmiotów zamiany w posiadanie nastąpi w terminie ........................ dni od daty
      zawarcia niniejszej umowy.
    slots:
    - {id: zapis_alternatywny_ust_3_wydanie_przedmiotow_zam, span: [101, 125], type: text, hint: 'zapis alternatywny ust. 3: Wydanie Przedmiotów
        zamiany następuje wraz z zawarciem niniejszej umowy.'}
  - p: 18
    role: hint
    layout: {align: justify, indent: {left: 720}, size: 10.0, spans: [{start: 1, end: 100, italic: true}]}
    text: '(zapis alternatywny ust. 3: Wydanie Przedmiotów zamiany następuje wraz z zawarciem niniejszej umowy.) '
