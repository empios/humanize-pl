  - p: 21
    role: item
    layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
    text: 'Strony ustalają, że Zamieniający nr 1/Zamieniający nr 2 (należy wybrać odpowiednią opcję) dokona dopłaty na rzecz Zamieniającego nr 1/Zamieniającego
