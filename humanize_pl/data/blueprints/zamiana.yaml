    - {id: p21_1, span: [200, 219], type: amount, context: nr 2 w wysokości ▢ zł z}
    - {id: p21_2, span: [233, 282], type: amount, context: w wysokości zł słownie ▢ złotych z}
  - p: 22
    role: item
