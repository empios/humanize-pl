# Szkielet struktury: zawiadomienie o przestępstwie.
# Wzorce `matches` oparte o sformułowania z szablonów kancelarii.

category: zawiadomienie_przestepstwo
label_pl: zawiadomienie o przestępstwie
check_order: false
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  # Linia „miejscowość, data” albo jej podpis we wzorze. Same „dnia” i „r.”
  # trafiały też w „ustawy z dnia 26 czerwca 1974 r.”, więc usunięta data
  # uchodziła za obecną.
  patterns:
  - '^(?=.{0,90}$)[\p{L}…. ()\t\-]{1,60},\s*(?:dnia\s+)?(?:\d{1,2}\b|…|\.{2,})'
  - '\(miejscowość\W+(?:i\s+)?data'
  - 'zawart\w*\s+(?:w\s+dniu|dnia)\b'
- id: zawiadamiajacy
  label_pl: zawiadamiający
  severity: required
  matches: [dane zawiadamiającego, imię i nazwisko, adres]
- id: adresat
  label_pl: organ
  severity: required
  matches: [prokuratur, policj, jednostki]
- id: podstawa
  label_pl: podstawa (art. 304 k.p.k.)
  severity: required
  matches: [art. 304, kodeksu postępowania karnego, na podstawie]
- id: przestepstwo
  label_pl: opis przestępstwa
  severity: required
  matches: [przestępstwa, polegającego na, 'osoby, która popełniła']
- id: uzasadnienie
  label_pl: uzasadnienie
  severity: required
  matches: [uzasadnienie, uzasadnieniem]
- id: podpis
  label_pl: podpis
  severity: required
  matches: [podpis, własnoręczny]

# Dokument ogólny: realny wzór tej kategorii. Przy użyciu wypełnia się wyłącznie
# pola (`slots`); treść, kolejność i układ zostają jak we wzorze.
document:
  template: Zawiadomienie o możliwości popełnieniu przestępstwa.docx
  label_pl: Zawiadomienie o możliwości popełnienia przestępstwa
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 2269, bottom: 2268, left: 1418, right: 1418}}
  blocks:
  - p: 0
    role: body
    layout: {align: right, indent: {first: 708}, size: 10.0, spans: [{start: 17, end: 30, italic: true}, {start: 52, end: 58, italic: true}]}
    text: '................ (miejscowość), dnia .............. (data)'
    slots:
    - {id: miejscowosc, span: [0, 16], type: place, hint: miejscowość}
    - {id: data, span: [37, 51], type: date, hint: data}
    inline_hints:
    - {span: [17, 30], text: miejscowość}
    - {span: [52, 58], text: data}
  - p: 1
