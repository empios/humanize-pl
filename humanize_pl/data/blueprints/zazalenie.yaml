    layout: {align: justify, size: 11.0}
    text: '………………………………………………………………………………………………'
    slots:
    - {id: adresat, span: [0, 36], type: text, hint: 'sąd albo organ, który rozpozna zażalenie', label: Do}
  - p: 4
