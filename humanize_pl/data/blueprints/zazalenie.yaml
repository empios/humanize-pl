# Szkielet struktury: zażalenie na postanowienie (sąd albo organ).
#
# W postępowaniu cywilnym zażalenie spełnia wymogi pisma procesowego i apelacji
# (art. 394 § 3 k.p.c.); w administracyjnym wnosi się je za pośrednictwem organu,
# który wydał postanowienie (art. 141 k.p.a., art. 236 o.p.). Wzór obejmuje oba tryby.

category: zazalenie
label_pl: zażalenie
check_order: false
sections:
- id: data_miejsce
  label_pl: miejscowość i data
  severity: required
  # Linia „miejscowość, data” albo jej podpis we wzorze.
  patterns:
  - '^(?=.{0,90}$)[\p{L}…. ()\t\-]{1,60},\s*(?:dnia\s+)?(?:\d{1,2}\b|…|\.{2,})'
  - '\(miejscowość\W+(?:i\s+)?data'
- id: adresat
  label_pl: oznaczenie adresata
  severity: required
  matches: ['do:', za pośrednictwem]
- id: wnoszacy
  label_pl: oznaczenie wnoszącego zażalenie
  severity: required
  matches: [wnoszący zażalenie, imię i nazwisko]
- id: sygnatura
  label_pl: sygnatura lub znak sprawy
  severity: expected
  matches: [sygnatura, znak sprawy]
- id: postanowienie
  label_pl: oznaczenie zaskarżonego postanowienia
  severity: required
  matches: [zażalenie na postanowienie, zaskarżam postanowienie]
- id: zarzuty
  label_pl: zarzuty
  severity: required
  matches: [zarzucam]
- id: wnioski
  label_pl: wnioski
  severity: required
  matches: ['wnoszę o:']
- id: uzasadnienie
  label_pl: uzasadnienie
  severity: required
  matches: [uzasadnienie]
- id: podpis
  label_pl: podpis
  severity: required
  matches: [podpis]

# Dokument ogólny: wzór do wypełnienia, bez nazwy konkretnego sądu ani organu.
# Przy użyciu wypełnia się wyłącznie pola (`slots`); treść, kolejność i układ
# zostają jak we wzorze.
document:
  label_pl: Zażalenie na postanowienie
  default_size: 11.0
  page: {size: [11906, 16838], margins: {top: 1417, bottom: 1417, left: 1417, right: 1417}}
  blocks:
