  # ------------------------------------- wydzielone 05.10 z innych kategorii ---
  #
  # Wnioski do pracodawcy leżały pod wnioskiem procesowym, a umowy o zakazie
  # konkurencji pod NDA. Nie mają ich struktury (sądu, stron postępowania,
  # zakresu poufności), więc lista kontrolna tamtych kategorii blokowała je
  # niesłusznie.

  - id: wniosek_pracowniczy
    label_pl: wniosek pracowniczy
    family: filing_official
    signals_strong: ["wniosek o udzielenie urlopu", "wniosek o wydanie świadectwa pracy", "dni wolnych", "urlopu", "świadectwa pracy"]
    signals: ["pracodawc", "pracownik", "kodeks pracy", "kodeksu pracy"]
    # Bez samego „wniosek o udzielenie”: sądowy bywa wnioskiem o udzielenie
    # zabezpieczenia. Bez „o wydanie mi świadectwa pracy”: prosi o nie także
    # pracownik, który wypowiada umowę.
    requires_any: ["wniosek o udzielenie urlopu", "o udzielenie mi urlopu", "wniosek o udzielenie dni wolnych", "wniosek o wydanie świadectwa pracy", "zwolnienia od pracy"]

