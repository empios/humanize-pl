# Katalog kategorii prawniczych.
#
# Każdy dokument wchodzący do narzędzia dostaje dokładnie jedną kategorię z tej
# listy. Kategoria jest drobna i opisowa — to ona nosi szablon struktury.
#
# `family` wskazuje jedną z trzech rodzin `DocumentType`, które sterują
# zachowaniem silnika: normalizacją formatowania, profilem gatunkowym i bramką.
# Rodziny są stabilne i nie rosną; kategorie rosną swobodnie, bo dopisanie
# wiersza tutaj nie zmienia niczego w logice.
#
# signals        — zwroty typowe dla kategorii (waga 1)
# signals_strong — zwroty, które same w sobie niemal ją przesądzają (waga 3)
#
# Sygnały dobiera się pod kątem tego, czego NIE ma w sąsiednich kategoriach.
# "umowa" nie odróżnia umowy zlecenia od umowy najmu i jako sygnał jest
# bezwartościowa — trafia więc do rodziny, nie do kategorii.

version: 1

categories:

  # ---------------------------------------------------------------- umowy ---

  - id: umowa_uslug
    label_pl: umowa o świadczenie usług
    family: contract
    signals_strong: ["świadczenie usług", "usługodawca"]
    signals: ["usługobiorca", "zakres usług", "raport z wykonania", "etapy"]
    requires_any: ["zawarta w dniu", "zawarto umowę", "niniejsza umowa", "strony zawierają", "strony postanawiają", "umowa o świadczenie usług"]

  - id: umowa_zlecenia
