    signals: ["odszkodowani", "kar umown", "po ustaniu"]
    # Bez tytułu w bramce: opinia o takiej umowie nazywa ją tak samo, a nie
    # zawiera jej formuł zawarcia.
    requires_any: ["zawarta w dniu", "zawarto umowę", "niniejsza umowa", "strony zawierają", "strony postanawiają"]

  # ------------------------------------------------------------ bez decyzji ---

  # Zamyka listę i jest jedyną kategorią bez sygnałów: dostaje ją dokument,
  # którego nie udało się rozpoznać. Zgadywanie kategorii byłoby gorsze niż
  # przyznanie się do niewiedzy — szablon struktury dobrany na chybił trafił
  # zgłaszałby braki, których nie ma.
  - id: nieokreslony
    label_pl: nieokreślony
    family: client_communication
    signals_strong: []
    signals: []
