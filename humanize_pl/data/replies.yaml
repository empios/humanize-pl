warnings:
  czynny_zal_skutecznosc: >-
    Czynny żal jest bezskuteczny, gdy organ ma już udokumentowaną wiadomość
    o czynie albo rozpoczął czynności (art. 16 § 5 k.k.s.). Pismo organu w tej
    sprawie może być taką czynnością — sprawdź skuteczność z doradcą.
  korekta_po_kontroli: >-
    Korekta deklaracji złożona w trakcie kontroli lub postępowania podatkowego
    może nie wywołać skutków prawnych. Sprawdź, czy kontrola się rozpoczęła.
  przedluzenie_przed_uplywem: >-
    Wniosek o przedłużenie terminu złóż przed jego upływem; organ nie musi
    go uwzględnić.
  apelacja_wymaga_uzasadnienia: >-
    Apelację wnosi się od wyroku z uzasadnieniem. Jeżeli wyroku nie doręczono
    z urzędu, najpierw złóż wniosek o uzasadnienie (tydzień od ogłoszenia).
  mandat_wyjatkowy: >-
    Przyjęty mandat uchyla się tylko, gdy grzywnę nałożono za czyn, który nie
    jest wykroczeniem. Termin liczy się od uprawomocnienia się mandatu.
  przedawnienie: >-
    Sprawdź, czy roszczenie nie jest przedawnione; zarzut przedawnienia trzeba
    podnieść samemu, a uznanie długu przerywa bieg przedawnienia.
  przywrocenie_z_czynnoscia: >-
    Razem z wnioskiem o przywrócenie terminu dokonaj spóźnionej czynności
    (np. dołącz odwołanie) i uprawdopodobnij brak winy w uchybieniu.
