    label_pl: propozycja ugody lub spłaty w ratach
    category: ugoda
    goal: ugoda
    when: {acts: [wezwanie_do_zaplaty, nakaz_zaplaty, odpis_pozwu]}
  - id: odwolanie_od_wypowiedzenia
    label_pl: odwołanie od wypowiedzenia do sądu pracy
    category: pozew
    goal: kwestionuje
