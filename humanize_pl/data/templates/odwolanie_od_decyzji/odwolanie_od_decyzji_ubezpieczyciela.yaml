- p: 21
  role: body
  layout: {align: justify, size: 10.0}
  text: 'Należy podkreślić, że ubezpieczyciel poprzez zawarcie umowy ubezpieczenia zobowiązuje się do wypłaty odszkodowania, gdy zajdzie określone
    w polisie zdarzenie ubezpieczeniowe. '
- {p: 22, role: spacer}
