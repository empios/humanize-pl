- {p: 24, role: spacer}
- p: 25
  role: body
  layout: {align: justify, size: 10.0}
  text: Działając na podstawie art. 3 ust. 1 i 2 ustawy z dnia 5 sierpnia 2015 r. o rozpatrywaniu reklamacji przez podmioty rynku finansowego,
    o Rzeczniku Finansowy i o Funduszu Edukacji Finansowej, wnoszę reklamacje od wydanej decyzji
- {p: 26, role: spacer}
- p: 27
  role: blank_line
  layout: {align: justify, size: 10.0}
  text: ……………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………….
  slots:
  - {id: nalezy_sprecyzowac_zarzuty_dotyczace_wydanej_dec, span: [0, 166], type: text, hint: 'Należy sprecyzować zarzuty dotyczące wydanej decyzji,
      wskazując oraz udowadniając zaistnienie okoliczności, wedle których ubezpieczyciel winien wypłacić odszkodowanie, w szczególności wskazując
      odpowiednie postanowienia Ogólnych Warunków Ubezpieczenia'}
- p: 28
  role: hint
  layout: {align: justify, size: 10.0, italic: true}
  text: (Należy sprecyzować zarzuty dotyczące wydanej decyzji, wskazując oraz udowadniając zaistnienie okoliczności, wedle których ubezpieczyciel
    winien wypłacić odszkodowanie, w szczególności wskazując odpowiednie postanowienia Ogólnych Warunków Ubezpieczenia)
  hint_for: 27
  hint_kind: instruction
- {p: 29, role: spacer}
- p: 30
  role: body
  layout: {align: justify, size: 10.0}
  text: Zgodnie z art. 361 Kodeksu cywilnego, zobowiązany do odszkodowania ponosi odpowiedzialność tylko za normalne następstwa działania lub
    zaniechania, z którego szkoda wynikła. W powyższych granicach, w braku odmiennego przepisu ustawy lub postanowienia umowy, naprawienie szkody
    obejmuje straty, które poszkodowany poniósł, oraz korzyści, które mógłby osiągnąć, gdyby mu szkody nie wyrządzono.
- {p: 31, role: spacer}
- p: 32
  role: body
  layout: {align: justify, size: 10.0}
  text: Mając na uwadze powyższe, wnoszę o ponowne rozpatrzenie mojej sprawy oraz wypłatę odszkodowania w wysokości pozwalającej na pełną kompensację
    poniesionej szkody.
- {p: 33, role: spacer}
- p: 34
  role: body
  layout: {align: justify, size: 10.0}
  text: Jednocześnie pragnę wskazać, iż nieuwzględnienie niniejszego odwołania, skutkować będzie koniecznością skierowania sprawy na drogę postępowania
    sądowego, co narazi Państwa na dodatkowe koszty. Dodatkowo jako konieczne jawić się będzie również dokonanie zgłoszenia do Rzecznika Finansowego.
    Wobec powyższego, liczę na pozytywne rozpatrzenie niniejszego odwołania.
