      \ opisać wszelkie okoliczności faktyczne sprawy \ni w szczególności powołać wszystkie dowody, takie jak dokumenty czy zeznania świadków.\
      \ Pamiętać należy, iż wytaczając powództwo powód winien w pełni uzasadnić zgłoszone przez siebie roszczenie zarówno co do jego istoty, ale\
      \ także w zakresie kwoty, której zasądzenia się domaga od pozwanego. Wszelkie dowody w postaci dokumentów, jakie będą dołączane do pozwu,\
      \ mogą być kopiami, jednak powód musi pamiętać, iż na żądanie sądu bądź drugiej strony zobowiązany będzie do okazania oryginału przedłożonych\
      \ uprzednio dokumentów. Pozew składany do właściwego sądu w dwóch egzemplarzach; do każdego egzemplarza należy załączyć załączniki."}
