  text: 'Władzami Stowarzyszenia są: '
- p: 73
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: 'Walne Zebranie Członków, '
- p: 74
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: 'Zarząd, '
- p: 75
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: 'Komisja Rewizyjna. '
- p: 76
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Kadencja wszystkich wybieralnych władz Stowarzyszenia trwa ……. lat.
  slots:
  - {id: p76_1, span: [59, 62], type: text, context: wybieralnych władz Stowarzyszenia trwa ▢ lat.}
- {p: 77, role: spacer}
- p: 78
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 14, kind: paragraph, src: manual, level: 0}}
  text: § 14
- p: 79
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Władze Stowarzyszenia wybierane są przez Walne Zebranie Członków w głosowaniu jawnym zwykłą większością głosów. Walne Zebranie może zdecydować
    o przeprowadzeniu głosowania tajnego.
- p: 80
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W razie, gdy skład władz Stowarzyszenia ulegnie zmniejszeniu w czasie trwania kadencji, uzupełnienie ich składu może nastąpić w drodze
    kooptacji, której dokonują pozostali członkowie organu, który uległ zmniejszeniu. W trybie tym można powołać nie więcej niż połowę składu
    organu.
- p: 81
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Pierwszego wyboru władz Stowarzyszenia dokonują założyciele Stowarzyszenia.
- {p: 82, role: spacer}
- p: 83
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 15, kind: paragraph, src: manual, level: 0}}
  text: § 15
- p: 84
  role: body
  layout: {align: justify, size: 10.0}
  text: Uchwały wszystkich władz Stowarzyszenia zapadają w głosowaniu jawnym zwykłą większością głosów, przy obecności co najmniej połowy członków
    uprawnionych do głosowania w pierwszym terminie. W drugim terminie uchwały zapadają bez względu na liczbę obecnych członków, chyba, że dalsze
    postanowienia statutu stanowią inaczej.
- {p: 85, role: spacer}
- p: 86
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 16, kind: paragraph, src: manual, level: 0}}
  text: § 16
- p: 87
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Najwyższą władzą Stowarzyszenia jest Walne Zebranie Członków. '
- p: 88
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Walne Zebranie może być zwyczajne i nadzwyczajne.
- p: 89
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zwyczajne Walne Zebranie sprawozdawcze Zarząd zwołuje raz w roku, zaś sprawozdawczo-wyborcze co 5 lat, zawiadamiając członków o jego terminie,
    miejscu i proponowanym porządku obrad co najmniej na …… dni przed terminem. Jeśli na Walnym Zebraniu nie ma wymaganego kworum, zwołuje się
    zebranie w drugim terminie nie później niż w ciągu miesiąca od dnia zwołania Walnego Zebrania.
  slots:
  - {id: p89_1, span: [196, 198], type: text, context: obrad co najmniej na ▢ dni przed}
- p: 90
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Nadzwyczajne Walne Zebranie zwołuje Zarząd:'
- p: 91
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: z własnej inicjatywy,
- p: 92
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: na żądanie członków Komisji Rewizyjnej,
- p: 93
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 35, end: 44, italic: true}]}
  text: na pisemny wniosek co najmniej ……… (np. 1/3) ogólnej liczby członków zwyczajnych Stowarzyszenia.
  slots:
  - {id: np_1_3, span: [31, 34], type: text, hint: np. 1/3}
  inline_hints:
  - {span: [35, 44], text: np. 1/3}
- p: 94
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Nadzwyczajne Walne Zebranie powinno zostać zwołane przed upływem …… dni od daty zgłoszenia wniosku lub żądania i obradować nad sprawami,
    dla których zostało zwołane.
  slots:
  - {id: p94_1, span: [65, 67], type: text, context: zostać zwołane przed upływem ▢ dni od}
- {p: 95, role: spacer}
- p: 96
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 17, kind: paragraph, src: manual, level: 0}}
  text: § 17
- p: 97
  role: field_header
  layout: {align: justify, indent: {left: 227, hanging: 227}, size: 10.0}
  text: 'Do kompetencji Walnego Zebrania należy: '
- p: 98
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: 'określenie głównych kierunków działania i rozwoju Stowarzyszenia, '
- p: 99
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: uchwalanie zmian statutu,
- p: 100
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: wybór i odwoływanie wszystkich władz Stowarzyszenia,
- p: 101
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: 'udzielanie Zarządowi absolutorium na wniosek Komisji Rewizyjnej, '
