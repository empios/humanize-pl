  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W celu realizacji celów statutowych Stowarzyszenie może prowadzić działalność poza granicami kraju na terenie innych państw, z uwzględnieniem
    i poszanowaniem przepisów obowiązujących w danym państwie.
- {p: 13, role: spacer}
- p: 14
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
