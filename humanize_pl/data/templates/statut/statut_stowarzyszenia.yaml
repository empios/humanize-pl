  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Członkiem zwyczajnym Stowarzyszenia może być każda osoba fizyczna, która złoży pisemną deklarację i uzyska rekomendację dwóch członków
    Stowarzyszenia.
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Przyjęcia nowych członków dokonuje Zarząd uchwałą podjętą nie później niż w ciągu miesiąca od daty złożenia deklaracji. '
- {p: 44, role: spacer}
- p: 45
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 46
  role: field_header
  layout: {align: justify, indent: {left: 227, hanging: 227}, size: 10.0}
  text: 'Członkowie zwyczajni mają prawo do:'
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: biernego i czynnego uczestniczenia w wyborach do władz Stowarzyszenia,
- p: 48
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: korzystania z dorobku i wszelkich form działalności Stowarzyszenia,
- p: 49
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: udziału w zebraniach, wykładach oraz imprezach organizowanych przez Stowarzyszenie,
- p: 50
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: zgłaszania wniosków co do działalności Stowarzyszenia.
- {p: 51, role: spacer}
- p: 52
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- p: 53
  role: field_header
  layout: {align: justify, indent: {left: 227, hanging: 227}, size: 10.0}
  text: 'Członkowie zwyczajni mają obowiązek: '
- p: 54
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: brania udziału w działalności Stowarzyszenia i w realizacji jego celów,
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: uczestniczenia w walnych zebraniach członków,
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: przestrzegania statutu i uchwał władz Stowarzyszenia,
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: regularnego opłacania składek.
- {p: 58, role: spacer}
- p: 59
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 12, kind: paragraph, src: manual, level: 0}}
  text: § 12
- p: 60
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Członkostwo w Stowarzyszeniu ustaje na skutek:'
- p: 61
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: dobrowolnej rezygnacji pisemnej z przynależności do Stowarzyszenia złożonej na ręce Zarządu,
- p: 62
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: śmierci członka lub utraty osobowości prawnej przez członka wspierającego,
- p: 63
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: utraty praw obywatelskich na mocy prawomocnego wyroku sądu.
- p: 64
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Członkostwo w Stowarzyszeniu ustaje także na skutek wykluczenia przez Zarząd z powodu: '
- p: 65
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: nieusprawiedliwionego zalegania z opłatą składek członkowskich przez pół roku,
- p: 66
  role: item
  layout: {align: justify, indent: {left: 1428}, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: rażącego naruszenia Statutu, nieprzestrzegania postanowień i uchwał władz Stowarzyszenia.
- p: 67
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Od uchwały Zarządu w sprawie pozbawienia członkostwa w Stowarzyszeniu przysługuje odwołanie do Walnego Zebrania Członków w terminie ………..
    dni od daty doręczenia stosownej uchwały. Odwołanie jest rozpatrywane na najbliższym Walnym Zebraniu Członków. Uchwała Walnego Zebrania jest
    ostateczna.
  slots:
  - {id: p67_1, span: [132, 137], type: text, context: Zebrania Członków w terminie ▢ dni od}
- {p: 68, role: spacer}
- p: 69
  role: body
