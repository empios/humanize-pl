- p: 15
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Stowarzyszenie posiada osobowość prawną. '
- p: 16
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Stowarzyszenie jest powołane na czas nieokreślony. '
- {p: 17, role: spacer}
- p: 18
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 19
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Stowarzyszenie współpracuje z krajowymi, zagranicznymi i międzynarodowymi organizacjami pozarządowymi i innymi instytucjami.
- p: 20
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Stowarzyszenie może pozostawać członkiem tych organizacji na zasadach pełnej autonomii i równości podmiotów.
- {p: 21, role: spacer}
- p: 22
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Stowarzyszenie opiera swoją działalność na pracy społecznej członków. '
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Do prowadzenia swoich działań Stowarzyszenie może zatrudniać pracowników oraz powoływać biura.
