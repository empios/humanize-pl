- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Datą dokonania zapłaty przez dzierżawcę będzie data uznania rachunku bankowego wydzierżawiającego wskazanego w punkcie wyżej. '
- {p: 25, role: spacer}
- p: 26
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Dzierżawca z dniem ……………….……… przystępuje do użytkowania gruntów wymienionych w § 1 umowy i zobowiązuje się uprawiać ww. grunty zgodnie
    z wymogami prawidłowej gospodarki.
  slots:
  - {id: p27_1, span: [19, 29], type: text, context: Dzierżawca z dniem ▢ przystępuje do}
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Dzierżawca nie może zmieniać przeznaczenia przedmiotu dzierżawy bez uprzedniej pisemnej zgody Wydzierżawiającego.
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Dzierżawca nie może bez uprzedniej pisemnej zgody Wydzierżawiającego oddać osobom trzecim przedmiotu dzierżawy do bezpłatnego użytku ani
    poddzierżawić.
- {p: 30, role: spacer}
- p: 31
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 32
  role: body
  layout: {align: justify, size: 10.0}
  text: W sprawach nie określonych w niniejszej umowie mają zastosowanie odpowiednio przepisy Kodeksu Cywilnego o dzierżawie.
- {p: 33, role: spacer}
- p: 34
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Niniejsza Umowa stanowi całość uzgodnień między Stronami i uchyla wszelkie poprzedzające je Umowy, porozumienia i uzgodnienia, pisemne
    i ustne, dotyczące przedmiotu Umowy. '
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Zmiany i uzupełnienia niniejszej Umowy mogą być dokonane wyłącznie w formie pisemnej pod rygorem nieważności. '
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zawarcie, interpretacja, ważność i wykonanie niniejszej Umowy podlegają przepisom prawa polskiego.
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli którekolwiek z postanowień niniejszej Umowy uznane zostanie za nieważne lub prawnie wadliwe, pozostałe postanowienia pozostają
    w mocy w najszerszym zakresie dopuszczalnym przez prawo.
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie spory wynikające lub związane z niniejszą Umową, których nie można rozstrzygnąć w drodze wzajemnego porozumienia, będą rozstrzygane
    przez sąd powszechny właściwy miejscowo dla miejsca zamieszkania/siedziby Wydzierżawiającego.
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: '6.6. Niniejsza Umowa została sporządzona w dwóch jednobrzmiących egzemplarzach '
- p: 41
  role: body
  layout: {align: justify, indent: {left: 720}, size: 10.0}
  text: w polskiej wersji językowej, po jednym egzemplarzu każdej wersji językowej dla każdej ze Stron.
