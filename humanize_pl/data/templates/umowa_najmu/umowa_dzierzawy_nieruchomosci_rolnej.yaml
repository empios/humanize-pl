- p: 12
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Wydzierżawiający oświadcza, że przedmiot dzierżawy nie jest obciążony żadnymi prawami osób trzecich oraz jest zdatny do użytku zgodnie
    z niniejszą Umową. '
- {p: 13, role: spacer}
- p: 14
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2., kind: paragraph, src: manual, level: 0}}
