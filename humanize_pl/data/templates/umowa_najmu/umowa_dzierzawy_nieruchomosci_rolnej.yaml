- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Strony zobowiązują się pisemnie informować o wszelkich zmianach wyżej wskazanych danych teleadresowych. W razie zaniechania tego obowiązku
    korespondencja pomiędzy Stronami zaadresowana zgodnie z ustępem powyższym traktowana będzie jako skutecznie doręczona.
- {p: 54, role: spacer}
- p: 55
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- {p: 56, role: spacer}
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Niniejsza Umowa stanowi całość uzgodnień między Stronami i uchyla wszelkie poprzedzające je Umowy, porozumienia i uzgodnienia, pisemne
    i ustne, dotyczące przedmiotu Umowy. '
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Zmiany i uzupełnienia niniejszej Umowy mogą być dokonane wyłącznie w formie pisemnej pod rygorem nieważności. '
- p: 59
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zawarcie, interpretacja, ważność i wykonanie niniejszej Umowy podlegają przepisom prawa polskiego.
- p: 60
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli którekolwiek z postanowień niniejszej Umowy uznane zostanie za nieważne lub prawnie wadliwe, pozostałe postanowienia pozostają
    w mocy w najszerszym zakresie dopuszczalnym przez prawo.
- p: 61
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie spory wynikające lub związane z niniejszą Umową, których nie można rozstrzygnąć w drodze wzajemnego porozumienia, będą rozstrzygane
    przez sąd powszechny właściwy miejscowo dla miejsca zamieszkania/siedziby Wydzierżawiającego.
- p: 62
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: "Niniejsza Umowa została sporządzona w dwóch jednobrzmiących egzemplarzach \nw polskiej wersji językowej, po jednym egzemplarzu każdej\
    \ wersji językowej dla każdej ze Stron. "
