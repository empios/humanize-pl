  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wydanie przedmiotu dzierżawy Dzierżawcy nastąpiło w dniu zawarcia niniejszej Umowy, co Dzierżawca niniejszym potwierdza/nastąpi dnia  …………………………..  r.
  slots:
  - {id: p18_1, span: [134, 146], type: date, context: niniejszym potwierdza nastąpi dnia ▢ r.}
- {p: 19, role: spacer}
- p: 20
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3., kind: paragraph, src: manual, level: 0}}
  text: § 3.
- {p: 21, role: spacer}
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, tabs: 4}
  text: "Dzierżawca biorąc nieruchomość rolną do używania i pobierania pożytków nie jest obowiązany do uiszczania czynszu, lecz tylko do ponoszenia\
    \ podatków i innych ciężarów związanych z własnością lub z posiadaniem gruntu.\t\t\t\t"
- {p: 23, role: spacer}
- p: 24
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4., kind: paragraph, src: manual, level: 0}}
  text: § 4.
- {p: 25, role: spacer}
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Dzierżawca zobowiązuje się wykonywać prawo dzierżawy wynikające z niniejszej Umowy zgodnie w wymaganiami prawidłowej gospodarki.
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Dzierżawca nie może zmieniać przeznaczenia przedmiotu dzierżawy bez uprzedniej pisemnej zgody Wydzierżawiającego.
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Dzierżawca nie może bez uprzedniej pisemnej zgody Wydzierżawiającego oddać osobom trzecim przedmiotu dzierżawy do bezpłatnego użytku ani
    poddzierżawić.
- {p: 29, role: spacer}
- p: 30
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5., kind: paragraph, src: manual, level: 0}}
  text: § 5.
- {p: 31, role: spacer}
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Po zakończeniu dzierżawy Dzierżawca zobowiązany jest zwrócić przedmiot dzierżawy w stanie, w jakim powinien się on znajdować w wyniku
    prawidłowego użytkowania, zgodnie z przepisami o wykonywaniu dzierżawy.
- {p: 33, role: spacer}
- {p: 34, role: spacer}
- p: 35
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6., kind: paragraph, src: manual, level: 0}}
  text: § 6.
- {p: 36, role: spacer}
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Umowa może być rozwiązana w każdym czasie za porozumieniem lub przez jedną ze Stron za wypowiedzeniem. Wypowiedzenie powinno być dokonane
    nie później niż na 3 (słownie: trzy) miesiące naprzód na koniec roku dzierżawnego.'
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wydzierżawiający może rozwiązać Umowę bez zachowania terminu wypowiedzenia w przypadkach przewidzianych przez Kodeks cywilny.
- {p: 39, role: spacer}
- p: 40
