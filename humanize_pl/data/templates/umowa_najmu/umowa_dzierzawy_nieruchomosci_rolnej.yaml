- {p: 15, role: spacer}
- p: 16
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wydzierżawiający oddaje, a Dzierżawca bierze w dzierżawę przedmiot dzierżawy opisany w § 1.1 powyżej do używania i pobierania pożytków.
- p: 17
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Niniejsza Umowa zostaje zawarta na czas nieokreślony/na okres ………………… (słownie: …………………).'
  slots:
  - {id: p17_1, span: [62, 69], type: text, context: czas nieokreślony na okres ▢}
  - {id: p17_2, span: [80, 87], type: amount, context: nieokreślony na okres słownie ▢}
- p: 18
