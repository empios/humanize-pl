- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}, {start: 48,
        end: 55, bold: true}]}
  text: Wynajmujący oświadcza, że zobowiązuje się wydać Najemcy fotobudkę nie później niż w ciągu ........... dni kalendarzowych od daty zawarcia
    niniejszej umowy / w dniu …………………….. .
  slots:
  - {id: p26_1, span: [90, 101], type: text, context: później niż w ciągu ▢ dni kalendarzowych}
  - {id: p26_2, span: [164, 174], type: date, context: niniejszej umowy w dniu ▢}
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 34, end: 41, bold: true}]}
  text: Najem fotobudki polega na oddaniu Najemcy do użytkowania fotobudki na okres obowiązywania niniejszej umowy, w zamian za zapłatę Wynajmującemu
    wynagrodzenia określonego w § 5 ust. 1.
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: Najemca zobowiązany jest do używania fotobudki zgodnie z zasadami eksploatacji tego typu urządzeń. [opcjonalnie] Sposób używania określony
    jest w instrukcji użytkowania fotobudki załączonej do niniejszej umowy.
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}, {start: 27,
        end: 40, bold: true}]}
  text: Najemca nie może bez zgody Wynajmującego oddać fotobudki w podnajem osobie trzeciej, jak również nie może przekazać jej do używania w
    drodze użyczenia.
- p: 30
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: '[opcjonalnie] Najemca zapłaci Wynajmującemu kaucję w wysokości ........... zł (słownie: ............... złotych) netto najpóźniej w dniu
    zawarcia niniejszej umowy.'
  slots:
  - {id: p30_1, span: [63, 74], type: amount, context: Wynajmującemu kaucję w wysokości ▢ zł netto}
  - {id: p30_2, span: [88, 103], type: amount, context: w wysokości zł słownie ▢ złotych netto}
- p: 31
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 22, end: 29, bold: true}]}
  text: Po zakończeniu najmu, Najemca obowiązany jest wydać Wynajmującemu fotobudkę w terminie …….. dni od ustania umowy w stanie niepogorszonym
    nad użycie wynikające z prawidłowej, normalnej eksploatacji.
  slots:
  - {id: p32_1, span: [87, 91], type: text, context: Wynajmującemu fotobudkę w terminie ▢ dni od}
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wydanie oraz zwrot fotobudki następuje na podstawie podpisanego przez Strony protokołu zdawczo-odbiorczego.
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 48, end: 59, bold: true}]}
  text: W przypadku stwierdzenia uszkodzenia fotobudki, Wynajmujący uprawniony będzie do zatrzymania kaucji, o której mowa w § 2 ust. 5, w wysokości
    odpowiadającej powstałej szkodzie.
- {p: 35, role: spacer}
