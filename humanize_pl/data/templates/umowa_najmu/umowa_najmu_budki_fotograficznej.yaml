  - {id: p42_2, span: [184, 193], type: text, context: przez bank o numerze ▢}
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 35, end: 42, bold: true}, {start: 105,
        end: 118, bold: true}]}
  text: Za dzień dokonania płatności przez Najemcę uznaje się dzień zaksięgowania płatności na rachunku bankowym Wynajmującego.
- {p: 44, role: spacer}
- p: 45
  role: clause_heading
