- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieregulowanych niniejszą umową obowiązują przepisy ustawy z dnia 23 kwietnia 1964 r. - Kodeks cywilny.
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Dla sporów wynikłych na tle niniejszej umowy właściwy będzie Sąd właściwy ze względu na miejsce zamieszkania Wynajmującego.
- p: 54
