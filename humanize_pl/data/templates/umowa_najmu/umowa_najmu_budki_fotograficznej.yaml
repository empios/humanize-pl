- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 130, end: 143, bold: true}]}
  text: 'Czynsz, o którym mowa w § 5 ust. 1, oraz kaucja określona w § 2 ust. 5 płatne są z góry jednorazowo przelewem na rachunek bankowy Wynajmującego
    prowadzony przez bank ………..  o numerze: …………..………'
  slots:
