  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}]}
  text: Wynajmujący oświadcza, że fotobudka jest w pełni sprawna i zdatna do użytku.
- {p: 24, role: spacer}
- p: 25
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
