- p: 19
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 71, end: 154, italic: true},
      {start: 249, end: 261, italic: true}, {start: 276, end: 339, italic: true}]}
  text: Wynajmujący oddaje w najem Najemcy lokal (gabinet fizjoterapeutyczny) (jeżeli wynajmowana jest tylko część lokalu np. jeden pokój opisać,
    który to z pokoi) wyposażony zgodnie z przeznaczeniem, o powierzchni …….………, znajdujący się w ……………………………………. (adres lokalu), na potrzeby
    prowadzenia działalności leczniczej/wykonywania zabiegów masażu przez Najemcę.
  slots:
  - {id: p19_1, span: [207, 213], type: text, context: z przeznaczeniem o powierzchni ▢ znajdujący się}
  - {id: adres_lokalu, span: [232, 247], type: address, hint: adres lokalu}
  inline_hints:
  - {span: [248, 262], text: adres lokalu}
- p: 20
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący oświadcza, że jest jedynym właścicielem przedmiotu najmu.
- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "Wynajmujący umożliwi Najemcy prawidłowe korzystanie z przedmiotu najmu, \na w szczególności nieodpłatne korzystanie z energii elektrycznej,\
    \ bieżącej wody, telefonów, centralnego ogrzewania, wywóz nieczystości stałych oraz sprzątania pomieszczeń. "
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 100, end: 261, italic: true}]}
  text: "Wraz z lokalem oddane zostaną przedmioty będące na wyposażeniu lokalu zgodnie \nz Załącznikiem nr 1 (zasadnym byłoby stworzenie załącznika,\
    \ w którym zostałyby wymienione wszelkie przedmioty znajdujące się w lokalu, które również będą wykorzystywane przez Najemcę) stanowiącym\
    \ integralną część umowy."
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący oświadcza, że gabinet oraz jego wyposażenie spełnia wymogi ogólnobudowlane, sanitarne i instalacyjne określone przepisami
    rozporządzenia Ministra Zdrowia z dnia z dnia 26 marca 2019 r. w sprawie szczegółowych wymagań, jakim powinny odpowiadać pomieszczenia i urządzenia
    podmiotu wykonującego działalność leczniczą.
- {p: 24, role: spacer}
- p: 25
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: "Najemca będzie mógł świadczyć usługi w wymienionym wyżej lokalu w dniach ………….\nw godzinach od………………... lub zapis alternatywny:  Najemca\
    \ będzie mógł świadczyć usługi \nw wymienionym wyżej lokalu bez ograniczeń czasowych [24h/365 dni w roku] (wskazanie, kiedy Najemca będzie\
    \ świadczył usługi w wynajmowanym lokalu, można tutaj wpisać, inny przedział czasowy. Wskazać, czy korzystanie z lokalu będzie się odbywało\
    \ jednocześnie w tych samych godzinach przez właściciela i najemcę). "
  slots:
  - {id: p26_1, span: [73, 78], type: text, context: wyżej lokalu w dniach ▢ w godzinach}
  - {id: p26_2, span: [93, 102], type: date, context: dniach w godzinach od ▢ lub zapis}
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wskazany w ust. 1 przedział czasowy jest jedynym przedziałem czasowym, w którym Najemca może korzystać z lokalu. [zapis alternatywny]
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Faktyczne rozliczenie godzin, w których Najemca korzysta z lokalu będzie następowało na koniec każdego miesiąca. [zapis alternatywny]
- {p: 29, role: spacer}
- p: 30
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 75, end: 103, italic: true}]}
  text: 'Najemca płacić będzie Wynajmującemu czynsz najmu w wysokości ………………………….. (tutaj należy wpisać stawkę) miesięcznie lub zapis alternatywny:
    za każdą godzinę, w której Najemca faktycznie korzystał z lokalu. Podstawą do ustalenia wymiaru godzin jest rozliczenie, o którym mowa w §
    2 ust. 3 niniejszej umowy.'
  slots:
  - {id: tutaj_nalezy_wpisac_stawke, span: [61, 73], type: amount, hint: tutaj należy wpisać stawkę}
  inline_hints:
  - {span: [74, 102], text: tutaj należy wpisać stawkę}
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 134, end: 150, italic: true}]}
  text: Czynsz płatny będzie w terminie do 14 dni od daty wystawienia faktury, na rachunek bankowy Wynajmującego o numerze ……………………………….………..
    (numer rachunku).
  slots:
  - {id: numer_rachunku, span: [115, 133], type: text, hint: numer rachunku}
  inline_hints:
  - {span: [134, 150], text: numer rachunku}
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Za dzień zapłaty należy uznać datę zaksięgowania środków pieniężnych na rachunku bankowym Wynajmującego.
- {p: 34, role: spacer}
- p: 35
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 36
  role: body
  layout: {align: justify, size: 10.0}
  text: 'Pisemnej zgody Wynajmującego wymagają następujące czynności Najemcy: podnajem oraz oddanie lokalu do bezpłatnego używania osobom trzecim,
    wszystkie zmiany i ulepszenia przedmiotu najmu. '
- {p: 37, role: spacer}
- p: 38
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 39
  role: body
  layout: {align: justify, size: 10.0}
  text: Wynajmujący będzie dokonywał konserwacji lokalu oraz napraw bieżących.
- {p: 40, role: spacer}
