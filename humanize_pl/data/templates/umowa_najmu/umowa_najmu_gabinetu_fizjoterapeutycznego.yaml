  text: 'Umowa zostaje zawarta na czas nieokreślony/określony, czyli od dnia ………….. do dnia ………….. (jeżeli umowa będzie zawarta na czas określony
    należy podać od kiedy do kiedy, bądź np. wskazać, iż umowa będzie zawarta na okres 6 miesięcy od dnia zawarcia niniejszej umowy). '
