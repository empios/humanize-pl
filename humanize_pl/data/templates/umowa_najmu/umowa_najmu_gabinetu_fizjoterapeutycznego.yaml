- p: 48
  role: body
  layout: {align: justify, size: 10.0}
  text: Każda ze stron może umowę wypowiedzieć z zachowaniem 3-miesięcznego okresu wypowiedzenia ze skutkiem na koniec miesiąca kalendarzowego.
- {p: 49, role: spacer}
- p: 50
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- p: 51
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 491, end: 527, italic: true}]}
  text: "Wynajmujący może rozwiązać umowę bez zachowania terminów wypowiedzenia, jeżeli Najemca zalega z należnym czynszem za ……………….. (Należy\
    \ wskazać okres, np. 2 pełne okresy płatności.). Przed rozwiązaniem umowy Wynajmujący powinien uprzedzić Najemcę na piśmie, udzielając mu\
    \ dodatkowego terminu miesięcznego do zapłaty zaległego czynszu. \nW przypadku zaistnienia okoliczności, o których mowa wyżej, Najemca obowiązany\
    \ jest rozliczyć się z Wynajmującym i opuścić przedmiot najmu w terminie …….……… (Należy wskazać termin, np. 7 dni.)."
  slots:
  - {id: nalezy_wskazac_okres_np_2_pelne_okresy_platnosci, span: [117, 125], type: text, hint: 'Należy wskazać okres, np. 2 pełne okresy płatności.'}
  - {id: nalezy_wskazac_termin_np_7_dni, span: [484, 490], type: text, hint: 'Należy wskazać termin, np. 7 dni.'}
  inline_hints:
  - {span: [126, 179], text: 'Należy wskazać okres, np. 2 pełne okresy płatności.'}
  - {span: [491, 526], text: 'Należy wskazać termin, np. 7 dni.'}
- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący może wypowiedzieć Najemcy, bez zachowania terminów wypowiedzenia, umowę również wtedy, gdy Najemca przez swoje niewłaściwe
    zachowanie czyni uciążliwym korzystanie z innych lokali znajdujących się w jego sąsiedztwie.
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący może też wypowiedzieć umowę bez zachowania terminów wypowiedzenia, jeżeli stwierdzi, że Najemca używa przedmiotów wymienionych
    w Załączniku nr 1 do niniejszej umowy niezgodnie z ich przeznaczeniem, bądź też dewastuje je.
- {p: 54, role: spacer}
- p: 55
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: W przypadku opóźnienia Najemcy w uiszczeniu czynszu najmu lub innych opłat określonych w niniejszej umowie, Wynajmujący ma prawo naliczyć
    odsetki ustawowe za opóźnienie oraz karę umowną w wysokości ___% miesięcznego czynszu za każdy rozpoczęty tydzień zwłoki.
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W razie rozwiązania umowy z przyczyn leżących po stronie Najemcy przed upływem okresu najmu, Najemca zobowiązuje się do zapłaty kary umownej
    w wysokości równowartości ___-krotności miesięcznego czynszu, chyba że wypowiedzenie nastąpiło zgodnie z warunkami określonymi w umowie.
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: W przypadku naruszenia przez Najemcę postanowień dotyczących użytkowania lokalu, w tym jego podnajmu bez zgody Wynajmującego, Najemca
    zapłaci karę umowną w wysokości ___ zł za każde naruszenie.
- p: 59
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Zapłata kary umownej nie wyłącza prawa Wynajmującego do dochodzenia odszkodowania przewyższającego jej wysokość, jeżeli poniesiona szkoda
    będzie większa.
- {p: 60, role: spacer}
- p: 61
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 62
  role: body
  layout: {align: justify, size: 10.0}
