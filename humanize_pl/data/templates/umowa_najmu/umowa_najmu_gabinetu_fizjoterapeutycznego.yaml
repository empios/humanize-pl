- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Po okresie, na który zawarta jest umowa, Najemca opuści lokal oraz opróżni go na swój koszt z własnych rzeczy tam wniesionych. '
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Najemca zda Wynajmującemu również przedmioty, o których mowa w Załączniku nr 1 do niniejszej umowy w stanie niepogorszonym, z uwzględnieniem
    ich zwykłego zużycia.
- {p: 45, role: spacer}
