- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący oświadcza, że lokal jest wolny od obciążeń na rzecz osób trzecich, które mogłyby utrudnić lub uniemożliwić wykonywanie uprawnień
    Najemcy wynikających z niniejszej umowy.
- p: 30
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Najemca oświadcza, że zapoznał się ze stanem technicznym lokalu, a także z jego wyposażeniem.
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 278, end: 292, bold: true}]}
  text: Strony oświadczają, że stan techniczny lokalu, jego wyposażenie, wskazania liczników oraz ilość kompletów kluczy przekazanych Najemcy
    zostanie szczegółowo opisany w protokole zdawczo-odbiorczym, który sporządzony zostanie w dniu wydania lokalu Najemcy. Protokół stanowić będzie
    Załącznik nr 1 do niniejszej umowy.
- {p: 32, role: spacer}
- p: 33
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: "Wynajmujący wynajmuje i oddaje Najemcy w używanie lokal do celów mieszkalnych, \na Najemca zobowiązuje się płacić Wynajmującemu umówiony\
    \ czynsz."
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Zmiana sposobu przeznaczenia lokalu wymaga uprzedniej pisemnej zgody Wynajmującego.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "Najemca nie ma prawa podnajmować ani udostępniać lokalu ani jego części osobom trzecim, \nbez zgody Wynajmującego wyrażonej w formie\
    \ pisemnej pod rygorem nieważności."
