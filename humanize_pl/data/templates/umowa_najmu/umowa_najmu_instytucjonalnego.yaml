- {p: 112, role: spacer}
- p: 113
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 12, kind: paragraph, src: manual, level: 0}}
  text: § 12
- p: 114
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany niniejszej Umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 115
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych niniejszą Umową zastosowanie znajdą przepisy ustawy z dnia 23 kwietnia 1964 r. - Kodeks cywilny (t.j. Dz.U.2024.1061
    ze zm.) oraz ustawy z dnia 21 czerwca 2001 r. o ochronie praw lokatorów, mieszkaniowym zasobie gminy i o zmianie Kodeksu cywilnego.
- p: 116
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie spory wynikłe na tle stosowania postanowień niniejszej umowy, rozstrzyga sąd właściwy dla miejsca zamieszkania Wynajmującego.
- p: 117
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Umowę niniejszą sporządzono w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze Stron.
