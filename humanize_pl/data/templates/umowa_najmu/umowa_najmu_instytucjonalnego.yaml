- p: 81
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: korzystania z lokalu na cele mieszkaniowe;
- p: 82
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: utrzymania należytego stanu sanitarnego, technicznego i estetycznego lokalu i jego wyposażenia;
- p: 83
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: przeprowadzania bieżącej konserwacji i napraw lokalu na własny koszt;
- p: 84
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
  text: przeprowadzenia na własny koszt drobnych napraw podłóg, drzwi i okien, malowania ścian, podłóg oraz wewnętrznej strony drzwi wejściowych
    oraz drobnych napraw instalacji i urządzeń technicznych;
- p: 85
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
  text: niedokonywania, bez pisemnej zgody Wynajmującego, zmian naruszających substancję lokalu;
- p: 86
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 6), kind: decimal, src: auto, level: 0}}
  text: zawiadamiania Wynajmującego o wszelkich usterkach i wadach lokalu oraz konieczności przeprowadzenia napraw, które obciążają Wynajmującego.
- p: 87
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 7), kind: decimal, src: auto, level: 0}}
  text: przestrzegania zasad współżycia społecznego oraz obowiązującego Regulaminu Spółdzielni/Wspólnoty Mieszkaniowej „..............”;
  slots:
  - {id: p87_1, span: [112, 126], type: text, context: Regulaminu Spółdzielni Wspólnoty Mieszkaniowej ▢}
- p: 88
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 8), kind: decimal, src: auto, level: 0}}
  text: dbania i chronienia przed uszkodzeniem i dewastacją części budynku przeznaczonego do wspólnego korzystania;
- p: 89
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 9), kind: decimal, src: auto, level: 0}}
  text: udostępniania Wynajmującemu lokalu do wglądu, przy czym Wynajmujący może dokonać wglądu jedynie w obecności Najemcy. Strony zgodnie postanawiają,
    że przeglądy będą się odbywać okresowo, nie częściej niż .............. .
  slots:
  - {id: p89_1, span: [203, 217], type: text, context: okresowo nie częściej niż ▢}
- p: 90
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 10), kind: decimal, src: auto, level: 0}}
  text: niezwłocznego udostępnienia lokalu w celu usunięcia przez Wynajmującego lub odpowiednie Służby awarii mogącej wywołać szkodę. W przypadku
    nieobecności Najemy lub odmowy przez Niego dostępu do lokalu, Wynajmujący ma prawo wejść do lokalu w obecności funkcjonariusza Policji, Straży
    Miejskiej lub Straży Pożarnej. Jeżeli otwarcie lokalu nastąpiło pod nieobecność Najemcy, Wynajmujący jest obowiązany zabezpieczyć lokal i
    znajdujące się w nim rzeczy do czasu przybycia Najemcy; z czynności tych sporządza się protokół.
- p: 91
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 11), kind: decimal, src: auto, level: 0}}
  text: udostępnienia lokalu Wynajmującemu w celu wykonania prac i remontów obciążających Wynajmującego, a także zastępczego wykonania przez Wynajmującego
    prac obciążających Najemcę;
- p: 92
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 12), kind: decimal, src: auto, level: 0}}
  text: naprawienia szkód powstałych z Jego winy.
- {p: 93, role: spacer}
- p: 94
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- p: 95
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wypowiedzenie Umowy może nastąpić w przypadkach przewidzianych przez przepisy powszechnie obowiązujące.
- p: 96
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wypowiedzenie Umowy, pod rygorem nieważności, powinno być dokonane w formie pisemnej.
- p: 97
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "W okresie od dnia dostarczenia wypowiedzenia Umowy przez którąkolwiek ze Stron do dnia, \nw którym nastąpi zwrot Przedmiotu najmu, Najemca\
    \ jest zobowiązany umożliwić Wynajmującemu pokazanie lokalu potencjalnym najemcom, po uprzednim ustaleniu terminu."
- p: 98
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: "Pokazywanie lokalu potencjalnym najemcom odbywać się może maksymalnie jednego dnia \nw tygodniu, w godzinach od …. do …."
  slots:
  - {id: p98_1, span: [111, 113], type: date, context: tygodniu w godzinach od ▢ do}
  - {id: p98_2, span: [117, 119], type: date, context: w godzinach od do ▢}
- {p: 99, role: spacer}
- p: 100
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 101
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 457, end: 471, bold: true}]}
  text: "Najemca zobowiązany jest w dniu podpisania niniejszej Umowy dostarczyć Wynajmującemu oświadczenie Najemcy w formie aktu notarialnego,\
    \ w którym poddał się egzekucji i zobowiązał się do opróżnienia i wydania Lokalu używanego na podstawie niniejszej Umowy najmu instytucjonalnego\
    \ w terminie wskazanym w żądaniu, o którym mowa w art. 19i ust. 3 ustawy \no ochronie praw lokatorów, mieszkaniowym zasobie gminy i o zmianie\
    \ Kodeksu cywilnego, które stanowić będzie Załącznik nr 2 do Umowy."
- p: 102
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: "Niniejsza umowa zawarta jest pod warunkiem dostarczenia Wynajmującemu oświadczenia, \no którym mowa w § 9 ust. 1."
- {p: 103, role: spacer}
- p: 104
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 105
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: "Najemca zobowiązuje się do opróżnienia lokalu i wydania go Wynajmującemu, wraz \nz wyposażeniem, najpóźniej w dniu rozwiązania umowy,\
    \ w stanie niepogorszonym \nz uwzględnieniem normalnego zużycia."
- p: 106
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W przypadku gdy po opuszczeniu lokalu przez Najemcę w lokalu pozostaną rzeczy wniesione przez Najemcę, Wynajmujący ma prawo przenieść
    je w inne miejsce na koszt i ryzyko Najemcy.
- p: 107
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli Najemca nie wyda lokalu w terminie określonym w § 9 ust. 1, obowiązany będzie uiszczać na rzecz Wynajmującego odszkodowanie odpowiadające
    wysokości czynszu, jaki właściciel mógłby otrzymać z tytułu najmu lokalu. Jeżeli odszkodowanie nie pokrywa poniesionych strat, Wynajmujący
    może żądać od Najemcy odszkodowania uzupełniającego.
- p: 108
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: "W przypadku nieopróżnienia lokalu, Wynajmujący ma prawo złożyć do sądu wniosek \no nadanie klauzuli wykonalności aktowi notarialnemu\
    \ określonemu § 9 ust. 1."
- {p: 109, role: spacer}
- p: 110
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- p: 111
  role: body
  layout: {align: justify, size: 10.0, spans: [{start: 265, end: 359, italic: true}]}
  text: 'Najemca zobowiązuje się niezwłocznie informować Wynajmującego o adresowanej do niego korespondencji i o sprawach wymagających jego udziału,
    najpóźniej w terminie 7 dni od doręczenia korespondencji, w sposób następujący: ............................................ (należy wskazać
    odpowiednie źródło komunikacji, np. telefonicznie, poprzez SMS, mailowo itp.).'
  slots:
