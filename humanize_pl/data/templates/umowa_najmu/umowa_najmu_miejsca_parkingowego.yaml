- p: 33
  role: body
  layout: {align: justify, size: 10.0}
  text: Wynajmujący wynajmuje i oddaje do korzystania Najemcy nieruchomość opisaną w § 1 powyżej, tj. miejsce parkingowe, a Najemca bierze niniejszą
    nieruchomość w najem za umówionym czynszem.
- {p: 34, role: spacer}
- p: 35
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Umowa najmu zostaje zawarta na czas nieokreślony od dnia ………… / na czas określony od dnia ………………….... do dnia……………………..….. '
  slots:
  - {id: p36_1, span: [57, 61], type: date, context: czas nieokreślony od dnia ▢ na czas}
  - {id: p36_2, span: [90, 101], type: date, context: czas określony od dnia ▢ do dnia}
  - {id: p36_3, span: [109, 122], type: date, context: od dnia do dnia ▢}
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Każdej ze Stron przysługuje prawo rozwiązania niniejszej umowy z zachowaniem ………… okresu wypowiedzenia.
  slots:
  - {id: p37_1, span: [77, 81], type: text, context: niniejszej umowy z zachowaniem ▢ okresu wypowiedzenia.}
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Oświadczenie o wypowiedzeniu lub rozwiązaniu umowy pod rygorem nieważności powinno zostać złożone w formie pisemnej.
- {p: 39, role: spacer}
- p: 40
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: "Czynsz najmu wynosi ………..……. (słownie: ……………….…) złotych miesięcznie i płatny jest \nz góry w terminie do ….. dnia każdego miesiąca na\
    \ rachunek bankowy Wynajmującego ………………. prowadzony przez bank ……………"
  slots:
  - {id: p41_1, span: [20, 28], type: text, context: Czynsz najmu wynosi ▢ złotych miesięcznie}
  - {id: p41_2, span: [39, 47], type: amount, context: Czynsz najmu wynosi słownie ▢ złotych miesięcznie}
  - {id: p41_3, span: [105, 108], type: date, context: góry w terminie do ▢ dnia każdego}
  - {id: p41_4, span: [165, 172], type: text, context: na rachunek bankowy Wynajmującego ▢ prowadzony przez}
  - {id: p41_5, span: [195, 200], type: text, context: Wynajmującego prowadzony przez bank ▢}
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Za datę zapłaty uznaje się dzień, w którym środki zostaną zaksięgowane na rachunku bankowym Wynajmującego.
- {p: 43, role: spacer}
- p: 44
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Najemca zobowiązuję się nie dokonywać żadnych zmian budowlanych w przedmiocie najmu, chyba że wyrazi na to zgodę Wynajmujący. Nakłady
    poniesione przez Najemcę w celu trwałego ulepszenia przedmiotu najmu, dokonane po uzyskaniu uprzedniej zgody Wynajmującego, z chwilą rozwiązania
    umowy, Wynajmujący ma prawo, według własnego uznania, zwrócić ich równowartość Najemcy lub też żądać ich odłączenia od przedmiotu najmu i
    przywrócenia go do stanu poprzedniego.
- p: 46
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: '[opcjonalnie] Strony zgodnie ustalają, że drobne nakłady na przedmiot najmu obciążają Najemcę. Do drobnych nakładów Strony zaliczają
    w szczególności ……………………………………. .'
  slots:
  - {id: p46_1, span: [149, 164], type: text, context: Strony zaliczają w szczególności ▢}
- {p: 47, role: spacer}
- p: 48
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 49
  role: body
  layout: {align: justify, size: 10.0}
  text: 'Jako zabezpieczenie wszelkich należności przysługujących Wynajmującemu od Najemcy z tytułu niniejszej umowy, Najemca wpłaci Wynajmującemu
    w terminie do dnia ……. na rachunek bankowy…/gotówką …… kaucję w wysokości ………. (słownie: ……………….) złotych. Wpłacona kaucja nie podlega oprocentowaniu
    i podlega zwrotowi przez Wynajmującego na rzecz Najemcy po zakończeniu umowy najmu  w terminie … dni od dnia jej zakończenia.'
  slots:
  - {id: p49_1, span: [157, 160], type: date, context: w terminie do dnia ▢ na rachunek}
  - {id: p49_2, span: [190, 192], type: text, context: na rachunek bankowy… gotówką ▢ kaucję w}
  - {id: p49_3, span: [212, 216], type: amount, context: gotówką kaucję w wysokości ▢ złotych. Wpłacona}
  - {id: p49_4, span: [227, 234], type: amount, context: kaucję w wysokości słownie ▢ złotych. Wpłacona}
- {p: 50, role: spacer}
- p: 51
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- p: 52
  role: body
  layout: {align: justify, size: 10.0}
  text: "Najemca nie ma prawa podnajmować, ani też oddawać do bezpłatnego używania, przedmiotu najmu \nw całości, ani w części osobom trzecim."
- {p: 53, role: spacer}
- p: 54
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Wynajmującemu przysługuje prawo wypowiedzenia umowy najmu, bez zachowania terminu wypowiedzenia, w następujących wypadkach:'
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: jeżeli Najemca pomimo pisemnego upomnienia nadal używa przedmiotu najmu w sposób sprzeczny z umową lub niezgodnie z jego przeznaczeniem
    lub zaniedbuje obowiązki, dopuszczając do powstania szkód, lub niszczy urządzenia przeznaczone do wspólnego korzystania przez mieszkańców
    albo wykracza w sposób rażący lub uporczywy przeciwko porządkowi domowemu, lub
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: jeżeli Najemca jest w zwłoce z zapłatą czynszu lub innych opłat za używanie lokalu co najmniej za jeden pełen okres płatności pomimo uprzedzenia
    go na piśmie o zamiarze wypowiedzenia najmu i wyznaczenia dodatkowego, miesięcznego terminu do zapłaty zaległych i bieżących należności, lub
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: jeżeli Najemca wynajął, podnajął albo oddał do bezpłatnego używania przedmiotu najmu bez wymaganej zgody Wynajmującego.
- p: 59
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'W przypadku zakończenia umowy najmu Najemca jest zobowiązany do zwrotu przedmiotu najmu Wynajmującemu w terminie …. dni od dnia zakończenia
    umowy. '
  slots:
  - {id: p59_1, span: [113, 115], type: text, context: najmu Wynajmującemu w terminie ▢ dni od}
- {p: 60, role: spacer}
- p: 61
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 62
  role: body
  layout: {align: justify, size: 10.0}
  text: Wszelkie zmiany niniejszej umowy wymagają formy pisemnej pod rygorem nieważności.
- {p: 63, role: spacer}
- p: 64
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 65
  role: body
  layout: {align: justify, size: 10.0}
  text: Ewentualne spory wynikłe na tle niniejszy umowy rozstrzygane będą przez sąd powszechny właściwy ze względu na miejsce zamieszkania Wynajmującego.
- {p: 66, role: spacer}
- p: 67
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- p: 68
  role: body
  layout: {align: justify, size: 10.0}
  text: 'Umowę spisano w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron. '
- {p: 69, role: spacer}
- p: 70
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 12, kind: paragraph, src: manual, level: 0}}
  text: § 12
- p: 71
  role: body
  layout: {align: justify, size: 10.0}
  text: W sprawach nieuregulowanych w umowie będą miały zastosowanie przepisy ustawy z dnia 23 kwietnia 1964 r. - Kodeks cywilny.
