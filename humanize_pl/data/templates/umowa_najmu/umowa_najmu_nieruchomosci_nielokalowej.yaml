- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 6), kind: decimal, src: auto, level: 0}}
  text: Najemca oddał Nieruchomość w podnajem lub do używania osobie trzeciej bez zgody Wynajmującego;
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 7), kind: decimal, src: auto, level: 0}}
  text: Najemca dokonał w Nieruchomości zmian lub ulepszeń bez zgody Wynajmującego.
- p: 54
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca ma prawo rozwiązać umowę bez zachowania okresu wypowiedzenia w przypadku, gdy:'
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: Wynajmujący zwleka z wydaniem przedmiotu umowy w umówionym terminie;
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: 'Nieruchomość okaże się posiadać wady lub usterki uniemożliwiające korzystanie z niego zgodnie z przeznaczeniem. '
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: Wypowiedzenie lub rozwiązanie umowy, pod rygorem nieważności, powinno być dokonane w formie pisemnej.
