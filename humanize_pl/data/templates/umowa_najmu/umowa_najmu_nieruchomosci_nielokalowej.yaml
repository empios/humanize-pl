  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Za dzień zapłaty uważa się dzień, w którym zaksięgowane zostaną środki na rachunku bankowym Wynajmującego.
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 13, italic: true}]}
  text: (opcjonalnie) Czynsz za najem Nieruchomości będzie waloryzowany raz w roku o średnioroczny procentowy wzrost lub spadek Indeksu Wzrostu
    Cen Towarów i Usług Konsumpcyjnych, ogłoszony przez Prezesa Głównego Urzędu Statystycznego za poprzedni rok kalendarzowy. Waloryzacja nie
    wymaga zawarcia aneksu w formie pisemnej. Pierwsza waloryzacja nastąpi w …………… r., kolejne waloryzacje będą następowały w lutym każdego kolejnego
    roku.
  slots:
  - {id: p39_1, span: [347, 352], type: place, context: Pierwsza waloryzacja nastąpi w ▢ r. kolejne}
