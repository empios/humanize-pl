- p: 17
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: "Wynajmujący oświadcza, że Nieruchomość jest wolna od obciążeń na rzecz osób trzecich, które mogłyby utrudnić lub uniemożliwić wykonywanie\
    \ uprawnień Najemcy wynikających \nz niniejszej umowy."
- {p: 18, role: spacer}
- p: 19
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- {p: 20, role: spacer}
- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący wynajmuje i oddaje Najemcy Nieruchomość w używanie, a Najemca zobowiązuje się płacić Wynajmującemu umówiony czynsz.
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Zmiana sposobu przeznaczenia Nieruchomości wymaga uprzedniej zgody Wynajmującego wyrażonej w formie pisemnej pod rygorem nieważności.
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca nie ma prawa podnajmować ani udostępniać Nieruchomości ani jej części osobom trzecim, bez zgody Wynajmującego wyrażonej w formie
    pisemnej pod rygorem nieważności. '
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Najemca zobowiązuje się wykorzystywać Nieruchomość zgodnie z umową, w tym zgodnie z jej przeznaczeniem i właściwościami, oraz zasadami
    prawidłowej gospodarki, a w szczególności utrzymywać Nieruchomość w niepogorszonym stanie ponad jej zużycie będące następstwem prawidłowego
    używania.
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca nie może dokonywać na Nieruchomości zmian ani ulepszeń bez uprzedniej zgody Wynajmującego wyrażonej w formie pisemnej pod rygorem
    nieważności. '
- {p: 26, role: spacer}
- p: 27
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
