- {p: 28, role: spacer}
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący zobowiązuje się wydać Najemcy Nieruchomość nie później niż w ciągu ........... dni kalendarzowych od daty zawarcia niniejszej
    umowy.
  slots:
  - {id: p29_1, span: [79, 90], type: text, context: później niż w ciągu ▢ dni kalendarzowych}
- p: 30
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca zobowiązuje się zwrócić Wynajmującemu Nieruchomość nie później niż w ciągu ........... dni kalendarzowych od daty wygaśnięcia
    lub rozwiązania niniejszej umowy z jakiegokolwiek powodu. '
  slots:
  - {id: p30_1, span: [83, 94], type: text, context: później niż w ciągu ▢ dni kalendarzowych}
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 132, end: 141, bold: true}, {
        start: 142, end: 146, bold: true}]}
  text: Wydanie przedmiotu umowy i jego zwrot po zakończeniu najmu zostaną potwierdzone protokołem zdawczo-odbiorczym, którego wzór stanowi Załącznik
    nr 1 do niniejszej Umowy.
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Po zakończeniu trwania niniejszej umowy Najemca obowiązany jest zwrócić Wynajmującemu przedmiot umowy w stanie niepogorszonym; jednakże
    Najemca nie ponosi odpowiedzialności za zużycie przedmiotu umowy będące następstwem prawidłowego, normalnego używania.
- {p: 33, role: spacer}
