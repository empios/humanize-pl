  role: clause_heading
  layout: {align: center, size: 14.0, bold: true, marker: {text: § 12, kind: paragraph, src: manual, level: 0}}
  text: § 12
- p: 102
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca zobowiązany jest w dniu podpisania niniejszej umowy dostarczyć Wynajmującemu:'
- p: 103
  role: item
  layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}, spans: [{start: 21, end: 47,
        bold: true}, {start: 395, end: 409, bold: true}]}
  text: oświadczenie Najemcy w formie aktu notarialnego, w którym Najemca poddał się egzekucji i zobowiązał się do opróżnienia i wydania lokalu
    używanego na podstawie niniejszej umowy najmu, w terminie wskazanym w żądaniu, o którym mowa w art. 19d ust. 2 ustawy z dnia 21 czerwca 2001
    r. o ochronie praw lokatorów, mieszkaniowym zasobie gminy i o zmianie Kodeksu cywilnego (oświadczenie stanowić będzie Załącznik nr 2 do niniejszej
    umowy);
- p: 104
  role: item
  layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}, spans: [{start: 162, end: 176,
        bold: true}]}
  text: wskazanie przez Najemcę innego lokalu, w którym będzie mógł zamieszkać w przypadku wykonania egzekucji obowiązku opróżnienia lokalu (oświadczenie
    stanowić będzie Załącznik nr 3 do niniejszej umowy);
- p: 105
  role: item
  layout: {align: justify, indent: {left: 1068}, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}, spans: [{start: 299, end: 314,
        bold: true}]}
  text: "oświadczenie w formie pisemnej z podpisem notarialnie poświadczonym właściciela lokalu lub osoby posiadającej tytuł prawny do lokalu,\
    \ o którym mowa w pkt 1 lub 2, \no wyrażeniu zgody na zamieszkanie Najemcy i osób z nim zamieszkujących w lokalu wskazanym w oświadczeniu\
    \ (oświadczenie stanowić będzie Załącznik nr 4 do niniejszej umowy)."
- p: 106
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 104, end: 121, bold: true}]}
  text: W razie utraty możliwości zamieszkania w lokalu, o którym mowa w ust. 1 pkt 2, Najemca jest obowiązany, w terminie 21 dni od dnia powzięcia
    wiadomości o tym zdarzeniu, wskazać inny lokal, w którym będzie mógł zamieszkać w przypadku wykonania egzekucji obowiązku opróżnienia lokalu,
    oraz przedstawić nowe oświadczenie, o którym mowa w ust. 1 pkt 2 i 3, dotyczące tego lokalu, pod rygorem prawa Wynajmującego do wypowiedzenia
    niniejszej umowy, z zachowaniem ..... – dniowego okresu wypowiedzenia.
  slots:
  - {id: p106_1, span: [456, 461], type: text, context: niniejszej umowy z zachowaniem ▢ dniowego okresu}
- p: 107
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "Niniejsza umowa zawarta jest pod warunkiem dostarczenia Wynajmującemu oświadczeń, \no których mowa w § 12 ust. 1."
