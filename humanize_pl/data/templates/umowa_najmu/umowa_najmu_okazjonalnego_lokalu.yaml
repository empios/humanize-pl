- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: "[opcjonalnie] Czynsz za wynajem lokalu będzie waloryzowany raz w roku o średnioroczny procentowy wzrost lub spadek Indeksu Wzrostu Cen\
    \ Towarów i Usług Konsumpcyjnych, ogłoszony przez Prezesa Głównego Urzędu Statystycznego za poprzedni rok kalendarzowy. Waloryzacja nie wymaga\
    \ zawarcia aneksu w formie pisemnej. Pierwsza waloryzacja nastąpi \nw …………… r., kolejne waloryzacje będą następowały w lutym każdego kolejnego\
    \ roku."
