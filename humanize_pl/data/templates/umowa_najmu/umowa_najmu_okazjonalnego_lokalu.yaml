  text: sporządzenia, przy udziale Najemcy, protokołu zdawczo-odbiorczego w dniu przekazania lokalu Najemcy;
- p: 68
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
  text: przeprowadzenia remontów przekraczających zakres wskazany w § 10 pkt 2-4;
- p: 69
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 6), kind: decimal, src: auto, level: 0}}
  text: "zapewnienia sprawnego działania istniejących instalacji i urządzeń związanych \nz lokalem, umożliwiających Najemcy korzystanie z wody,\
    \ ciepła, energii elektrycznej, oraz innych instalacji i urządzeń stanowiących wyposażenie lokalu."
- {p: 70, role: spacer}
