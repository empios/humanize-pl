- p: 50
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli z wyliczenia o którym mowa w § 7 ust. 3 wynikać będzie nadpłata, jej wysokość zostanie zaliczona na poczet najbliższego czynszu
    za wynajem lokalu. Jeżeli nadpłata przekraczać będzie równowartość jednomiesięcznego czynszu, pozostała część zostanie zaliczona na poczet
    kolejnego czynszu. Jeżeli nadpłata będzie występować po rozwiązaniu umowy najmu, Wynajmujący zwróci Najemcy różnicę pomiędzy kwotą zapłaconą
    przez Najemcę tytułem zaliczek a faktyczną kwotą zobowiązań wynikających z rachunków dotyczących opłat eksploatacyjnych.
