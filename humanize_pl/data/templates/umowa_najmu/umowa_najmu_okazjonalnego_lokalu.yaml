  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 13, kind: paragraph, src: manual, level: 0}}
  text: § 13
- p: 110
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: "Najemca zobowiązuje się do opróżnienia lokalu i wydania go Wynajmującemu, wraz \nz wyposażeniem, najpóźniej w dniu rozwiązania umowy,\
    \ w stanie niepogorszonym \nz uwzględnieniem normalnego zużycia."
- p: 111
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W przypadku gdy po opuszczeniu lokalu przez Najemcę w lokalu pozostaną rzeczy wniesione przez Najemcę, Wynajmujący ma prawo przenieść
    je w inne miejsce na koszt i ryzyko Najemcy.
- p: 112
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli Najemca nie wyda lokalu w terminie określonym w § 12 ust. 1, obowiązany będzie uiszczać na rzecz Wynajmującego odszkodowanie odpowiadające
    wysokości czynszu, jaki właściciel mógłby otrzymać z tytułu najmu lokalu. Jeżeli odszkodowanie nie pokrywa poniesionych strat, Wynajmujący
    może żądać od Najemcy odszkodowania uzupełniającego.
- p: 113
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: "W przypadku nieopróżnienia lokalu, Wynajmujący ma prawo złożyć do sądu wniosek \no nadanie klauzuli wykonalności aktowi notarialnemu\
    \ określonemu § 12 ust. 1 pkt 1."
