  text: § 10
- p: 72
  role: field_header
  layout: {align: justify, size: 10.0}
  text: 'Najemca zobowiązany jest do:'
- p: 73
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: korzystania z lokalu na cele mieszkaniowe;
- p: 74
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: utrzymania należytego stanu sanitarnego, technicznego i estetycznego lokalu i jego wyposażenia;
- p: 75
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: przeprowadzania bieżącej konserwacji i napraw lokalu na własny koszt;
- p: 76
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
  text: "przeprowadzenia na własny koszt drobnych napraw podłóg, drzwi i okien, malowania ścian, podłóg oraz wewnętrznej strony drzwi wejściowych\
    \ oraz drobnych napraw instalacji \ni urządzeń technicznych;"
- p: 77
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
  text: niedokonywania, bez pisemnej zgody Wynajmującego, zmian naruszających substancję lokalu;
- p: 78
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 6), kind: decimal, src: auto, level: 0}}
  text: zawiadamiania Wynajmującego o wszelkich usterkach i wadach lokalu oraz konieczności przeprowadzenia napraw, które obciążają Wynajmującego.
- p: 79
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 7), kind: decimal, src: auto, level: 0}}
  text: przestrzegania zasad współżycia społecznego oraz obowiązującego Regulaminu Spółdzielni/Wspólnoty Mieszkaniowej;
- p: 80
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 8), kind: decimal, src: auto, level: 0}}
  text: dbania i chronienia przed uszkodzeniem i dewastacją części budynku przeznaczonego do wspólnego korzystania;
- p: 81
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 9), kind: decimal, src: auto, level: 0}}
  text: udostępniania Wynajmującemu lokalu do wglądu, przy czym Wynajmujący może dokonać wglądu jedynie w obecności Najemcy. Strony zgodnie postanawiają,
    że przeglądy będą się odbywać okresowo, nie częściej niż .............;
  slots:
  - {id: p81_1, span: [203, 216], type: text, context: okresowo nie częściej niż ▢}
- p: 82
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 10), kind: decimal, src: auto, level: 0}}
  text: "niezwłocznego udostępnienia lokalu w celu usunięcia przez Wynajmującego lub odpowiednie Służby awarii mogącej wywołać szkodę. W przypadku\
    \ nieobecności Najemy lub odmowy przez Niego dostępu do lokalu, Wynajmujący ma prawo wejść do lokalu\nw obecności funkcjonariusza Policji,\
    \ Straży Miejskiej lub Straży Pożarnej. Jeżeli otwarcie lokalu nastąpiło pod nieobecność Najemcy, Wynajmujący jest obowiązany zabezpieczyć\
    \ lokal \ni znajdujące się w nim rzeczy do czasu przybycia Najemcy; z czynności tych sporządza się protokół;"
- p: 83
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 11), kind: decimal, src: auto, level: 0}}
  text: udostępnienia lokalu Wynajmującemu w celu wykonania prac i remontów obciążających Wynajmującego, a także zastępczego wykonania przez Wynajmującego
    prac obciążających Najemcę;
- p: 84
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 12), kind: decimal, src: auto, level: 0}}
  text: naprawienia szkód powstałych z Jego winy.
- {p: 85, role: spacer}
- p: 86
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- p: 87
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Wynajmujący może wypowiedzieć umowę nie później niż na miesiąc naprzód, na koniec miesiąca kalendarzowego, jeżeli lokator:'
- p: 88
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: 'pomimo pisemnego upomnienia nadal używa lokalu w sposób sprzeczny z umową lub niezgodnie z jego przeznaczeniem lub zaniedbuje obowiązki,
    dopuszczając do powstania szkód, lub niszczy urządzenia przeznaczone do wspólnego korzystania przez mieszkańców albo wykracza w sposób rażący
    lub uporczywy przeciwko porządkowi domowemu, czyniąc uciążliwym korzystanie z innych lokali, lub '
- p: 89
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: jest w zwłoce z zapłatą czynszu, innych opłat za używanie lokalu lub opłat niezależnych od właściciela pobieranych przez właściciela tylko
    w przypadkach, gdy lokator nie ma zawartej umowy bezpośrednio z dostawcą mediów lub dostawcą usług, co najmniej za trzy pełne okresy płatności
    pomimo uprzedzenia go na piśmie o zamiarze wypowiedzenia stosunku prawnego i wyznaczenia dodatkowego, miesięcznego terminu do zapłaty zaległych
    i bieżących należności, lub
- p: 90
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: wynajął, podnajął albo oddał do bezpłatnego używania lokal lub jego część bez wymaganej pisemnej zgody właściciela, lub
- p: 91
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: używa lokalu, który wymaga opróżnienia w związku z koniecznością rozbiórki lub remontu budynku.
- p: 92
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Ponadto, właściciel lokalu może wypowiedzieć stosunek najmu z zachowaniem:'
- p: 93
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: sześciomiesięcznego terminu wypowiedzenia, z powodu niezamieszkiwania najemcy przez okres dłuższy niż 12 miesięcy;
- p: 94
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: miesięcznego terminu wypowiedzenia, na koniec miesiąca kalendarzowego, osobie, której przysługuje tytuł prawny do innego lokalu położonego
    w tej samej lub pobliskiej miejscowości, a lokator może używać tego lokalu, jeżeli lokal ten spełnia warunki przewidziane dla lokalu zamiennego.
- p: 95
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: nie później niż na pół roku naprzód, na koniec miesiąca kalendarzowego, właściciel może wypowiedzieć stosunek prawny, o ile zamierza zamieszkać
    w należącym do niego lokalu, jeżeli lokatorowi przysługuje tytuł do lokalu, w którym może zamieszkać w warunkach takich, jakby otrzymał lokal
    zamienny, lub jeżeli właściciel dostarczy mu lokal zamienny. W lokalu zamiennym wysokość czynszu i opłat, z wyjątkiem opłat niezależnych od
    właściciela, musi uwzględniać stosunek powierzchni i wyposażenia lokalu zamiennego do lokalu zwalnianego.
- p: 96
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: nie później niż na 3 lata naprzód, na koniec miesiąca kalendarzowego, właściciel może wypowiedzieć stosunek prawny lokatorowi, o ile zamierza
    zamieszkać w należącym do niego lokalu, a nie dostarcza mu lokalu zamiennego i lokatorowi nie przysługuje prawo do lokalu, o którym mowa w
    ust. 4.
- p: 97
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wypowiedzenie umowy, pod rygorem nieważności, powinno być dokonane w formie pisemnej.
- p: 98
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: "W okresie od dnia dostarczenia wypowiedzenia umowy przez którąkolwiek ze Stron do dnia, \nw którym nastąpi zwrot lokalu, Najemca jest\
    \ zobowiązany umożliwić Wynajmującemu pokazanie lokalu potencjalnym najemcom, po uprzednim ustaleniu terminu."
- p: 99
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: "Pokazywanie lokalu potencjalnym najemcom odbywać się może maksymalnie jednego dnia \nw tygodniu, w godzinach od …. do …., chyba że Strony\
    \ uzgodnią większą częstotliwość lub inny przedział czasowy."
  slots:
  - {id: p99_1, span: [111, 113], type: date, context: tygodniu w godzinach od ▢ do chyba}
  - {id: p99_2, span: [117, 119], type: date, context: w godzinach od do ▢ chyba że}
