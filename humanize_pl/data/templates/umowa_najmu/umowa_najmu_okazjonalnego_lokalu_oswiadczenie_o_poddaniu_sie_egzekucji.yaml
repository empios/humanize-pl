  text: Najemca oświadcza, iż  w związku z obowiązkiem dobrowolnego opuszczenia, opróżnienia oraz  wydania ww. lokalu mieszkalnego po rozwiązaniu
    stosunku najmu, poddaje się egzekucji w myśl art. 777 § 1 pkt 4 ustawy z dnia 17 listopada 1964 r. - Kodeks postępowania cywilnego.
