  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca poza zapłatą czynszu na rzecz Wynajmującego obowiązany będzie do regulowania bieżących opłat eksploatacyjnych, to jest:'
- p: 41
  role: body
  layout: {align: justify, indent: {left: 720}, size: 10.0}
  text: opłat za wodę, prąd i gaz na podstawie pomiarów liczników odczytywanych ………………….
  slots:
  - {id: p41_1, span: [72, 80], type: text, context: podstawie pomiarów liczników odczytywanych ▢}
- p: 42
  role: body
  layout: {align: justify, indent: {left: 720}, size: 10.0}
