  slots:
  - {id: p43_1, span: [0, 15], type: text, context: ▢}
- p: 44
  role: body
  layout: {align: justify, indent: {left: 720}, size: 10.0}
  text: 'Suma wyżej wymienionych opłat za dany miesiąc zostanie podzielona przez liczbę osób zamieszkujących lokal w danym miesiącu. Najemca jest
    zobowiązany do zapłacenia określonej części. '
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'W przedmiocie dokonywania wszelkiego rodzaju napraw zastosowanie znajdują przepisy ustawy z dnia 21 czerwca 2001 r. o ochronie praw lokatorów,
    mieszkaniowym zasobie gminy

    i o zmianie Kodeksu cywilnego (t.j. Dz.U.2023.725).'
- {p: 46, role: spacer}
- p: 47
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- {p: 48, role: spacer}
- p: 49
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Na poczet nieopłaconych należności z tytułu najmu oraz kosztów napraw obciążających Najemcę, Najemca wpłaca Wynajmującemu kaucję w wysokości
    ………. (słownie: ……………….) złotych.'
  slots:
  - {id: p49_1, span: [141, 145], type: amount, context: Wynajmującemu kaucję w wysokości ▢ złotych.}
  - {id: p49_2, span: [156, 163], type: amount, context: kaucję w wysokości słownie ▢ złotych.}
- p: 50
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Kaucja podlega zwrotowi Najemcy w terminie ....... dni po zakończeniu wykonywania umowy

    w całości w przypadku braku należności opisanych w ust. 1 na numer rachunku bankowego .........................................................
    prowadzony w banku ..........................................................'
  slots:
  - {id: p50_1, span: [43, 50], type: text, context: zwrotowi Najemcy w terminie ▢ dni po}
  - {id: p50_2, span: [174, 231], type: text, context: na numer rachunku bankowego ▢ prowadzony w}
  - {id: p50_3, span: [251, 309], type: text, context: bankowego prowadzony w banku ▢}
- {p: 51, role: spacer}
- p: 52
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- {p: 53, role: spacer}
- p: 54
  role: body
  layout: {align: justify, size: 10.0}
  text: 'Wynajmujący zobowiązany jest przedstawić Najemcy bieżące rachunki obejmujące opłaty eksploatacyjne, o których mowa w § 5 w terminie co
    najmniej 7 dni przed terminem płatności. '
- {p: 55, role: spacer}
- p: 56
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- {p: 57, role: spacer}
- p: 58
  role: body
  layout: {align: justify, size: 10.0}
  text: Najemca nie ma prawa podnajmować lub oddawać do bezpłatnego używania mieszkania ani jego części osobom trzecim bez zgody Wynajmującego.
- {p: 59, role: spacer}
- p: 60
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- {p: 61, role: spacer}
- p: 62
  role: body
  layout: {align: justify, size: 10.0}
  text: 'O nadchodzącej na nazwisko Wynajmującego korespondencji i o sprawach wymagających jego udziału Najemca poinformuje Wynajmującego w sposób
    następujący:'
- p: 63
  role: blank_line
  layout: {align: justify, size: 10.0}
  text: …………………….……………………….……………………….……………………….
  slots:
  - {id: p63_1, span: [0, 39], type: text, context: ▢}
- {p: 64, role: spacer}
- p: 65
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- {p: 66, role: spacer}
- p: 67
  role: body
  layout: {align: justify, size: 10.0}
  text: Najemca nie dokona żadnych zmian budowlanych w lokalu, chyba że wyrazi na to zgodę Wynajmujący. Nakłady poniesione przez Najemcę w celu
    trwałego ulepszenia przedmiotu najmu, dokonane po uzyskaniu wspomnianej zgody, z chwilą rozwiązania umowy, stają się własnością Wynajmującego
    bez obowiązku rozliczenia.
- {p: 68, role: spacer}
- p: 69
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- {p: 70, role: spacer}
- p: 71
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Wynajmującemu przysługuje prawo wypowiedzenia umowy najmu, jednak nie później niż na miesiąc naprzód, na koniec miesiąca kalendarzowego
    w następujących wypadkach:'
- p: 72
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: 'jeżeli Najemca pomimo pisemnego upomnienia nadal używa lokalu w sposób sprzeczny

    z umową lub niezgodnie z jego przeznaczeniem lub zaniedbuje obowiązki, dopuszczając do powstania szkód, lub niszczy urządzenia przeznaczone
    do wspólnego korzystania przez mieszkańców albo wykracza w sposób rażący lub uporczywy przeciwko porządkowi domowemu, czyniąc uciążliwym korzystanie
    z innych lokali, lub'
- p: 73
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: jeżeli Najemca jest w zwłoce z zapłatą czynszu lub innych opłat za używanie lokalu co najmniej za trzy pełne okresy płatności pomimo uprzedzenia
    go na piśmie o zamiarze wypowiedzenia najmu i wyznaczenia dodatkowego, miesięcznego terminu do zapłaty zaległych i bieżących należności, lub
- p: 74
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: jeżeli Najemca wynajął, podnajął albo oddał do bezpłatnego używania lokal lub jego część bez wymaganej zgody Wynajmującego.
- p: 75
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'W przypadku naruszeń postanowień umownych przez Najemcę, Wynajmujący zastrzega sobie prawo do żądania zapłaty kary umownej w wysokości
    .........................................(słownie: ....................................................) w ciągu 14 dni  od wezwania w związku
    z naruszeniem postanowień umowy.'
  slots:
  - {id: p75_1, span: [135, 176], type: amount, context: kary umownej w wysokości ▢ w ciągu}
  - {id: p75_2, span: [186, 238], type: amount, context: umownej w wysokości słownie ▢ w ciągu}
- p: 76
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Umowa może zostać rozwiązana w każdym czasie za zgodą obu stron.
- {p: 77, role: spacer}
- p: 78
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 12, kind: paragraph, src: manual, level: 0}}
  text: § 12
- p: 79
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Najemca zobowiązuje się do utrzymywania pokoju oraz części wspólnych lokalu w należytym stanie technicznym, użytkowym i sanitarnym, niezwłocznego
    powiadamiania Wynajmującego o powstałych awariach a w ostatnim dniu obowiązywania umowy do oddania pokoju w stanie niepogorszonym ponad normalne
    zużycie.
- p: 80
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca zna stan techniczny pokoju oraz części wspólnych i oświadcza, że w dniu podpisania niniejszej umowy nie ma zastrzeżeń do stanu
    technicznego. '
- p: 81
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Najemca ma prawo wypowiedzieć́ umowę najmu ze skutkiem natychmiastowym, jeśli mieszkanie ma wady zagrażające zdrowiu Najemcy lub jego
    domowników.
- {p: 82, role: spacer}
- p: 83
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 13, kind: paragraph, src: manual, level: 0}}
  text: § 13
- {p: 84, role: spacer}
- p: 85
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany niniejszej umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 86
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Umowę spisano w …….… jednobrzmiących egzemplarzach, po….…… dla każdej ze stron. '
  slots:
  - {id: p86_1, span: [16, 20], type: place, context: Umowę spisano w ▢ jednobrzmiących egzemplarzach}
  - {id: p86_2, span: [54, 58], type: text, context: w jednobrzmiących egzemplarzach po ▢ dla każdej}
- {p: 87, role: spacer}
- p: 88
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 14, kind: paragraph, src: manual, level: 0}}
  text: § 14
- {p: 89, role: spacer}
- p: 90
  role: field_header
  layout: {align: justify, size: 10.0}
  text: 'W sprawach nieuregulowanych w umowie będą miały zastosowanie przepisy:'
