- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący wynajmuje i oddaje w użytkowanie Najemcy jeden pokój o powierzchni …………… m2 w lokalu wymienionym w § 1, zwany dalej „pokojem”,
    a Najemca bierze przedmiotowy pokój w użytkowanie i oświadcza, że będzie go wykorzystywał na cele mieszkalne oraz zobowiązuje się płacić Wynajmującemu
    umówiony czynsz. Pokój jest wyposażony i umeblowany zgodnie z protokołem zdawczo-odbiorczym lokalu, stanowiącym załącznik nr 1 do niniejszej
    umowy.
  slots:
  - {id: p28_1, span: [79, 84], type: text, context: jeden pokój o powierzchni ▢ m2 w}
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Wraz z pokojem Wynajmujący oddaje Najemcy do współkorzystania z innymi lokatorami części wspólne lokalu (kuchnia, łazienka, przedpokój,……….)
    oraz urządzenia, takie jak …………………… . '
  slots:
  - {id: p29_1, span: [135, 139], type: text, context: lokalu kuchnia łazienka przedpokój ▢ oraz urządzenia}
  - {id: p29_2, span: [168, 176], type: text, context: oraz urządzenia takie jak ▢}
