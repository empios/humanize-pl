  text: § 4
- p: 28
  role: body
  layout: {align: justify, indent: {right: -6}, size: 10.0}
  text: "Wynajmujący oddaje Najemcy powierzchnię do użytku na zasadach określonych \nw niniejszej Umowie. Najemca ma prawo prowadzenia w lokalu\
    \ działalności gospodarczej (w tym wskazania go jako siedziby). Wszelkie zmiany sposobu użytkowania powierzchni wymagają pisemnej zgody Wynajmującego."
- {p: 29, role: spacer}
- p: 30
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Czynsz najmu wynosi za jeden miesiąc …… zł (słownie: ……………. złotych) za każdy metr kwadratowy wynajmowanej ogrzewanej powierzchni, o
    której mowa w § 3, tj. ……… zł (słownie: …………… złotych) miesięcznie/rocznie.'
  slots:
  - {id: p31_1, span: [37, 39], type: text, context: wynosi za jeden miesiąc ▢ zł za}
  - {id: p31_2, span: [53, 59], type: amount, context: jeden miesiąc zł słownie ▢ złotych za}
  - {id: p31_3, span: [156, 159], type: text, context: w § 3 tj. ▢ zł miesięcznie}
  - {id: p31_4, span: [173, 178], type: amount, context: 3 tj. zł słownie ▢ złotych miesięcznie}
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: "Do wartości określonej w ust. 1 niniejszego paragrafu będzie doliczony podatek VAT \nw obowiązującej wysokości."
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 75, end: 97, italic: true}]}
  text: 'Najemca płacić będzie Wynajmującemu czynsz najmu w wysokości ………………………….. (należy wpisać stawkę) (słownie: …………………. złotych) miesięcznie.'
  slots:
  - {id: nalezy_wpisac_stawke, span: [61, 73], type: amount, hint: należy wpisać stawkę}
  - {id: p33_2, span: [107, 115], type: amount, context: najmu w wysokości słownie ▢ złotych miesięcznie.}
  inline_hints:
  - {span: [74, 96], text: należy wpisać stawkę}
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 134, end: 150, italic: true}]}
  text: Czynsz płatny będzie w terminie do 14 dni od daty wystawienia faktury, na rachunek bankowy Wynajmującego o numerze ……………………………….………..
    (numer rachunku).
  slots:
  - {id: numer_rachunku, span: [115, 133], type: text, hint: numer rachunku}
  inline_hints:
  - {span: [134, 150], text: numer rachunku}
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Za dzień zapłaty należy uznać datę zaksięgowania środków na rachunku bankowym Wynajmującego.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: '[opcjonalnie] Czynsz najmu będzie płatny z góry do 31 stycznia danego roku kalendarzowego za dany rok, przelewem na rachunek Wynajmującego,
    nie wcześniej jednak niż 5 dni po dostarczeniu faktury Najemcy.'
- {p: 37, role: spacer}
- p: 38
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 39
  role: body
  layout: {align: justify, size: 10.0}
  text: Jeżeli najemca dopuszcza się zwłoki z zapłatą czynszu, co najmniej za dwa pełne okresy płatności, Wynajmujący może wypowiedzieć umowę
    najmu bez zachowania terminów wypowiedzenia.
- {p: 40, role: spacer}
