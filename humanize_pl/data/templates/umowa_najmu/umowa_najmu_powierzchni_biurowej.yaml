  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Każdej ze stron przysługuje prawo wypowiedzenia niniejszej Umowy z zachowaniem jednomiesięcznego okresu wypowiedzenia.
