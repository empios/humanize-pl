- p: 18
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Wynajmujący oświadcza, że posiada prawo do dysponowania miejscem określonym w ust. 1. '
- p: 19
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący oświadcza, że przedmiot najmu jest wolny od obciążeń na rzecz osób trzecich, które mogłyby utrudnić lub uniemożliwić wykonywanie
    uprawnień Najemcy wynikających z niniejszej umowy.
- p: 20
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 21
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Wydanie przedmiotu umowy
- {p: 22, role: spacer}
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 240, end: 249, bold: true}, {
        start: 250, end: 254, bold: true}]}
  text: Wynajmujący zobowiązuje się wydać Najemcy przedmiot umowy opisany w § 1 ust. 1 Umowy nie później niż w ciągu ........... dni kalendarzowych
    od daty zawarcia niniejszej umowy, na podstawie protokołu zdawczo-odbiorczego, którego wzór stanowi Załącznik nr 1 do niniejszej Umowy.
  slots:
  - {id: p23_1, span: [109, 120], type: text, context: później niż w ciągu ▢ dni kalendarzowych}
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca zobowiązuje się zwrócić Wynajmującemu przedmiot umowy opisany w § 1 ust. 1 Umowy nie później niż w ciągu ........... dni kalendarzowych
    od daty wygaśnięcia lub rozwiązania niniejszej umowy z jakiegokolwiek powodu. '
  slots:
  - {id: p24_1, span: [113, 124], type: text, context: później niż w ciągu ▢ dni kalendarzowych}
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 132, end: 141, bold: true}, {
        start: 142, end: 146, bold: true}]}
  text: Wydanie przedmiotu umowy i jego zwrot po zakończeniu najmu zostaną potwierdzone protokołem zdawczo-odbiorczym, którego wzór stanowi Załącznik
    nr 1 do niniejszej Umowy.
- {p: 26, role: spacer}
- {p: 27, role: spacer}
- p: 28
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 29
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Sposób używania
- {p: 30, role: spacer}
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Najemca zobowiązuje się do korzystania z przedmiotu umowy na cele reklamowe, zgodnie z jego przeznaczeniem.
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Oddanie przedmiotu umowy do używania osobie trzeciej lub innemu podmiotowi w jakiejkolwiek formie i w jakimkolwiek celu możliwe jest jedynie
    za zgodą wynajmującego wyrażoną w formie pisemnej.
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Najemca zobowiązuje się do utrzymania należytego stanu technicznego i estetycznego powierzchni oraz zobowiązuje się chronić przedmiot
    umowy przed pogorszeniem jego stanu, uszkodzeniem lub zniszczeniem.
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący może w każdym czasie przeprowadzić kontrolę stanu technicznego przedmiotu umowy. Najemca jest zobowiązany do niezwłocznie
    udostępnienia powierzchni reklamowej w celu usunięcia przez Wynajmującego lub odpowiednie służby awarii mogącej wywołać szkodę.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Najemca zobowiązuje się wykorzystywać przedmiot umowy zgodnie z umową, w tym z jego przeznaczeniem i właściwościami, oraz zasadami prawidłowej
    gospodarki, a w szczególności utrzymywać przedmiot umowy w niepogorszonym stanie ponad jego zużycie będące następstwem prawidłowego używania.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: Najemca jest zobowiązany udostępnić Udostępnić powierzchnię Wynajmującemu w celu wykonania prac i remontów obciążających Wynajmującego,
    a także zastępczego wykonania przez Wynajmującego prac obciążających Najemcę.
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}}
  text: 'Najemca zobowiązuje się do niezwłocznego informowania Wynajmującego o każdym przypadku pogorszenia stanu przedmiotu umowy, jego awarii,
    uszkodzeniu, zniszczeniu lub utracie drogą telefoniczną na nr ………………………… (wskazać nr telefonu) lub mailową: ………………………… (wskazać adres mailowy).'
  slots:
  - {id: wskazac_nr_telefonu, span: [198, 208], type: text, hint: wskazać nr telefonu}
  - {id: wskazac_adres_mailowy, span: [244, 254], type: address, hint: wskazać adres mailowy}
  inline_hints:
  - {span: [209, 230], text: wskazać nr telefonu}
  - {span: [255, 278], text: wskazać adres mailowy}
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}}
  text: Najemca nie może dokonywać w przedmiocie umowy zmian ani ulepszeń bez uprzedniej zgody Wynajmującego wyrażonej na piśmie.
- {p: 39, role: spacer}
- p: 40
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 41
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Odpowiedzialność
- {p: 42, role: spacer}
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 41, end: 43, bold: true}]}
  text: Z chwilą wydania przedmiotu umowy Najemcy, ponosi on pełną odpowiedzialność za jego stan techniczny jak i za ewentualne uszkodzenia przedmiotu
    umowy zaistniałe z jego winy.
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Najemca jest odpowiedzialny za szkody wynikające z używania przedmiotu umowy w sposób sprzeczny z umową albo z jego właściwościami lub
    z przeznaczeniem.
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Po zakończeniu trwania niniejszej umowy Najemca obowiązany jest zwrócić Wynajmującemu przedmiot umowy w stanie niepogorszonym; jednakże
    Najemca nie ponosi odpowiedzialności za zużycie przedmiotu umowy będące następstwem prawidłowego, normalnego używania.
- {p: 46, role: spacer}
- p: 47
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 48
