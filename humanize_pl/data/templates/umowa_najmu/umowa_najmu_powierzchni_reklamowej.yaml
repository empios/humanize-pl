    rachunku bankowego. '
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie koszty bieżące użytkowania przedmiotu umowy w czasie trwania niniejszej umowy będzie ponosił Najemca.
- {p: 59, role: spacer}
