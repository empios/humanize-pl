- p: 93
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W przypadku, gdy po usunięciu z powierzchni reklamowej  urządzeń, o których mowa w § 9 ust. 1, przez Najemcę, na powierzchni pozostaną
    rzeczy wniesione przez Najemcę, Wynajmujący ma prawo przenieść je w inne miejsce na koszt i ryzyko Najemcy.
- p: 94
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli Najemca nie wyda powierzchni reklamowej w terminie określonym w § 9 ust. 1, obowiązany będzie uiszczać na rzecz Wynajmującego odszkodowanie
    odpowiadające wysokości czynszu, jaki właściciel mógłby otrzymać z tytułu najmu powierzchni reklamowej. Jeżeli odszkodowanie nie pokrywa poniesionych
    strat, Wynajmujący może żądać od Najemcy odszkodowania uzupełniającego.
- p: 95
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli po wygaśnięciu lub rozwiązaniu niniejszej Umowy Najemca dobrowolnie nie usunął urządzeń, o których mowa w § 9 ust. 1, Wynajmujący
    doręczy Najemcy żądanie usunięcia tych urządzeń, sporządzone na piśmie, ze wskazaniem dodatkowego terminu na ich usunięcie.
