  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Najem przedmiotu umowy rozpoczyna się w dniu protokolarnego jego wydania Najemcy i trwa do dnia jego protokolarnego zwrotu Wynajmującemu. '
- {p: 52, role: spacer}
