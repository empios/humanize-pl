- p: 68
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wynajmujący zwróci Najemcy kaucję w terminie miesiąca od dnia wydania mu przez Najemcę powierzchni reklamowej, po uprzednim rozliczeniu
    przysługujących mu należności lub kosztów określonych w § 7 ust. 1.
- p: 69
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: W przypadku zalegania przez Najemcę z należnościami w trakcie trwania Umowy, Wynajmujący ma prawo zaliczyć część kaucji odpowiadającą
    wartości zaległości na wymagalne należności. O dokonaniu zaliczenia Wynajmujący zawiadomi Najemcę w terminie ........ dni od dokonania operacji.
    Zawiadomienie powinno być dokonane w formie pisemnej.
  slots:
  - {id: p69_1, span: [243, 251], type: text, context: zawiadomi Najemcę w terminie ▢ dni od}
- p: 70
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: W sytuacji określonej w § 7 ust. 4 Najemca zobowiązany jest do uzupełnienia kaucji do wysokości określonej w § 7 ust. 1 Umowy w terminie
    ....... dni od otrzymania zawiadomienia.
  slots:
