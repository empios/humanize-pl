- {p: 16, role: spacer}
- p: 17
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 37, end: 50, bold: true}, {start: 51,
        end: 58, bold: true}, {start: 121, end: 168, italic: true}, {start: 181, end: 198, bold: true}]}
  text: Przedmiotem umowy jest oddanie przez Wynajmującego Najemcy do używania w zamian za umówiony czynsz ……………………………………………………. (należy wskazać
    rzecz będącą przedmiotem umowy) zwany dalej przedmiotem umowy.
  slots:
  - {id: nalezy_wskazac_rzecz_bedaca_przedmiotem_umowy, span: [99, 120], type: text, hint: należy wskazać rzecz będącą przedmiotem umowy}
  inline_hints:
  - {span: [121, 168], text: należy wskazać rzecz będącą przedmiotem umowy}
- p: 18
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}]}
  text: Wynajmujący oświadcza, że jest jedynym właścicielem ww. przedmiotu umowy, a także że jest on sprawny i zdatny do użytku.
- p: 19
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: "Najemca oświadcza, że został poinformowany o sposobie użytkowania przedmiotu umowy \ni zobowiązuje się do korzystania z przedmiotu umowy\
    \ zgodnie z jego przeznaczeniem. "
- {p: 20, role: spacer}
- p: 21
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 22
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Wydanie przedmiotu umowy
- {p: 23, role: spacer}
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}, {start: 34,
        end: 42, bold: true}, {start: 240, end: 249, bold: true}, {start: 250, end: 254, bold: true}]}
  text: Wynajmujący zobowiązuje się wydać Najemcy przedmiot umowy opisany w § 1 ust. 1 Umowy nie później niż w ciągu ........... dni kalendarzowych
    od daty zawarcia niniejszej umowy, na podstawie protokołu zdawczo-odbiorczego, którego wzór stanowi Załącznik nr 1 do niniejszej Umowy.
  slots:
  - {id: p24_1, span: [109, 120], type: text, context: później niż w ciągu ▢ dni kalendarzowych}
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 8, bold: true}, {start: 32,
        end: 45, bold: true}]}
  text: 'Najemca zobowiązuje się zwrócić Wynajmującemu przedmiot umowy opisany w § 1 ust. 1 Umowy nie później niż w ciągu ........... dni kalendarzowych
    od daty wygaśnięcia lub rozwiązania niniejszej umowy z jakiegokolwiek powodu. '
  slots:
  - {id: p25_1, span: [113, 124], type: text, context: później niż w ciągu ▢ dni kalendarzowych}
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 132, end: 141, bold: true}, {
        start: 142, end: 146, bold: true}]}
  text: Wydanie przedmiotu umowy i jego zwrot po zakończeniu najmu zostaną potwierdzone protokołem zdawczo-odbiorczym, którego wzór stanowi Załącznik
    nr 1 do niniejszej Umowy.
- {p: 27, role: spacer}
- p: 28
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 29
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Sposób używania
- {p: 30, role: spacer}
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: Najemca zobowiązuje się do używania przedmiotu umowy zgodnie z jego przeznaczeniem.
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: Najemca zobowiązuje się do osobistego korzystania z przedmiotu umowy. Oddanie przedmiotu umowy do używania osobie trzeciej w jakiejkolwiek
    formie i w jakimkolwiek celu możliwe jest jedynie za zgodą wynajmującego wyrażoną w formie pisemnej.
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: Najemca zobowiązuje się do przechowywania przedmiotu umowy w sposób zabezpieczający jego integralność oraz zobowiązuje się chronić go
    przed pogorszeniem jego stanu, uszkodzeniem, zniszczeniem oraz przed dostępem osób trzecich.
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}, {start: 72,
        end: 85, bold: true}, {start: 122, end: 133, bold: true}]}
  text: Najemca zobowiązuje się do okazania przedmiotu umowy  na każde wezwanie Wynajmującego w terminie przez niego wyznaczonym. Wynajmujący
    może w każdym czasie przeprowadzić kontrolę stanu technicznego przedmiotu umowy.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 8, bold: true}]}
  text: Najemca zobowiązuje się wykorzystywać przedmiot umowy zgodnie z umową, w tym z jego przeznaczeniem i właściwościami, oraz zasadami prawidłowej
    gospodarki, a w szczególności utrzymywać przedmiot umowy w niepogorszonym stanie ponad jego zużycie będące następstwem prawidłowego używania,
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}, {start: 54,
        end: 68, bold: true}, {start: 209, end: 230, italic: true}, {start: 255, end: 278, italic: true}]}
  text: 'Najemca zobowiązuje się do niezwłocznego informowania Wynajmującego o każdym przypadku pogorszenia stanu przedmiotu umowy, jego awarii,
    uszkodzeniu, zniszczeniu lub utracie drogą telefoniczną na nr ………………………… (wskazać nr telefonu) lub mailową: ………………………… (wskazać adres mailowy).'
  slots:
  - {id: wskazac_nr_telefonu, span: [198, 208], type: text, hint: wskazać nr telefonu}
  - {id: wskazac_adres_mailowy, span: [244, 254], type: address, hint: wskazać adres mailowy}
  inline_hints:
  - {span: [209, 230], text: wskazać nr telefonu}
  - {span: [255, 278], text: wskazać adres mailowy}
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: Najemca nie może dokonywać w przedmiocie umowy zmian ani ulepszeń bez uprzedniej zgody Wynajmującego wyrażonej na piśmie.
- {p: 38, role: spacer}
- p: 39
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 40
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Odpowiedzialność
- {p: 41, role: spacer}
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 33, end: 43, bold: true}]}
  text: Z chwilą wydania przedmiotu umowy Najemcy, ponosi on pełną odpowiedzialność za jego stan techniczny jak i za ewentualne uszkodzenia przedmiotu
    umowy zaistniałe z jego winy.
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: Najemca jest odpowiedzialny za szkody wynikające z używania przedmiotu umowy w sposób sprzeczny z umową albo z jego właściwościami lub
    z przeznaczeniem.
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 40, end: 48, bold: true}, {start: 72,
        end: 85, bold: true}, {start: 136, end: 143, bold: true}]}
  text: Po zakończeniu trwania niniejszej umowy Najemca obowiązany jest zwrócić Wynajmującemu przedmiot umowy w stanie niepogorszonym; jednakże
    Najemca nie ponosi odpowiedzialności za zużycie przedmiotu umowy będące następstwem prawidłowego, normalnego używania.
- {p: 45, role: spacer}
