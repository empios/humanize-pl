- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 22, end: 42, bold: true}]}
  text: 'Licencja ma charakter niewyłączny/wyłączny i uprawnia do korzystania z Utworu przez Licencjobiorcę bez ograniczeń terytorialnych. '
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 59, end: 82, bold: true}]}
  text: Licencja na korzystanie z Utworu zostaje udzielona na czas oznaczony/nieoznaczony.
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: Licencjobiorca nie ma prawa ingerowania w treść Utworu, oraz nie ma prawa do tworzenia utworów zależnych.
