- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Umowę może wypowiedzieć każda ze stron z zachowaniem …………… okresu wypowiedzenia ze skutkiem na koniec miesiąca kalendarzowego.
  slots:
  - {id: p57_1, span: [53, 58], type: text, context: ze stron z zachowaniem ▢ okresu wypowiedzenia}
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Licencjodawca ma prawo do rozwiązania niniejszej umowy bez zachowania okresu wypowiedzenia, w razie użytkowania Utworu przekraczającego
    zakres udzielonej licencji przez Licencjobiorcę.
- {p: 59, role: spacer}
- p: 60
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7., kind: paragraph, src: manual, level: 0}}
  text: § 7.
- {p: 61, role: spacer}
- p: 62
  role: body
  layout: {align: justify, size: 10.0}
  text: "W wypadku podniesienia roszczeń przez osoby trzecie przeciwko Licencjobiorcy na drodze procesu \no naruszenie praw autorskich do Utworu\
    \ lub praw do wizerunku w związku z korzystaniem przez Licencjobiorcę z Utworu zgodnie z postanowieniami niniejszej Umowy, Licencjodawca zobowiązany\
    \ będzie niezwłocznie wstąpić do sprawy po stronie pozwanego (Licencjobiorcy), zwolnić Licencjobiorcę \nz obowiązku zaspokojenia wszelkich\
    \ roszczeń, zaspokoić wszelkie uznane lub prawomocnie zasądzone roszczenia powoda wraz z kosztami ewentualnego procesu lub negocjacji ugodowych. "
- {p: 63, role: spacer}
- p: 64
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8., kind: paragraph, src: manual, level: 0}}
  text: § 8.
- {p: 65, role: spacer}
- p: 66
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany niniejszej umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 67
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: "W sprawach nieuregulowanych niniejszą umową zastosowanie mają przepisy ustawy z dnia \n4 lutego 1994 r. o prawie autorskim i prawach\
    \ pokrewnych oraz ustawy z dnia 23 kwietnia 1964 r. – Kodeks cywilny."
- p: 68
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Ewentualne spory powstałe na tle obowiązywania niniejszej umowy będą rozstrzygane przez sąd powszechny właściwy miejscowo ze względu na
    siedzibę Licencjodawcy/Licencjobiorcy.
- p: 69
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Niniejsza umowa została sporządzona w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze Stron.
