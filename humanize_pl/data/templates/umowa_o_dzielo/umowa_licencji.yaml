- {p: 25, role: spacer}
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 183, end: 312, italic: true}]}
  text: "Przedmiotem niniejszej umowy jest upoważnienie do korzystania z utworu w rozumieniu ustawy \nz dnia 4 lutego 1994 r. o prawie autorskim\
    \ i prawach pokrewnych, który stanowi …………………………… (w tym miejscu należy wskazać co jest przedmiotem licencji np. artykuł, film, wraz z jego\
    \ określeniem np. tytuł i data powstania), w dalszej części umowy zwanym Utworem, który zostanie wykorzystany przez Licencjobiorcę na polach\
    \ eksploatacji, z określeniem zakresu, miejsca i czasu tego korzystania. "
  slots:
  - {id: w_tym_miejscu_nalezy_wskazac_co_jest_przedmiotem, span: [171, 182], type: text, hint: 'w tym miejscu należy wskazać co jest przedmiotem
      licencji np. artykuł, film, wraz z jego określeniem np. tytuł i data powstania'}
  inline_hints:
  - {span: [183, 312], text: 'w tym miejscu należy wskazać co jest przedmiotem licencji np. artykuł, film, wraz z jego określeniem np. tytuł i
      data powstania'}
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Autorem Utworu jest Licencjodawca.
- {p: 28, role: spacer}
- p: 29
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2., kind: paragraph, src: manual, level: 0}}
  text: § 2.
- {p: 30, role: spacer}
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Licencjodawca oświadcza, że jest wyłącznym właścicielem praw autorskich majątkowych do Utworu i że nie występują przeszkody prawne do
    zawarcia przez niego niniejszej umowy.
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Licencjodawca oświadcza, że korzystanie z Utworu przez Licencjobiorcę nie będzie naruszać praw osób trzecich.
- {p: 33, role: spacer}
- p: 34
