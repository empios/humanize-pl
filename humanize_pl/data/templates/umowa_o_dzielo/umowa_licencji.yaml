- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: '[opcjonalnie w przypadku wersji odpłatnej] Tytułem wynagrodzenia za korzystanie z Utworu zgodnie z postanowieniami niniejszej umowy Licencjobiorca
    uiści na rzecz Licencjodawcy kwotę

    w wysokości ………………………………… zł, słownie: ( ……………………………… złotych).'
  slots:
  - {id: p52_1, span: [194, 207], type: amount, context: Licencjodawcy kwotę w wysokości ▢ zł słownie}
  - {id: p52_2, span: [223, 235], type: amount, context: w wysokości zł słownie ▢ złotych}
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Wynagrodzenie zostanie przekazane Licencjodawcy przelewem bankowym  w terminie ………… dni  od podpisania niniejszej umowy, na rachunek
    bankowy Licencjodawcy o numerze: …………………… .'
  slots:
  - {id: p53_1, span: [79, 83], type: text, context: przelewem bankowym w terminie ▢ dni od}
  - {id: p53_2, span: [166, 174], type: text, context: bankowy Licencjodawcy o numerze ▢}
