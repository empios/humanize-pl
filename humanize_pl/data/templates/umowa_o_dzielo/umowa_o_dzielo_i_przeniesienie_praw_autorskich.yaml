- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zamawiający zobowiązuje się do współdziałania z Przyjmującym zamówienie, w szczególności do przekazania informacji niezbędnych do prawidłowego
    wykonania dzieła.
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Wykonawca nie może powierzyć wykonania dzieła innej osobie bez zgody Zamawiającego wyrażonej na piśmie pod rygorem nieważności.
- {p: 27, role: spacer}
