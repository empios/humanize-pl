  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- {p: 34, role: spacer}
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Dzieło stanowi utwór w rozumieniu art. 1 ust. 1 ustawy z dnia 4 lutego 1994 r. o prawie autorskim i prawach pokrewnych, a Wykonawca jest
    autorem przedmiotowego dzieła.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Przeniesienie autorskich praw majątkowych do dzieła przez Wykonawcę na rzecz Zamawiającego nastąpi wraz z chwilą przekazania dzieła.
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wykonawca oświadcza, że dzieło zostanie przez niego wykonane osobiście, nie będzie stanowiło opracowania cudzego dzieła, a tym samym będą
    mu przysługiwały do niego pełne prawa majątkowe, którymi będzie mógł rozporządzać w zakresie niezbędnym wykonywania niniejszej umowy.
- {p: 38, role: spacer}
- p: 39
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- {p: 40, role: spacer}
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Przeniesienie autorskich praw majątkowych do utworu przez Wykonawcę na rzecz Zamawiającego nastąpi w całości i bez żadnych ograniczeń,
    wraz z nośnikami na których jest utrwalony, w zakresie wszystkich pól eksploatacji, którymi dysponuje Wykonawca, obejmujących prawa:'
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: 'wyłącznego używania i wykorzystania dzieła we wszelkiej działalności promocyjnej, reklamowej i informacyjnej prowadzonej przez Zamawiającego
    i podmiotów przez niego wskazanych, '
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: 'utrwalania i zwielokrotniania wszelkimi technikami, a w szczególności: graficznymi, fotograficznymi, drukarskimi, plastycznymi, informatycznymi,
    wizualnymi, multimedialnymi, audiowizualnymi, cyfrowymi, informatycznymi,'
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: 'zwielokrotniania poprzez dokonywanie zapisu na nośnikach elektronicznych, '
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
  text: 'publicznego wystawiania, odtwarzania i wyświetlania na wszelkich imprezach, spotkaniach i konferencjach realizowanych przez Zamawiającego
    i podmioty działające na jego rzecz, '
- p: 46
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
  text: odtwarzania, nadawania i reemitowania za pomocą wizji wszelkimi technikami odtworzeń, nadań i remisji,
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 6), kind: decimal, src: auto, level: 0}}
  text: 'wprowadzania do obrotu, wydawania i rozpowszechniania wszelkich materiałów promocyjnych, informacyjnych, wydawniczych i innych z wykorzystaniem
    logo, '
- p: 48
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 7), kind: decimal, src: auto, level: 0}}
  text: wprowadzania do pamięci komputera i rozpowszechniania dzieła w Internecie, rozpowszechniania we wszelakiego rodzaju sieciach informatycznych,
    teleinformatycznych, telekomunikacyjnych, a także wszelkie publiczne udostępnianie w taki sposób, aby każdy mógł mieć do niego dostęp w miejscu
    i w czasie przez siebie wybranym,
- p: 49
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 8), kind: decimal, src: auto, level: 0}}
  text: do nieograniczonego w czasie korzystania i rozporządzania w kraju i za granicą.
- p: 50
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wykonawca zobowiązuje się również przenieść na Zamawiającego w całości i bez żadnych  ograniczeń autorskie prawa majątkowe do utworu w
    zakresie pól eksploatacji powstałych w przyszłości.
- p: 51
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Od chwili przeniesienia autorskich praw majątkowych na Zamawiającego, Zamawiający ma/nie ma prawa do dalszej odsprzedaży autorskich praw
    majątkowych do utworu.
- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Wraz z przeniesieniem autorskich praw majątkowych, Wykonawca przenosi na Zamawiającego wyłączne prawo do wykonywania i do zezwalania na
    wykonywanie autorskich praw zależnych.
- {p: 53, role: spacer}
- p: 54
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- {p: 55, role: spacer}
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 221, end: 245, italic: true},
      {start: 296, end: 315, italic: true}, {start: 382, end: 409, italic: true}, {start: 466, end: 480, italic: true}]}
  text: 'Z tytułu zbycia majątkowych praw autorskich do utworu, a także z tytułu pokrycia kosztów utrwalania i przekazania dzieła na odpowiednich
    nośnikach, Wykonawcy należy się jednorazowe wynagrodzenie w wysokości ………………………… zł (wysokość wynagrodzenia) (słownie: ………… złotych) płatne
    do dnia ………………………… (termin płatności) Wykonawcy nr ..................................................... (numer rachunku bankowego) prowadzony
    w banku ..................................... (nazwa banku).'
  slots:
  - {id: p56_1, span: [207, 217], type: amount, context: jednorazowe wynagrodzenie w wysokości ▢ zł płatne}
  - {id: p56_2, span: [256, 260], type: amount, context: w wysokości zł słownie ▢ złotych płatne}
  - {id: termin_platnosci, span: [285, 295], type: date, hint: termin płatności}
  - {id: numer_rachunku_bankowego_2, span: [328, 381], type: text, hint: numer rachunku bankowego}
  - {id: nazwa_banku_2, span: [428, 465], type: text, hint: nazwa banku}
  inline_hints:
  - {span: [296, 314], text: termin płatności}
  - {span: [382, 408], text: numer rachunku bankowego}
  - {span: [466, 479], text: nazwa banku}
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wykonawca zobowiązuje się do niedochodzenia dodatkowego wynagrodzenia, w przypadku pojawienia się innego niż określone w § 5 ust. 1 niniejszej
    umowy pola eksploatacji.
- {p: 58, role: spacer}
- p: 59
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- {p: 60, role: spacer}
- p: 61
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 205, end: 220, italic: true}]}
  text: 'W przypadku niewywiązania się Wykonawcy z niniejszej umowy, w szczególności niedochowania terminu, o którym mowa w § 2 ust. 1, Wykonawca
    zobowiązany będzie do zapłacenia kary umownej w wysokości ……………… zł (wysokość kary) (słownie: ……………………………………………… złotych) za każdy dzień opóźnienia.'
  slots:
  - {id: p61_1, span: [195, 201], type: amount, context: kary umownej w wysokości ▢ zł za}
  - {id: p61_2, span: [231, 249], type: amount, context: w wysokości zł słownie ▢ złotych za}
- p: 62
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Wykonawca odpowiada za wady dzieła na zasadach określonych w art. 638 § 1 ustawy z dnia

    23 kwietnia 1964 r. - Kodeks cywilny.'
- {p: 63, role: spacer}
- p: 64
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- {p: 65, role: spacer}
- p: 66
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'W kwestiach nieuregulowanych niniejszą umową zastosowanie mają przepisy ustawy z dnia 4 lutego 1994 r. o prawie autorskim i prawach pokrewnych
    oraz ustawy z dnia

    23 kwietnia 1964 r. - Kodeks cywilny.'
- p: 67
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany treści umowy i jej uzupełniania powinny być wprowadzone w formie pisemnej jako aneks do niniejszej umowy, pod rygorem
    nieważności.
- p: 68
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: W przypadku sporów wynikających z treści niniejszej umowy, właściwy będzie sąd dla miejsca zamieszkania Zamawiającego.
- p: 69
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Umowę sporządzono w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron.
