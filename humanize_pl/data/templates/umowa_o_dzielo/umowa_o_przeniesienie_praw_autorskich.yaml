- p: 19
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 191, end: 325, italic: true},
      {start: 353, end: 422, italic: true}, {start: 434, end: 441, bold: true}]}
  text: Autor oświadcza, iż w myśl przepisów ustawy z dnia 4 lutego 1994 r. o prawie autorskim i prawach pokrewnych jest posiadaczem autorskich
    praw majątkowych do utworu, których twórcą jest ……………… (należy wskazać osobę/podmiot będących twórcą dzieła – jeżeli nie jest to osoba przenosząca
    prawa majątkowe z tytułu niniejszej umowy). Utwór stanowi …………………………… (miejsce na określenie utworu będącego przedmiotem niniejszej umowy)
    zwany dalej Utworem.
  slots:
  - {id: nalezy_wskazac_osobe_podmiot_bedacych_tworca_dzi, span: [184, 190], type: text, hint: należy wskazać osobę/podmiot będących twórcą dzieła
      – jeżeli nie jest to osoba przenosząca prawa majątkowe z tytułu niniejszej umowy}
  - {id: miejsce_na_okreslenie_utworu_bedacego_przedmiote, span: [341, 352], type: text, hint: miejsce na określenie utworu będącego przedmiotem
      niniejszej umowy}
  inline_hints:
  - {span: [191, 325], text: należy wskazać osobę/podmiot będących twórcą dzieła – jeżeli nie jest to osoba przenosząca prawa majątkowe z tytułu
      niniejszej umowy}
  - {span: [353, 421], text: miejsce na określenie utworu będącego przedmiotem niniejszej umowy}
  optional: true
  condition: należy wskazać osobę/podmiot będących twórcą dzieła – jeżeli nie jest to osoba przenosząca prawa majątkowe z tytułu niniejszej umowy
- p: 20
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Autor oświadcza, że Utwór został przez niego wykonany osobiście, nie stanowi opracowania cudzego dzieła '
- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Autor oświadcza, że przysługują mu prawa majątkowe do Utworu, a także, że przed zawarciem niniejszej umowy mógł rozporządzać prawami autorskimi
    do Utworu.
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Autor oświadcza, że przysługujące jemu majątkowe prawa autorskie do Utworu nie zostały zajęte w rozumieniu przepisów o postępowaniu egzekucyjnym.
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Autor oświadcza, że Utwór, do którego prawa są przenoszone niniejszą umową, nie jest obciążony żadnymi roszczeniami i prawami osoby trzeciej.
- p: 24
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Autor przenosi na Nabywcę autorskie prawa majątkowe bez ograniczeń terytorialnych ani czasowych na następujących polach eksploatacji: '
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: '………………………………………………………………………………………………………………………………

    (należy wymienić wszystkie pola eksploatacji – np. wyłączne używanie i wykorzystanie dzieła we wszelkiej działalności promocyjnej, reklamowej
    i informacyjnej prowadzonej przez Nabywcę i podmiotów przez niego wskazanych)'
  slots:
  - {id: nalezy_wymienic_wszystkie_pola_eksploatacji_np_w, span: [0, 48], type: text, hint: 'należy wymienić wszystkie pola eksploatacji – np.
      wyłączne używanie i wykorzystanie dzieła we wszelkiej działalności promocyjnej, reklamowej i informacyjnej prowadzonej przez Nabywcę i podmiotów
      przez niego wskazanych'}
  inline_hints:
  - {span: [49, 268], text: 'należy wymienić wszystkie pola eksploatacji – np. wyłączne używanie i wykorzystanie dzieła we wszelkiej działalności
      promocyjnej, reklamowej i informacyjnej prowadzonej przez Nabywcę i podmiotów przez niego wskazanych'}
