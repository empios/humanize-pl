- p: 9
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Pracownik zobowiązuje się do podnoszenia swoich kwalifikacji zawodowych, za zgodą Pracodawcy.
- p: 10
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 269, end: 486, italic: true}]}
  text: W tym celu Pracownik od dnia ........................... r. rozpocznie naukę w ramach studiów podyplomowych na uczelni ......................................
    na Wydziale ..........................................., na kierunku ......................................... (przykładowo podwyższanie kwalifikacji
    może odbywać się w ramach podjętych studiów na uczelni wyższej, niemniej podwyższanie kwalifikacji pracowniczych może odbywać się poprzez
    np. odbycie kilkumiesięcznego szkolenia)
  slots:
  - {id: p10_1, span: [29, 56], type: date, context: celu Pracownik od dnia ▢ r. rozpocznie}
  - {id: p10_2, span: [119, 157], type: text, context: studiów podyplomowych na uczelni ▢ na Wydziale}
  - {id: p10_3, span: [170, 213], type: text, context: na uczelni na Wydziale ▢ na kierunku}
  - {id: przykladowo_podwyzszanie_kwalifikacji_moze_odbyw, span: [227, 268], type: text, hint: 'przykładowo podwyższanie kwalifikacji może odbywać
