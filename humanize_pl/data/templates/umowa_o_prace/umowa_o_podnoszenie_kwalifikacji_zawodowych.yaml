  text: § 2
- p: 18
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Pracodawca zobowiązuje się do udzielenia Pracownikowi następujących świadczeń:'
- p: 19
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 32, end: 156, italic: true}]}
  text: 'urlopu szkoleniowego w wymiarze (minimalnie pracownikowi przysługiwać może 21 dni urlopu szkoleniowego, niemniej pracodawca może przyznać
    więcej dni urlopu) dni na przystąpienie do egzaminów(u): potwierdzającego kwalifikacje zawodowe, na przygotowanie pracy dyplomowej i przystąpienie
    do egzaminu dyplomowego/6 dni na przystąpienie do egzaminu eksternistycznego/6 dni na przystąpienie do egzaminu maturalnego/6 dni na przystąpienie
    do egzaminu potwierdzającego kwalifikacje zawodowe w zawodzie lub egzaminu zawodowego,'
- p: 20
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: zwolnienia z całości/z części dnia pracy, na czas umożliwiający punktualne przybycie na obowiązkowe zajęcia oraz na czas ich trwania,
- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: za czas urlopu szkoleniowego (o którym mowa w pkt a) oraz za czas zwolnienia z całości/części dnia pracy (o którym mowa w pkt b) pracownik
    zachowuje prawo do wynagrodzenia za pracę,
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: urlopu szkoleniowego (o którym mowa w pkt a) Pracodawca udziela w dni, które są dla Pracownika dniami pracy, zgodnie z obowiązującym go
    rozkładem czasu pracy.
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 13, italic: true}]}
  text: '(opcjonalnie) Ponadto Pracodawca przyznaje Pracownikowi następujące świadczenia dodatkowe:'
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: zwrot kosztów przejazdu do .................................. na zajęcia w szkole według zasad jak przy podróżach służbowych na terenie
    kraju,
  slots:
  - {id: p24_1, span: [27, 61], type: date, context: zwrot kosztów przejazdu do ▢ na zajęcia}
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: zwrot kosztów zakwaterowania według zasad obowiązujących przy podróżach służbowych na terenie kraju,
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: zwrot kosztów wyżywienia (diet) według zasad obowiązujących przy podróżach służbowych na obszarze kraju,
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: zwrot kosztów zakupu podręczników lub innych materiałów szkoleniowych,
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: e), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 75, end: 111, italic: true}]}
  text: 'zwrot kosztów opłaty (czesnego), za naukę pobieraną przez szkołę w całości (w przypadku uczęszczania na studia), w wysokości do ............................. zł
    (słownie: ………………………………….……………. złotych)'
  slots:
  - {id: p28_1, span: [128, 157], type: date, context: całości w wysokości do ▢ zł}
  - {id: p28_2, span: [171, 191], type: amount, context: wysokości do zł słownie ▢ złotych}
- {p: 29, role: spacer}
- p: 30
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 125, end: 158, italic: true}]}
  text: Pracownik zobowiązuje się do przepracowania u Pracodawcy okresu ................ (nie więcej niż 3 lata) po ukończeniu nauki (np. zdaniu
    egzaminu dyplomowego) pod rygorem zwrotu kosztów świadczeń otrzymanych od Pracodawcy.
  slots:
  - {id: nie_wiecej_niz_3_lata, span: [64, 80], type: text, hint: nie więcej niż 3 lata}
  inline_hints:
  - {span: [81, 104], text: nie więcej niż 3 lata}
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Pracodawca ma prawo żądać zwrotu poniesionych kosztów w razie:'
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: niepodjęcia nauki lub jej przerwania przez Pracownika z nieuzasadnionych przyczyn,
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: rozwiązania stosunku pracy przez Pracodawcę bez wypowiedzenia z winy Pracownika, w trakcie podnoszenia kwalifikacji zawodowych lub w okresie
    wskazanym w punkcie 1 po jego ukończeniu,
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 93, end: 94, vert: superscript}]}
  text: rozwiązania umowy o pracę przez Pracownika bez wypowiedzenia na podstawie art. 55 lub art. 943 ustawy z dnia 26 czerwca 1974 r. – Kodeks
    pracy, mimo braku przyczyn określonych w tych przepisach.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Pracodawcy przysługuje roszczenie o zwrot poniesionych kosztów wynikających z niniejszej umowy, pomniejszonych proporcjonalnie do okresu
    przepracowanego przez Pracownika po ukończeniu nauki lub do okresu zatrudnienia w czasie podnoszenia kwalifikacji.
- {p: 37, role: spacer}
- p: 38
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Niniejsza umowa wchodzi w życie z chwilą podjęcia nauki przez Pracownika.
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 155, end: 169, italic: true}]}
  text: Umowa traci ważność w razie nierozpoczęcia przez Pracownika podnoszenia kwalifikacji zawodowych z przyczyn leżących po stronie Pracodawcy
    lub organizatora (przykładowo) studiów podyplomowych.
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany niniejszej umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych niniejszą umową mają zastosowanie przepisy ustawy Kodeks pracy i ustawy z dnia 23 kwietnia 1964 r. – Kodeks
    cywilny.
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie spory powstałe na tle niniejszej umowy rozstrzygane będą przez sąd właściwy ze względu na siedziby Pracodawcy.
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: Umowę sporządzono w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze Stron.
