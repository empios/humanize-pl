  text: Za każde naruszenie przez Pracownika postanowień niniejszej umowy w zakresie podejmowania działalności konkurencyjnej, Pracodawca może
    dochodzić od niego naprawienia poniesionej szkody na zasadach określonych w art. 114–122 ustawy z dnia 26 czerwca 1974 r. – Kodeks pracy.
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 66, end: 76, bold: true}, {start: 99,
        end: 109, bold: true}, {start: 273, end: 283, bold: true}]}
  text: Niezależnie od odpowiedzialności materialnej określonej w ust. 1, Pracodawca może zastosować wobec Pracownika naruszającego postanowienia
    umowy, odpowiedzialność porządkową, a w uzasadnionych przypadkach wypowiedzieć umowę o pracę lub rozwiązać ją bez wypowiedzenia z winy Pracownika.
