- p: 19
  role: body
  layout: {align: justify, size: 10.0}
  text: Przedmiotem umowy jest odpłatne wykonywanie przez Pośrednika, czynności zmierzających do zawarcia i wykonywania umowy najmu lokalu określonego
    w § 2 umowy.
- {p: 20, role: spacer}
- p: 21
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- {p: 22, role: spacer}
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 132, end: 193, italic: true},
      {start: 275, end: 290, italic: true}, {start: 313, end: 376, italic: true}]}
  text: "Zamawiający zleca Pośrednikowi prowadzenie spraw z zakresu zarządzania najmem nieruchomością, położoną w …………………………………………………………………. (adres\
    \ położenia nieruchomości oraz inne dane nieruchomości), dla której prowadzona jest \nKsięga Wieczysta ...................................\
    \ (numer księgi), przez ……………………………………. (wskazanie wydziału oraz sądu, który prowadzi księgę wieczystą) (dalej jako Nieruchomość). "
  slots:
  - {id: adres_polozenia_nieruchomosci_oraz_inne_dane_nie, span: [105, 131], type: place, hint: adres położenia nieruchomości oraz inne dane nieruchomości}
  - {id: numer_ksiegi, span: [239, 274], type: text, hint: numer księgi}
  - {id: wskazanie_wydzialu_oraz_sadu_ktory_prowadzi_ksie, span: [297, 312], type: person, hint: 'wskazanie wydziału oraz sądu, który prowadzi
      księgę wieczystą'}
  inline_hints:
  - {span: [132, 192], text: adres położenia nieruchomości oraz inne dane nieruchomości}
  - {span: [275, 289], text: numer księgi}
  - {span: [313, 376], text: 'wskazanie wydziału oraz sądu, który prowadzi księgę wieczystą'}
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 117, end: 247, italic: true}]}
  text: Zamawiający oświadcza, że nieruchomość wskazana w ust. 1 stanowi jego własność, wchodzącą w skład majątku osobistego (w innym przypadku,
    należy wskazać na tytuł prawny do korzystania z nieruchomości oraz ustalić, czy należą do majątku osobistego).
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zamawiający oświadcza, że nieruchomość wskazana w ust. 1 jest wolna od wad prawnych oraz wszelkich zobowiązań na rzecz osób trzecich,
    nie jest również przedmiotem postępowania sądowego. Ponadto nieruchomość nie jest obciążona wpisami w dziale III i IV księgi wieczystej.
- {p: 26, role: spacer}
- {p: 27, role: spacer}
