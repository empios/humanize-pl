- {p: 38, role: spacer}
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Zamawiający zobowiązuje się przedłożyć Pośrednikowi wszelkie informacje, niezbędne do zawarcia umowy najmu nieruchomości wskazanej w §
    2 ust. 1 umowy.
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Pośrednik zobowiązuje się uzgadniać z Zamawiającym zmiany wysokości proponowanych czynszów najmu nieruchomości. '
- {p: 41, role: spacer}
- p: 42
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- {p: 43, role: spacer}
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Pośrednik zobowiązuje się do skompletowania  i prowadzenia pełnych dokumentacji nieruchomości, dokonania wizytacji nieruchomości, sporządzenia
    karty opisu nieruchomości, osobistego uczestnictwa w prezentacji nieruchomości i prezentowania w imieniu Zamawiającego warunków najmu lokalu.
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 236, end: 334, italic: true}]}
  text: 'Zamawiający udziela pełnomocnictwa do zawierania umów najmu nieruchomości Pośrednikowi oraz do wykonywania wszystkich czynności związanych
    z wykonywaniem, rozwiązywaniem umowy najmu i dochodzeniem roszczeń z tytułu zawartych umów najmu (Zamawiający może zdecydować, czy chce aby
    umowy były zawierane w jego imieniu przez Pośrednika). '
- p: 46
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Pośrednik będzie przyjmował w imieniu Zamawiającego czynsz najmu i przekazywał go Zamawiającemu przelewem na rachunek bankowy ………………………….
    W terminie do 10 dnia miesiąca następującego po pobraniu czynszu od najemcy, po potrąceniu wynagrodzenia, o którym mowa w § 6 ust. 1-2. '
  slots:
  - {id: p46_1, span: [126, 137], type: text, context: przelewem na rachunek bankowy ▢ W terminie}
- p: 47
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- {p: 48, role: spacer}
- p: 49
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 111, end: 218, italic: true}]}
  text: Wynagrodzenie Pośrednika za wykonanie przedmiotu umowy, określonego w § 1 i § 2 niniejszej umowy, wynosi ..... (wynagrodzenie można określić
    ryczałtowo lub jako prowizję od pobranych przez Zamawiającego czynszów najmu).
  slots:
  - {id: wynagrodzenie_mozna_okreslic_ryczaltowo_lub_jako, span: [105, 110], type: text, hint: wynagrodzenie można określić ryczałtowo lub jako
      prowizję od pobranych przez Zamawiającego czynszów najmu}
  inline_hints:
  - {span: [111, 218], text: wynagrodzenie można określić ryczałtowo lub jako prowizję od pobranych przez Zamawiającego czynszów najmu}
- p: 50
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wynagrodzenia określone w ust. 1 i 2 zostaną powiększone o podatek VAT w stawce obowiązującej w dniu wystawienia faktury VAT.
- p: 51
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Pośrednikowi przysługuje nadto zwrot kosztów związanych z wykonywaniem niniejszej umowy a w szczególności: …………………………………………..'
  slots:
  - {id: p51_1, span: [107, 125], type: text, context: umowy a w szczególności ▢}
- {p: 52, role: spacer}
- p: 53
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- {p: 54, role: spacer}
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Umowa niniejsza zostaje zawarta z zastrzeżeniem wyłączności.
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Zastrzeżenie wyłączności oznacza, że Zamawiający na podstawie niniejszej umowy zobowiązuje się, że powierzy wykonywanie czynności określonych
    w § 2 ust. 1 wyłącznie Pośrednikowi. Zamawiający nie może w okresie w którym wyłączność została zastrzeżona, ani bezpośrednio, ani pośrednio
    zawrzeć umowy, która mogłaby naruszyć wyłączność Pośrednika.
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: W przypadku niedotrzymania zobowiązania określonego w ust. 1 i 2 powyżej spowoduje obowiązek zapłaty przez Zamawiającego kary umownej
    w wysokości …….
  slots:
  - {id: p57_1, span: [146, 149], type: amount, context: kary umownej w wysokości ▢}
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: W przypadku wynajęcia przez Zamawiającego przedmiotowych nieruchomości, przed upływem …. od rozwiązania niniejszej umowy, najemcom wskazanym
    przez Pośrednika podczas obowiązywania umowy, Zamawiający zapłaci Pośrednikowi wynagrodzenie odpowiadające kwotom wskazanym w § 6 ust. 1 umowy.
  slots:
  - {id: p58_1, span: [86, 88], type: text, context: przedmiotowych nieruchomości przed upływem ▢ od rozwiązania}
- p: 59
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: § 6 ust. 3 stosuje się odpowiednio.
- {p: 60, role: spacer}
- p: 61
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- {p: 62, role: spacer}
- p: 63
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Zamawiający zobowiązuje się do każdorazowego, niezwłocznego informowania Pośrednika o zmianach w stanie prawnym i faktycznym nieruchomości
    wskazanych w § 2 ust. 1 umowy.
- p: 64
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Zamawiający i Pośrednik zobowiązują się do wzajemnego, niezwłocznego informowania o każdorazowej zmianie swoich danych adresowych i numerów
    kontaktowych.
- {p: 65, role: spacer}
- p: 66
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- {p: 67, role: spacer}
- p: 68
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Zamawiający wyraża zgodę na przetwarzanie jego danych osobowych, określonych w komparycji  niniejszej Umowy oraz w jej treści przez Pośrednika
    w celu i na okres realizacji niniejszej Umowy, zgodnie z postanowieniami niniejszego punktu.
- p: 69
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Przetwarzanie danych osobowych z tytułu niniejszej Umowy odbywać się będzie w zgodzie i w oparciu o:'
- p: 70
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: ustawę z dnia 10 maja 2018 r. o ochronie danych osobowych (t.j. Dz.U.2019.1781), zwaną dalej „UODO” wraz z aktami wykonawczymi;
- p: 71
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: rozporządzenie Parlamentu Europejskiego i Rady (EU) 2016/679 z dnia 27 kwietnia 2016 roku w sprawie ochrony osób fizycznych w związku
    z przetwarzaniem danych osobowych i w sprawie swobodnego przepływu takich danych oraz uchylenia dyrektywy 95/46/WE (ogólne rozporządzenie
    o ochronie danych), zwane dalej „RODO”.
- p: 72
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Administratorem danych osobowych, których przetwarzanie wynika z niniejszej Umowy jest Pośrednik.
- p: 73
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Cel i zakres powierzenia przetwarzania danych osobowych wynika bezpośrednio i ogranicza się wyłącznie do zdań wynikających z niniejszej
    Umowy. Na powyższych danych będą wykonywane w szczególności operacje: przechowywanie, transfer, utrwalanie, analizowanie, a także czynności
    polegające na tworzeniu kopii bezpieczeństwa oraz czynności związane z odtwarzaniem z kopii bezpieczeństwa.'
- p: 74
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Do przetwarzania danych osobowych mogą być dopuszczone wyłącznie osoby posiadające upoważnienie, o których mowa w art. 37 UODO lub w art.
    29 RODO oraz przeszkolone z zakresu przepisów dotyczących ochrony danych osobowych.
- {p: 75, role: spacer}
- p: 76
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- {p: 77, role: spacer}
- p: 78
  role: body
  layout: {align: justify, size: 10.0}
  text: Pośrednik oświadcza, iż zgodnie z art. 181 ust. 3 ustawy z dnia 21 sierpnia 1997 r. o gospodarce nieruchomościami jest ubezpieczony od
    odpowiedzialności cywilnej za szkody, które mogą wyniknąć w związku z wykonywaniem czynności pośrednictwa.
- {p: 79, role: spacer}
- p: 80
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- {p: 81, role: spacer}
- p: 82
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Umowa zostaje zawarta na czas nieokreślony.
- p: 83
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Stronom umowy przysługuje prawo jej rozwiązania z zachowaniem jednomiesięcznego okresu wypowiedzenia.
- p: 84
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Jeżeli Pośrednik dokonał czynności zmierzających do zrealizowania umowy, to w przypadku rozwiązania umowy przez Zamawiającego, Pośrednikowi
    należy się zwrot poniesionych kosztów.
- p: 85
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany niniejszej umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 86
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych niniejszą umową mają zastosowanie przepisy ustawy z dnia 23 kwietnia 1964 r. Kodeks cywilny.
