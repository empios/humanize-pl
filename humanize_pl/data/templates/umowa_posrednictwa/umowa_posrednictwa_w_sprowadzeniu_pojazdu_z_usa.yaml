- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 22, end: 29, bold: true}, {start: 31,
        end: 41, bold: true}, {start: 43, end: 52, bold: true}]}
  text: Zgodnie z zamówieniem Nabywcy, Sprzedawca (pośrednik) dokona zakupu pojazdu, o którym mowa w § 1 ust. 1, u dilera lub aukcji na terytorium
    USA oraz sprowadzi ww. pojazd w miejsce odbioru o którym mowa w ust. 3.
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 40, end: 50, bold: true}]}
  text: Miejscem dostarczenia przez Sprzedawcę (pośrednika) pojazdu jest …………………….
  slots:
  - {id: p26_1, span: [65, 74], type: text, context: przez Sprzedawcę pojazdu jest ▢}
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 10, bold: true}, {start: 12,
        end: 21, bold: true}]}
  text: 'Sprzedawca (pośrednik) oświadcza, że:'
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 5, end: 17, bold: true}]}
  text: jest pośrednikiem w zakupie pojazdu o którym mowa w § 1 ust 1,
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: pojazd o którym mowa w §1 ust. 1 będzie wolny od wad prawnych , w tym praw osób trzecich i nie toczą się w stosunku do niego postępowania
    sądowe ani egzekucyjne.
- p: 30
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 10, bold: true}, {start: 12,
        end: 21, bold: true}]}
  text: 'Sprzedawca (pośrednik) nie ponosi odpowiedzialności za różnice między stanem faktycznym sprowadzonego pojazdu, a jego opisem przedstawionym
    na portalu aukcyjnym. '
- {p: 31, role: spacer}
- p: 32
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2 Płatności
- {p: 33, role: spacer}
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 76, end: 86, bold: true}]}
  text: Procedura zakupu pojazdu rozpoczyna się po opłaceniu przez Nabywcę prowizji Sprzedawcy w wysokości 1500 zł.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Prowizja, o której mowa w § 2 ust. 1 nie podlega zwrotowi, z zastrzeżeniem § 7 ust. 1.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}, {start: 69,
        end: 79, bold: true}, {start: 80, end: 92, bold: true}, {start: 134, end: 144, bold: true}, {start: 145, end: 157, bold: true}]}
  text: 'Nabywca wpłaca prowizję, o której mowa w ust. 1, na rachunek bankowy Sprzedawcy (pośrednika): …………………………………………….. lub do rąk własnych
    Sprzedawcy (pośrednika).'
  slots:
  - {id: p36_1, span: [94, 113], type: text, context: na rachunek bankowy Sprzedawcy ▢ lub do}
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 27, end: 37, bold: true}]}
  text: Podpisując niniejszą Umowę Sprzedawca (pośrednik) pokwitował Nabywcy otrzymanie kwoty określonej w ust 1.
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 50, end: 60, bold: true}, {start: 134,
        end: 141, bold: true}]}
  text: 'W przypadku nieudanej próby wylicytowania pojazdu Sprzedawca podejmie kolejne próby licytacji kolejnych pojazdów zatwierdzonych przez
    Nabywcę, z zastrzeżeniem ust. 6. '
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 10, bold: true}, {start: 12,
        end: 21, bold: true}, {start: 158, end: 165, bold: true}, {start: 230, end: 237, bold: true}]}
  text: Sprzedawca (pośrednik) po nieudanej pierwszej licytacji zobowiązuję się do podejmowania kolejnych prób licytacji maksymalnie 50 pojazdów
    zatwierdzonych przez Nabywcę. Licytacja kolejnych pojazdów uzależniona jest od zapłaty przez Nabywcę dodatkowej prowizji w wysokości 30 zł
    od każdej kolejnej próby.
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: 'Nabywca zobowiązuje się w ciągu 24 godzin od poinformowania go o wygranej licytacji do opłacenia wylicytowanego pojazdu wraz z kosztami
    aukcyjnymi. '
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}, {start: 152,
        end: 162, bold: true}, {start: 164, end: 174, bold: true}]}
  text: 'Nabywca dokonuje opłacenia wylicytowanego pojazdu wraz z kosztami aukcyjnymi bezpośrednio na konto portalu aukcyjnego, które zostanie
    mu wskazane przez Sprzedawcę (pośrednika). '
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '9.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}, {start: 236,
        end: 260, bold: true}]}
  text: 'Nabywca zobowiązuje się do uiszczenia w wyznaczonych terminach wszystkich dodatkowych opłat, związanych ze sprowadzeniem pojazdu do miejsca,
    o którym mowa w § 1 ust. 3, na odpowiednie rachunki bankowe, które zostaną mu przekazane przez Sprzedawcę (pośrednika). '
- {p: 43, role: spacer}
- p: 44
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3 Terminy
- {p: 45, role: spacer}
- p: 46
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 61,
        end: 68, bold: true}]}
  text: Sprzedawca (pośrednik) zobowiązuje się wydać przedmiot Umowy Nabywcy do 90 dni od daty podpisania niniejszej umowy.
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 41, end: 51, bold: true}, {start: 53,
        end: 63, bold: true}, {start: 119, end: 126, bold: true}]}
  text: 'Za chwilę wydania przedmiotu umowy przez Sprzedawcę (pośrednika) będzie się uważać moment przekazania przedmiotu Umowy Nabywcy wraz z:'
