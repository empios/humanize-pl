- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 22, end: 29, bold: true}]}
  text: działań lub zaniechań Nabywcy, w szczególności nie dokonania płatności w terminie,
- p: 59
  role: item
  layout: {align: justify, size: 10.0, marker: {text: e), kind: lowerLetter, src: auto, level: 0}}
  text: zmian obowiązujących przepisów w zakresie procedur administracyjnych, celnych lub transportu morskiego.
