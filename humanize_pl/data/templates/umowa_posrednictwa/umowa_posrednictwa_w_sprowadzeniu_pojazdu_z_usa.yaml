- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: e), kind: lowerLetter, src: auto, level: 0}}
  text: kluczykami (minimum 1) do przedmiotu Umowy, o którym mowa w § 1 ust 1 Umowy,
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Miejscem wydania przedmiotu Umowy będzie miejsce dostarczenia pojazdu określone w § 1 ust. 3 Umowy.
- p: 54
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 10, bold: true}, {start: 12,
        end: 21, bold: true}]}
  text: 'Sprzedawca (pośrednik) nie ponosi odpowiedzialności za opóźnienia w wydaniu pojazdu wynikające z:'
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: działań lub zaniechań organów celnych lub administracyjnych w portach, w szczególności wydłużenie odprawy celnej lub zatrzymania pojazdu;
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 165, end: 175, bold: true},
      {start: 177, end: 187, bold: true}]}
  text: działań lub zaniechań organów administracyjnych związanych z wprowadzeniem samochodu do obszaru Europy i RP, o ile ich przyczyny nie wynikają
    z winy lub zaniechania Sprzedawcy (pośrednika);
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}, spans: [{start: 38, end: 49, bold: true}]}
