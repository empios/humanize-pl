  text: "§ 4.\t PRAWO ODSTĄPIENIA"
- {p: 41, role: spacer}
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 9, bold: true}, {start: 323,
        end: 331, bold: true}]}
  text: Kupującej przysługuje prawo odstąpienia od umowy, jeżeli do czasu zawarcia umowy przyrzeczonej, tj. do dnia …………………, ujawnią się jakiekolwiek
    inne wady prawne nieruchomości, o której mowa w § 1 ust. 1 niniejszej umowy. Prawo do odstąpienia przysługuje w terminie 21 dni od uzyskania
    wiedzy o przesłankach odstąpienia przez Kupującą.
  slots:
  - {id: p42_1, span: [108, 115], type: date, context: przyrzeczonej tj. do dnia ▢ ujawnią się}
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 31, end: 39, bold: true}, {start: 97,
        end: 107, bold: true}, {start: 135, end: 144, bold: true}]}
  text: 'W przypadku skorzystania przez Kupującą z prawa odstąpienia od umowy, o którym mowa w § 4 ust. 1 Sprzedawca zobowiązany będzie zwrócić
    Kupującej kwotę stanowiącą dwukrotność zadatku, tj. …………………  zł (słownie: …….. zł). '
  slots:
