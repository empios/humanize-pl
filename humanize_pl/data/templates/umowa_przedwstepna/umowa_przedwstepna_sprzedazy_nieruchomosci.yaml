- {p: 33, role: spacer}
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 35, end: 43, bold: true}, {start: 64,
        end: 74, bold: true}]}
  text: 'W dniu podpisania niniejszej umowy Kupująca przekazuje na rzecz Sprzedawcy zadatek w kwocie ………………… zł  (słownie: ……………………………………………..
    zł), którego odbiór Sprzedawca potwierdza.'
  slots:
  - {id: p34_1, span: [92, 99], type: text, context: Sprzedawcy zadatek w kwocie ▢ zł którego}
  - {id: p34_2, span: [114, 133], type: amount, context: w kwocie zł słownie ▢ zł którego}
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W przypadku zawarcia umowy przyrzeczonej w terminie, o którym mowa w § 2 ust. 2, zadatek ulegnie zaliczeniu na poczet ceny.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 33, end: 41, bold: true}, {start: 43,
        end: 53, bold: true}]}
  text: W razie niewykonania umowy przez Kupującą, Sprzedawca będzie uprawniony zatrzymać niniejszy zadatek w pełnej kwocie.
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 33, end: 43, bold: true}, {start: 197,
        end: 206, bold: true}]}
  text: W razie niewykonania umowy przez Sprzedawcę w szczególności w przypadku, w którym umowa nie zostanie zawarta na skutek niespełnienia warunku
    określonego w § 1 ust. 2, będzie on zobowiązany zwrócić Kupującej kwotę stanowiącą dwukrotność zadatku, tj. …………………
  slots:
  - {id: p37_1, span: [249, 256], type: text, context: stanowiącą dwukrotność zadatku tj. ▢}
- {p: 38, role: spacer}
- {p: 39, role: spacer}
