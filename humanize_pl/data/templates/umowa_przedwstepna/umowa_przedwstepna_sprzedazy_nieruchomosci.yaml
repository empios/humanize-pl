  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 1., kind: paragraph, src: manual, level: 0}, tabs: 1}
  text: "§ 1.\t PRZEDMIOT UMOWY"
- {p: 20, role: spacer}
- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 10, bold: true}]}
  text: Sprzedawca oświadcza, iż jest właścicielem nieruchomości lokalowej - mieszkania położonego w ………………… przy ul. …………………, o pow. …………………,
    dla którego Sąd Rejonowy w ………………… prowadzi księgę wieczystą nr …………………. Wydruk księgi wieczystej prowadzonej dla w/w nieruchomości stanowi
    załącznik nr 1 do niniejszej umowy.
  slots:
  - {id: p21_1, span: [93, 100], type: place, context: lokalowej mieszkania położonego w ▢ przy ul.}
  - {id: p21_2, span: [110, 117], type: address, context: położonego w przy ul. ▢ o pow.}
  - {id: p21_3, span: [126, 133], type: text, context: przy ul. o pow. ▢ dla którego}
  - {id: p21_4, span: [162, 169], type: place, context: którego Sąd Rejonowy w ▢ prowadzi księgę}
  - {id: p21_5, span: [199, 207], type: text, context: prowadzi księgę wieczystą nr ▢ Wydruk księgi}
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 10, bold: true}]}
  text: Sprzedawca oświadcza i zobowiązuje się, że nieruchomość, o której mowa w § 1 ust. 1 do dnia zawarcia umowy przyrzeczonej będzie zwolniona
    od jakichkolwiek obciążeń i praw osób trzecich oraz wszelkich innych wad prawnych. Obecnie nieruchomość jest obciążona służebnością mieszkania.
    Zawarcie umowy przyrzeczonej nastąpi pod warunkiem prawomocnego wykreślenia z księgi wieczystej nr …………… wpisu dotyczącego służebności mieszkania
    ustanowionej na rzecz ………….. do dnia przewidzianego na zawarcie umowy przyrzeczonej określonego w § 2 ust. 2.
  slots:
  - {id: p22_1, span: [381, 386], type: text, context: z księgi wieczystej nr ▢ wpisu dotyczącego}
  - {id: p22_2, span: [450, 456], type: text, context: mieszkania ustanowionej na rzecz ▢ do dnia}
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 8, bold: true}]}
  text: Kupująca oświadcza, iż dokonała oględzin nieruchomości, o której mowa w § 1 ust. 1, i że nie wnosi żadnych zastrzeżeń co do jej stanu
    technicznego.
- {p: 24, role: spacer}
- p: 25
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2., kind: paragraph, src: manual, level: 0}, tabs: 1}
  text: "§ 2.\t ZOBOWIĄZANIA STRON"
- {p: 26, role: spacer}
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 10, bold: true}, {start: 136,
        end: 144, bold: true}, {start: 322, end: 332, bold: true}]}
  text: 'Sprzedawca zobowiązuje się sprzedać nieruchomość, o której mowa w § 1 ust. 1 niniejszej umowy  za cenę ………………… zł (słownie: ………. zł),
    a Kupująca zobowiązuje się kupić powyższą nieruchomość i zapłacić ww. cenę. Zapłata umówionej ceny nastąpi w dniu podpisania umowy przyrzeczonej,
    przelewem na następujący rachunek bankowy Sprzedawcy: Bank ………………… nr rachunku …………………'
  slots:
  - {id: p27_1, span: [103, 110], type: text, context: niniejszej umowy za cenę ▢ zł a}
  - {id: p27_2, span: [124, 128], type: amount, context: za cenę zł słownie ▢ zł a}
  - {id: p27_3, span: [339, 346], type: text, context: rachunek bankowy Sprzedawcy Bank ▢ nr rachunku}
  - {id: p27_4, span: [359, 366], type: text, context: Sprzedawcy Bank nr rachunku ▢}
