- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Zleceniodawca zobowiązuje się do przekazania Zleceniobiorcy dostępu do kont wskazanych w § 1 ust. 2. '
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Zleceniobiorca nie będzie uniemożliwiał lub utrudniał Zleceniodawcy w żaden sposób dostępu do kont wskazanych w § 1 ust. 2 w trakcie
    trwania umowy oraz po jej zakończeniu. '
- {p: 40, role: spacer}
- p: 41
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Zleceniobiorca przenosi na Zleceniodawcę prawa autorskie do wszystkich treści zamieszczonych na stronach lub fanpage’ach, o których mowa
    w § 1 ust. 2, wytworzonych przez Zleceniobiorcę w trakcie trwania umowy i w ramach jej wykonywania. '
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Strony mogą w dodatkowym porozumieniu zawartym w formie pisemnej pod rygorem nieważności ustalić, że prawa autorskie do niektórych treści
    wytworzonych przez Zleceniobiorcę będą przeniesione na Zleceniodawcę za dodatkowym wynagrodzeniem. '
