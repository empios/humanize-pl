  layout: {align: center, size: 12.0, bold: true, marker: {text: § 1, kind: paragraph, src: manual, level: 0}}
  text: § 1
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Przedmiotem Umowy jest sprzedaż przedsiębiorstwa prowadzonego w ramach jednoosobowej działalności gospodarczej Sprzedawcy o nazwie …………….
    (dalej jako Przedsiębiorstwo).
  slots:
  - {id: dalej_jako_przedsiebiorstwo, span: [131, 137], type: text, hint: dalej jako Przedsiębiorstwo}
  inline_hints:
  - {span: [138, 167], text: dalej jako Przedsiębiorstwo}
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W skład Przedsiębiorstwa wchodzi zespół składników materialnych i niematerialnych, w tym rzeczy oraz prawa, za pomocą których Sprzedawca
    prowadzi działalność apteki ogólnodostępnej.
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Sprzedawca oświadcza ponadto, że Przedsiębiorstwo jest wolne od jakichkolwiek wad prawnych, w tym wszelkich praw osób trzecich i jakichkolwiek
    innych obciążeń i zabezpieczeń.
- p: 25
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Sprzedawca oświadcza, że przenosi na Kupującego własność Przedsiębiorstwa, a Kupujący nabywa tę część i zobowiązuje się do zapłaty umówionej
    ceny. Przedsiębiorstwo obejmuje:'
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: ……………………………………………….
  slots:
  - {id: p27_1, span: [0, 19], type: text, context: ▢}
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: ……………………………………………….
  slots:
  - {id: p28_1, span: [0, 19], type: text, context: ▢}
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: ……………………………………………….
  slots:
  - {id: p29_1, span: [0, 19], type: text, context: ▢}
- p: 30
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: 'Szczegółowy spis praw majątkowych i niemajątkowych, wchodzących w skład Przedsiębiorstwa stanowi Załącznik nr 1 do niniejszej Umowy. '
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: 'Sprzedawca oświadcza, że do dnia zawarcia niniejszej Umowy nie zbył Przedsiębiorstwa ani żadnego z jej składników na rzecz innego podmiotu
    niż Kupujący. '
- {p: 32, role: spacer}
- p: 33
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 34
  role: body
  layout: {align: justify, indent: {left: 57, right: 57}, size: 10.0}
  text: Kupujący oświadcza, że dokonał oględzin Przedsiębiorstwa, a także oświadcza, że nie wnosi jakichkolwiek zastrzeżeń zarówno do jego ogólnego
    stanu, jak i właściwości poszczególnych jego składników.
- p: 35
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Sprzedawca sprzedaje, a Kupujący nabywa Przedsiębiorstwo za cenę ......................... zł.
  slots:
  - {id: p36_1, span: [65, 90], type: text, context: nabywa Przedsiębiorstwo za cenę ▢ zł.}
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Płatność ceny określonej w § 4 ust. umowy nastąpi w ………….. równych ratach płatnych do 10 dnia każdego miesiąca zaczynając od …………………… '
  slots:
  - {id: p37_1, span: [52, 58], type: place, context: ust. umowy nastąpi w ▢ równych ratach}
  - {id: p37_2, span: [125, 133], type: date, context: każdego miesiąca zaczynając od ▢}
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Raty będą wpłacane w częściach równych na rachunki bankowe ………………………………………… oraz …………………………………………………………………….
  slots:
  - {id: p38_1, span: [59, 75], type: text, context: równych na rachunki bankowe ▢ oraz}
  - {id: p38_2, span: [81, 108], type: text, context: na rachunki bankowe oraz ▢}
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Za dzień zapłaty raty uznaje się dzień obciążenia rachunku kupującego.  '
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: W razie braku zapłaty raty Sprzedawca może bez wyznaczenia terminu dodatkowego od Umowy odstąpić. Prawo do odstąpienia Sprzedawca może
    wykonać w terminie 3 miesięcy od dnia spełnienia się przesłanek do odstąpienia.
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: Kupujący zapłaci Sprzedawcy odsetki za opóźnienie w transakcjach handlowych z tytułu opóźnienia w uregulowaniu raty.
- {p: 42, role: spacer}
- p: 43
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wydanie Przedsiębiorstwa nastąpi w dniu ..........................
  slots:
  - {id: p44_1, span: [40, 66], type: date, context: Przedsiębiorstwa nastąpi w dniu ▢}
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Od momentu wydania Przedsiębiorstwa na Kupującym ciąży niebezpieczeństwo utraty lub uszkodzenia.
- p: 46
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Wraz z wydaniem Przedsiębiorstwa Sprzedawca przekaże Kupującemu wszelkie posiadane przez niego rzeczy służące do korzystania z Przedsiębiorstwa.
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Sprzedawca wyda także Kupującemu pełną dokumentację Przedsiębiorstwa. '
- {p: 48, role: spacer}
- p: 49
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 50
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Wszelkie zmiany niniejszej Umowy pod rygorem nieważności wymagają formy pisemnej

    z podpisami notarialnie poświadczonymi/aktu notarialnego.'
- p: 51
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'W sprawach nieuregulowanych w niniejszej Umowie zastosowanie znajdą przepisy ustawy

    z dnia 23 kwietnia 1964 r. Kodeks cywilny.'
- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Dla sporów wynikłych na tle niniejszej Umowy właściwy będzie sąd właściwy według miejsca zamieszkania Kupującego.
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Umowę sporządzono w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron.
