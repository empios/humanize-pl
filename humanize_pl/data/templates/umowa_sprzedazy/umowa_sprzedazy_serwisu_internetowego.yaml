  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 133, end: 180, italic: true},
      {start: 269, end: 336, italic: true}]}
  text: 'Przedmiotem Umowy jest sprzedaż serwisu internetowego, funkcjonującego do dnia zawarcia niniejszej Umowy pod adresem www: …………………………
    (należy wskazać dotychczasowy adres www strony), prowadzonego w ramach działalności gospodarczej Sprzedawcy polegającej na ……………………………… (należy
    opisać w jakim celu prowadzono dotychczas niniejszą stronę).'
  slots:
  - {id: nalezy_wskazac_dotychczasowy_adres_www_strony, span: [122, 132], type: text, hint: należy wskazać dotychczasowy adres www strony}
  - {id: nalezy_opisac_w_jakim_celu_prowadzono_dotychczas, span: [256, 268], type: text, hint: należy opisać w jakim celu prowadzono dotychczas
      niniejszą stronę}
  inline_hints:
  - {span: [133, 180], text: należy wskazać dotychczasowy adres www strony}
  - {span: [269, 336], text: należy opisać w jakim celu prowadzono dotychczas niniejszą stronę}
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Sprzedawca oświadcza, że jest wyłącznym właścicielem serwisu internetowego, stanowiącego przedmiot niniejszej Umowy.
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Sprzedawca oświadcza ponadto, że opisany powyżej przedmiot umowy jest wolny od jakichkolwiek wad prawnych, w tym wszelkich praw osób trzecich
    i jakichkolwiek innych obciążeń i zabezpieczeń.
- {p: 35, role: spacer}
- p: 36
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- {p: 37, role: spacer}
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Sprzedawca oświadcza, że przenosi na Kupującego własność serwisu internetowego wskazanego

    w § 1 Umowy, a Kupujący nabywa ww. serwis i zobowiązuje się do zapłaty umówionej ceny. Przedmiot umowy obejmuje:'
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
