  inline_hints:
  - {span: [17, 39], text: zobowiązania Klienta}
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Zleceniodawca zobowiązuje się płacić w ustalonym terminie wynagrodzenie Zleceniobiorcy.
- {p: 36, role: spacer}
- p: 37
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Za wykonanie prac określonych w § 1 Zleceniobiorcy przysługuje wynagrodzenie w wysokości ……… zł (słownie: …………… złotych) brutto za każdą
    przepracowaną godzinę przez Zleceniobiorcę.'
  slots:
  - {id: p38_1, span: [89, 92], type: amount, context: przysługuje wynagrodzenie w wysokości ▢ zł brutto}
  - {id: p38_2, span: [106, 111], type: amount, context: w wysokości zł słownie ▢ złotych brutto}
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Wynagrodzenie będzie wypłacane na podstawie ewidencji pracy prowadzonej przez Zleceniobiorcę, zatwierdzonej przez Zleceniodawcę.
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Płatność wynagrodzenia nastąpi przelew na rachunek bankowy Zleceniobiorcy o numerze: ……………………… w terminie ……… dni od dnia przedstawienia
    zatwierdzonej ewidencji czasu pracy.'
  slots:
  - {id: p40_1, span: [85, 94], type: text, context: bankowy Zleceniobiorcy o numerze ▢ w terminie}
  - {id: p40_2, span: [106, 109], type: text, context: o numerze w terminie ▢ dni od}
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Zapłata jest uważana za dokonaną z chwilą obciążenia rachunku bankowego Zleceniodawcy. '
- {p: 42, role: spacer}
- p: 43
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 44
  role: body
  layout: {align: justify, size: 10.0}
  text: Niniejsza umowa zostaje zawarta na czas określony od dnia ……… r. do dnia …………… r.
  slots:
  - {id: p44_1, span: [58, 61], type: date, context: czas określony od dnia ▢ r. do}
  - {id: p44_2, span: [73, 78], type: date, context: dnia r. do dnia ▢ r.}
- {p: 45, role: spacer}
- p: 46
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Strony zgodnie oświadczają, że ich wolą nie jest nawiązanie stosunku pracy.
- p: 48
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Zleceniobiorca zobowiązuje się wykonywać powierzone czynności z należytą starannością. '
- {p: 49, role: spacer}
- p: 50
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- p: 51
  role: body
  layout: {align: justify, size: 10.0}
  text: 'W razie niemożności dokonania określonej czynności Zleceniobiorca obowiązany jest niezwłocznie powiadomić o tym Zleceniodawcę. '
- {p: 52, role: spacer}
- p: 53
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- p: 54
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Zleceniobiorca ponosi pełną odpowiedzialność za szkody wyrządzone Zleceniodawcy powstałe

    z winy umyślnej lub rażącego niedbalstwa Zleceniobiorcy, w tym za zniszczenie, uszkodzenie lub utratę materiałów, narzędzi lub maszyn udostępnionych
    przez Zleceniodawcę.'
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Strony zgodnie ustalają, że szkody wynikające z normalnej eksploatacji materiałów, maszyn

    i narzędzi nie obciążają Zleceniobiorcy.'
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: W przypadku powstania szkody, Zleceniobiorca zobowiązuje się pokryć jej wartość w pełnej wysokości, zgodnie z wyceną Zleceniodawcy, na
    podstawie przedstawionych dowodów i kalkulacji.
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: 'Ponadto, Zleceniobiorca odpowiada za szkody wyrządzone osobom trzecim wskutek wadliwego wykonania usługi krawieckiej. '
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: 'W razie gdyby osoba trzecia, która poniosła szkodę wskutek wadliwego wykonania usługi krawieckiej, dochodziła naprawienia szkody z tego
    tytułu od Zleceniodawcy, Zleceniobiorca zobowiązuje się do zapłacenia Zleceniodawcy kwoty odpowiadającej odszkodowaniu, które Zleceniodawca
    wypłaci osobie trzeciej. '
- {p: 59, role: spacer}
- p: 60
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 61
  role: body
  layout: {align: justify, size: 10.0}
  text: 'Zleceniobiorca nie może powierzyć wykonania czynności objętych zleceniem osobom trzecim bez uprzedniej pisemnej zgody Zleceniodawcy. '
- {p: 62, role: spacer}
- p: 63
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 64
  role: body
  layout: {align: justify, size: 10.0}
  text: Każda ze stron może rozwiązać umowę w drodze pisemnego wypowiedzenia z zachowaniem …………………… okresu wypowiedzenia.
  slots:
  - {id: p64_1, span: [83, 91], type: text, context: pisemnego wypowiedzenia z zachowaniem ▢ okresu wypowiedzenia.}
- {p: 65, role: spacer}
- p: 66
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- p: 67
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany oraz wypowiedzenie niniejszej umowy wymagają zachowania formy pisemnej pod rygorem nieważności.
- p: 68
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Umowa została sporządzona w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron. '
- p: 69
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych niniejszą umową będą miały zastosowanie przepisy ustawy z dnia 23 kwietnia 1964 r. - Kodeks cywilny.
- p: 70
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie spory, jakie mogą wyniknąć w związku z niniejszą umową będą rozpatrywane przez sąd powszechny właściwy ze względu na miejsce
    zamieszkania Zleceniodawcy.
