- {p: 16, role: spacer}
- p: 17
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 1, kind: paragraph, src: manual, level: 0}}
  text: § 1
- p: 18
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Na mocy niniejszej umowy Zleceniodawca zleca, a Zleceniobiorca zobowiązuje się do wykonywania prac polegających na szyciu odzieży zgodnie
    z przekazanymi przez Zleceniodawcę wytycznymi, wzorami i standardami jakości.
- p: 19
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Prace będą wykonywane przy użyciu materiałów, narzędzi oraz maszyn dostarczonych przez Zleceniodawcę w miejscu wskazanym przez Zleceniodawcę.
- p: 20
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zleceniobiorca zobowiązuje się wykonywać zlecenie z należytą starannością, zgodnie z zasadami sztuki krawieckiej i w ustalonym czasie.
- {p: 21, role: spacer}
- p: 22
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 23
  role: field_header
  layout: {align: justify, size: 10.0}
  text: 'W ramach usług krawieckich Zleceniobiorca zobowiązany jest:'
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: wykonywać prace zgodnie z ustaleniami i instrukcjami Zleceniodawcy,
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: dbać o powierzone materiały, narzędzia i maszyny oraz przestrzegać zasad ich użytkowania,
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: informować Zleceniodawcę o wszelkich trudnościach, usterkach lub innych zdarzeniach mogących wpłynąć na realizację zlecenia,
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
  text: przestrzegać przepisów BHP oraz regulaminów obowiązujących u Zleceniodawcy,
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
  text: ……………………………………… .
  slots:
  - {id: p28_1, span: [0, 15], type: text, context: ▢}
- {p: 29, role: spacer}
