- {p: 84, role: spacer}
- p: 85
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 86
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}]}
  text: Strony mogą rozwiązać umowę z zachowaniem trzymiesięcznego okresu wypowiedzenia ze skutkiem na koniec miesiąca kalendarzowego.
- p: 87
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 23, bold: true}]}
  text: 'Udzielający zamówienia może rozwiązać umowę ze skutkiem natychmiastowym w przypadku:'
- p: 88
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}, spans: [{start: 44, end: 68, bold: true}]}
  text: rażącego naruszenia postanowień umowy przez Przyjmującego zamówienie,
- p: 89
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}, spans: [{start: 14, end: 38, bold: true}]}
  text: stawienia się Przyjmującego zamówienie do udzielania świadczeń w stanie nietrzeźwości,
- p: 90
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}, spans: [{start: 19, end: 43, bold: true}]}
  text: brak stawienia się Przyjmującego zamówienie do udzielania świadczeń zgodnie z harmonogramem,
- p: 91
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}, spans: [{start: 12, end: 36, bold: true}, {start: 118,
        end: 142, bold: true}]}
  text: Pozbawienie Przyjmującego zamówienie uprawnień zawodowych, zawieszenie lub zamknięcie działalności gospodarczej przez Przyjmującego zamówienie.
- p: 92
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie może rozwiązać umowę ze skutkiem natychmiastowym w przypadku opóźnień w płatności wynagrodzenia, o którym mowa
    w § 7, trwających przez co najmniej dwa pełne okresy płatności.
- p: 93
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 26, end: 48, bold: true}, {start: 89,
        end: 113, bold: true}]}
  text: W razie rozwiązania umowy Przyjmujący zamówienie zobowiązany jest niezwłocznie przekazać Udzielającemu zamówienie wszelką dokumentację
    medyczną oraz wszelkie inne dokumenty, jakie sporządził, zebrał, opracował lub otrzymał w trakcie trwania umowy w związku z jej wykonaniem.
- p: 94
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Wypowiedzenie lub rozwiązanie niniejszej umowy powinno nastąpić w formie pisemnej pod rygorem nieważności.
- {p: 95, role: spacer}
- p: 96
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 11, kind: paragraph, src: manual, level: 0}}
  text: § 11
- p: 97
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 55,
        end: 79, bold: true}, {start: 300, end: 324, bold: true}]}
  text: Udzielający zamówienia, w trybie art. 28 RODO powierza Przyjmującemu zamówienie dane osobowe, tj. dokumentacja medyczna indywidualna,
    dokumentacja medyczna zbiorcza, dokumentacja ambulatoryjna indywidualna, dokumentacja ambulatoryjna zbiorcza w celu realizacji umowy wykonywania
    usług medycznych dla Udzielającego zamówienia.
- p: 98
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie zapewnia przestrzeganie zasad przetwarzania i ochrony danych osobowych zgodnie z przepisami ustawy o ochronie danych
    osobowych, a od 25 maja 2018 r., RODO oraz wydanymi na jego podstawie krajowymi przepisami z zakresu ochrony danych osobowych.
- p: 99
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: 'Przyjmujący zamówienie będzie przetwarzał powierzone na podstawie umowy następujące rodzaje danych osobowych: szczególne oraz dane dotyczące
    pacjentów, w postaci imion, nazwisk, nr PESEL, adresu zamieszkania, stanu zdrowia, oraz danych w dokumentacji medycznej wyłącznie w ww. celu.'
- p: 100
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się dołożyć należytej staranności przy przetwarzaniu powierzonych danych osobowych.
- p: 101
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: 'Przyjmujący zamówienie zobowiązuje się do zachowania w tajemnicy, o której mowa w art. 28 ust. 3 lit. b RODO, danych przetwarzanych w
    zakresie obowiązywania niniejszej umowy,

    a w szczególności  nieudostępniania ich innym podmiotom, także w postaci zagregowanych danych statystycznych, zarówno podczas trwania umowy,
    jak i po jej ustaniu.'
- p: 102
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: "Przyjmujący zamówienie jest odpowiedzialny za przetwarzanie danych osobowych niezgodnie \nz treścią umowy, RODO lub wydanymi na jego\
    \ podstawie krajowymi przepisami z zakresu ochrony danych osobowych, a w szczególności za udostępnienie powierzonych do przetwarzania danych\
    \ osobowych osobom nieupoważnionym."
- {p: 103, role: spacer}
- p: 104
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 12, kind: paragraph, src: manual, level: 0}}
  text: § 12
- p: 105
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Zmiany umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 106
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych niniejszą umową mają zastosowanie przepisy ustawy z dnia 23 kwietnia 1964 r. Kodeks cywilny i innych przepisów
    powszechnie obowiązujących, w tym z zakresu ochrony zdrowia.
- p: 107
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 145, end: 170, bold: true}]}
  text: 'Ewentualne spory mogące wyniknąć przy realizacji umowy, rozstrzygane będą przez właściwy miejscowo sąd powszechny ze względu na miejsce
    siedziby Udzielającego zamówienia. '
- p: 108
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Umowę sporządzono w 2 (dwóch) jednobrzmiących egzemplarzach, po 1 (jednym) egzemplarzu dla każdej ze Stron.
