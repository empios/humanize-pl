  text: Dniem płatności jest dzień obciążenia rachunku bankowego Udzielającego zamówienia.
- {p: 74, role: spacer}
- p: 75
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- p: 76
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie zobowiązany jest do udzielania organom kontrolnym Narodowego Funduszu Zdrowia oraz innych uprawnionych do kontroli
    podmiotom, wszelkich niezbędnych informacji i wyjaśnień związanych z wykonywaniem niniejszej umowy w terminie wyznaczonym przez Narodowy Fundusz
    Zdrowia lub inne uprawnione podmioty.
- p: 77
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 34,
        end: 58, bold: true}]}
  text: 'Przyjmujący zamówienie przedstawi Udzielającemu zamówienia na jego żądanie wszelkie informacje związane z:'
- p: 78
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: udzielonymi na podstawie niniejszej umowy świadczeniami zdrowotnymi;
- p: 79
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}, spans: [{start: 62, end: 87, bold: true}]}
  text: prowadzeniem wymaganej przepisami prawa i aktami wewnętrznymi Udzielającego zamówienia dokumentacji medycznej;
- p: 80
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}, spans: [{start: 24, end: 48, bold: true}]}
  text: gospodarowaniem mieniem Udzielającego zamówienia, w tym lekami, materiałami opatrunkowymi i pozostałymi materiałami.
- {p: 81, role: spacer}
- p: 82
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 83
  role: body
  layout: {align: justify, size: 10.0}
  text: Umowa jest zawarta na czas nieokreślony i wchodzi w życie w dniu …………… / określony i obowiązuje od dnia ……………… r. do dnia …………………… r.
