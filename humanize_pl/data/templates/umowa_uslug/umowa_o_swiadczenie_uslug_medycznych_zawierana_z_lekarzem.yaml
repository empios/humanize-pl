- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 35,
        end: 57, bold: true}, {start: 163, end: 187, bold: true}]}
  text: Udzielający zamówienia powierza, a Przyjmujący zamówienie przyjmuje do wykonania udzielanie świadczeń zdrowotnych w zakresie ……………………………………
    w podmiocie leczniczym Udzielającego zamówienia przy ul. ……………………………… w ……...................
  slots:
  - {id: p21_1, span: [125, 139], type: text, context: świadczeń zdrowotnych w zakresie ▢ w podmiocie}
  - {id: p21_2, span: [197, 209], type: address, context: Udzielającego zamówienia przy ul. ▢ w}
  - {id: p21_3, span: [212, 233], type: place, context: zamówienia przy ul. w ▢}
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 157, end: 182, bold: true}]}
  text: Miejscem udzielania świadczeń zdrowotnych objętych przedmiotem niniejszej umowy jest miejsce wezwania – miejsce, w którym znajduje się
    pacjent poza siedzibą Udzielającego zamówienia.
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "[opcjonalnie] Zakres świadczeń zdrowotnych wykonywanych w ramach umowy określony został \nw załączniku nr 1 do niniejszej umowy — stanowiącym\
    \ jej integralną część."
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 124,
        end: 148, bold: true}, {start: 220, end: 243, bold: true}, {start: 298, end: 322, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się do zapewnienia wykonywania świadczeń zdrowotnych w formie stacjonarnej poza siedzibą Udzielającego
    zamówienia zgodnie z comiesięcznym harmonogramem (grafikiem) ustalonym wspólnie z Udzielającym zamówienia i ustalonymi w tym zakresie zasadami
    obowiązującymi u Udzielającego zamówienie.
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 24, bold: true}]}
  text: Przyjmującemu zamówienie przysługuje możliwość nieświadczenia usług objętych niniejszą umową przez okres do ……………………… dni roboczych rocznie
    z zachowaniem prawa do wynagrodzenia w wysokości odpowiadającej……….. godzinom świadczenia usług (wg wynagrodzenia z § 7 ust. 1 umowy za świadczenie
    usług medycznych) za jeden dzień możliwości nieświadczenia usług.
  slots:
  - {id: p25_1, span: [108, 117], type: date, context: umową przez okres do ▢ dni roboczych}
  - {id: p25_2, span: [203, 208], type: text, context: wynagrodzenia w wysokości odpowiadającej ▢ godzinom świadczenia}
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 43, end: 65, bold: true}, {start: 112,
        end: 136, bold: true}, {start: 315, end: 340, bold: true}, {start: 402, end: 426, bold: true}, {start: 427, end: 450, bold: true}]}
  text: "W celu ustalenia dni nieświadczenia usług, Przyjmujący zamówienie jest zobowiązany złożyć pisemną informację do Udzielającego zamówienia\
    \ ze wskazaniem, w jakich dniach dni nieświadczenia usług miałyby przypadać, co najmniej na 14 dni przed planowaną datą ich wykorzystania.\
    \ Ustalenie dni nieświadczenia usług przez Przyjmującego zamówienie  \nw sposób określony w zdaniu poprzedzającym jest wiążące dla Udzielającego\
    \ zamówienia. Udzielający zamówienia może wedle swobodnego uznania wyrazić zgodę na dni wolne jedynie w przypadku, gdy wniosek zostanie złożony\
    \ z naruszeniem 14-dniowego terminu określonego\nw zdaniu pierwszym."
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}, spans: [{start: 70, end: 94, bold: true}, {start: 320,
        end: 345, bold: true}]}
  text: Za niewykorzystane w danym roku kalendarzowym dni wskazanych w ust. 6 Przyjmującemu zamówienie przysługuje ekwiwalent pieniężny obliczany
    zgodnie z ust. 6. Ekwiwalent będzie wypłacany łącznie z wynagrodzeniem za miesiąc styczeń roku następnego po roku, w którym niewykorzystane
    dni, o których mowa powyżej przysługiwały Przyjmującemu zamówienie.
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}, spans: [{start: 58, end: 80, bold: true}]}
  text: Świadczenia zdrowotne objęte przedmiotem niniejszej Umowy Przyjmujący zamówienie zobowiązuje się wykonywać z najwyższą starannością, zgodnie
    ze wskazaniami aktualnej wiedzy medycznej, dostępnymi metodami i środkami zapobiegania, rozpoznawania i leczenia chorób, respektując prawa
    pacjenta oraz zgodnie z zasadami etyki zawodowej.
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '9.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 193,
        end: 215, bold: true}]}
  text: Przyjmujący zamówienie będzie udzielać świadczeń będących przedmiotem niniejszej umowy za pomocą własnego sprzętu i aparatury medycznej,
    których stan jest zgodny z wymogami BHP i co do którego Przyjmujący zamówienie posiada niezbędne certyfikaty.
- {p: 30, role: spacer}
- p: 31
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 47, end: 69, bold: true}]}
  text: Świadczenia zdrowotne będące przedmiotem umowy Przyjmujący zamówienie zobowiązuje się wykonać w szczególności zgodnie zasadami przyjętymi
    w zakresie czynności wykonywanych przez lekarza specjalistę.
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie dołoży starań zmierzających do stałego podnoszenia swoich kwalifikacji zawodowych, w tym uzupełniania wiedzy medycznej
    o aktualne wskazania.
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 64, end: 86, bold: true}, {start: 155,
        end: 179, bold: true}]}
  text: W czasie wykonywania obowiązków wynikających z niniejszej umowy Przyjmujący zamówienie może opuścić miejsce wykonywania tych obowiązków
    po uzyskaniu zgody Udzielającego zamówienia lub osoby przez niego wskazanej.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 147,
        end: 171, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się zapoznać ze wszystkimi regulaminami, zarządzeniami oraz innymi aktami wewnętrznymi przedstawionymi
    mu przez Udzielającego zamówienia związanymi z wykonywaniem niniejszej umowy.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 23, bold: true}, {start: 212,
        end: 234, bold: true}]}
  text: 'Przyjmujący zamówienie zaopatruje się na swój koszt w odpowiednią ilość podstawowej odzieży ochronnej oraz obuwie robocze wymagane do
    świadczenia usług wskazanych w § 1. zgodne z przepisami prawa w tym zakresie. Przyjmujący zamówienie jest obowiązany do noszenia tej odzieży
    i obuwia przy świadczeniu tych usług. '
- {p: 37, role: spacer}
- p: 38
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 39
  role: body
  layout: {align: justify, size: 10.0, spans: [{start: 0, end: 22, bold: true}, {start: 36, end: 61, bold: true}]}
  text: 'Przyjmujący zamówienie ponosi wobec Udzielającego zamówienia odpowiedzialność za udzielanie lub zaniechanie wykonywania przez siebie
    świadczeń zdrowotnych do wysokości sumy gwarancyjnej posiadanego przez siebie obowiązkowego ubezpieczenia OC, chyba, że szkoda powstała z
    wyłącznej winy lub rażącego niedbalstwa Przyjmującego zamówienie – w takich sytuacjach jego odpowiedzialność jest nielimitowana kwotowo. '
- {p: 40, role: spacer}
- {p: 41, role: spacer}
- p: 42
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- p: 43
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się do wykonywania przedmiotu niniejszej umowy osobiście, z zastrzeżeniem postanowień poniższych.
- p: 44
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 74, end: 96, bold: true}, {start: 148,
        end: 172, bold: true}]}
  text: W razie wystąpienia potrzeby ustanowienia zastępstwa, przez osobę trzecią Przyjmujący zamówienie zobowiązany jest o tym fakcie powiadomić
    na piśmie Udzielającego zamówienia z co najmniej 2-dniowym wyprzedzeniem z jednoczesnym wskazaniem osoby zastępującej.
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 118, end: 142, bold: true}, {
        start: 144, end: 166, bold: true}, {start: 290, end: 314, bold: true}]}
  text: 'W razie wystąpienia potrzeby ustanowienia zastępstwa przez osobę trzecią, która była niemożliwa do przewidzenia przez Przyjmującego zamówienie,
    Przyjmujący zamówienie zobowiązany jest o tym fakcie powiadomić możliwie jak najszybciej telefonicznie lub mailowo lub o ile to możliwe na
    piśmie Udzielającego zamówienia z jednoczesnym wskazaniem osoby zastępującej. '
- p: 46
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 200, end: 224, bold: true}]}
  text: Osoba zastępująca powinna posiadać wszystkie niezbędne kwalifikacje wymagane do wykonywania świadczeń zdrowotnych objętych przedmiotem
    niniejszej umowy, nie mniejsze od kwalifikacji posiadanych przez Przyjmującego zamówienie.
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 78, end: 100, bold: true}]}
  text: Wszelkie roszczenia związane z działaniami i zaniechaniami osoby zastępującej Udzielający zamówienia zobowiązuje się kierować bezpośrednio
    do osoby zastępującej.
- p: 48
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 149,
        end: 173, bold: true}, {start: 213, end: 237, bold: true}]}
  text: Przyjmujący zamówienie wykonuje wynikające z niniejszej umowy zobowiązania w sposób samodzielny, bez bezpośredniego nadzoru i kierownictwa
    ze strony Udzielającego zamówienia, z zastrzeżeniem uprawnień kontrolnych Udzielającego zamówienia.
- {p: 49, role: spacer}
- p: 50
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
  text: § 5
- p: 51
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Przyjmujący zamówienie zobowiązuje się do:'
- p: 52
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}, spans: [{start: 329, end: 353, bold: true}]}
  text: "prowadzenia i udostępniania dokumentacji medycznej zgodnie z obowiązującymi w tym zakresie przepisami prawa, w szczególności rozporządzeniem\
    \ Ministra Zdrowia z dnia\n6 kwietnia 2020 r. w sprawie rodzajów, zakresu i wzorów dokumentacji medycznej oraz sposobu jej przetwarzania (t.j.\
    \ Dz.U.2024.798) oraz zgodnie z obowiązującymi \nu Udzielającego zamówienia zasadami i wzorami;"
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: 'do znajomości i przestrzegania przepisów określających prawa pacjenta w tym ustawy

    z dnia 6 listopada 2008 r. o prawach pacjenta i Rzeczniku Praw Pacjenta (t.j. Dz.U.2024.581);'
- p: 54
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}, spans: [{start: 89, end: 113, bold: true}]}
  text: znajomości i przestrzegania standardów udzielania świadczeń zdrowotnych ustalanych przez Udzielającego zamówienia;
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}, spans: [{start: 41, end: 65, bold: true}]}
  text: stosowania się do zarządzeń wewnętrznych Udzielającego zamówienia o charakterze porządkowym i organizacyjnym;
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
  text: przestrzegania przepisów rozporządzenia Parlamentu Europejskiego i Rady (UE) 2016/679 z dnia 27 kwietnia 2016 r. w sprawie ochrony osób
    fizycznych w związku z przetwarzaniem danych osobowych i w sprawie swobodnego przepływu takich danych oraz uchylenia dyrektywy 95/46/WE (ogólne
    rozporządzenie o ochronie danych) (dalej jako RODO);
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 6), kind: decimal, src: auto, level: 0}, spans: [{start: 118, end: 142, bold: true}]}
  text: do współpracy z lekarzami, pielęgniarkami, pielęgniarzami i innymi osobami udzielającymi świadczeń na rzecz pacjentów Udzielającego zamówienia
    w czasie realizacji umowy.
- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 65, end: 87, bold: true}]}
  text: Właścicielem dokumentacji, o której mowa w § 5 ust. 1 pkt 1 jest Udzielający zamówienia.
- {p: 59, role: spacer}
- p: 60
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 61
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie zobowiązany jest do utrzymywania ważnego ubezpieczenia odpowiedzialności cywilnej, w tym zakresie oraz nie zmniejszania
    jego zakresu, w stosunku do przedłożonej wraz z Umową polisy.
- p: 62
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: 'Przyjmujący zamówienie zobowiązany jest do posiadania praktycznej książeczki zdrowia

    i aktualnych badań profilaktycznych. '
- p: 63
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 69,
        end: 94, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się do aktualizowania, na żądanie Udzielającego zamówienia, dokumentów wskazanych w ust. 1 poprzez
    dostarczenie ich kopii.
- {p: 64, role: spacer}
- p: 65
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- p: 66
