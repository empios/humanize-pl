  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 186, end: 210, bold: true}, {
        start: 217, end: 241, bold: true}]}
  text: Wynagrodzenie obliczone na podstawie ust. 1, wypłacane będzie comiesięcznie, w terminie do ………… dnia miesiąca następującego po zakończonym
    miesiącu rozliczeniowym, na podstawie złożonej Udzielającemu zamówienia przez Przyjmującego zamówienie prawidłowo wystawionej faktury za wykonane
    świadczenia, najpóźniej do …… dnia miesiąca następującego po miesiącu rozliczeniowym.
  slots:
