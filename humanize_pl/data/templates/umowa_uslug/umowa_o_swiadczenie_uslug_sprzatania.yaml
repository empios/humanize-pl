  layout: {align: justify, size: 10.0, spans: [{start: 111, end: 125, bold: true}]}
  text: Przedmiotem umowy jest świadczenie usług sprzątania nieruchomości położonej przy ul. …………………………… (zwanej dalej Nieruchomością) przez Zleceniobiorcę
    na rzecz Zleceniodawcy.
  slots:
  - {id: zwanej_dalej_nieruchomoscia, span: [85, 96], type: address, hint: zwanej dalej Nieruchomością}
  inline_hints:
