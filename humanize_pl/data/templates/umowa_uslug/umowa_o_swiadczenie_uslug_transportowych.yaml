- p: 58
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Strony ustalają miesiąc kalendarzowy jako okres rozliczeniowy.
- p: 59
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 184, end: 208, bold: true}, {
        start: 215, end: 239, bold: true}]}
  text: Wynagrodzenie obliczone na podstawie ust. 1, wypłacane będzie comiesięcznie, w terminie do 10 dnia miesiąca następującego po zakończonym
    miesiącu rozliczeniowym, na podstawie złożonej Udzielającemu zamówienia przez Przyjmującego zamówienie prawidłowo wystawionego rachunku za
    wykonane usługi, najpóźniej do 5 dnia miesiąca następującego po miesiącu rozliczeniowym.
- p: 60
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 57, end: 82, bold: true}]}
  text: Należność wypłacana będzie przelewem na rachunek bankowy Przyjmującego zamówienie wskazany w fakturze/rachunku.
- p: 61
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 57, end: 82, bold: true}]}
  text: Dniem płatności jest dzień obciążenia rachunku bankowego Udzielającego  zamówienie.
- {p: 62, role: spacer}
- p: 63
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6., kind: paragraph, src: manual, level: 0}}
  text: § 6.
- {p: 64, role: spacer}
- p: 65
