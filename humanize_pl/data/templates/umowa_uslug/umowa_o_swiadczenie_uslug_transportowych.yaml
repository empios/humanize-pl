- {p: 21, role: spacer}
- p: 22
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 1., kind: paragraph, src: manual, level: 0}}
  text: § 1.
- {p: 23, role: spacer}
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 35,
        end: 57, bold: true}, {start: 182, end: 206, bold: true}]}
  text: Udzielający zamówienia powierza, a Przyjmujący zamówienie przyjmuje do wykonania usługi transportowe w zakresie dostarczania oraz odbioru
    towaru w czasie i miejscu wyznaczonym przez Udzielającego zamówienia.
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Miejscem świadczenia usług objętych przedmiotem niniejszej umowy jest terytorium Rzeczpospolitej Polskiej.
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zakres usług wykonywanych w ramach umowy określony został w załączniku nr 1 do niniejszej umowy — stanowiącym jej integralną część.
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 132,
        end: 155, bold: true}]}
  text: "Przyjmujący zamówienie zobowiązuje się do zapewnienia wykonywania usług zgodnie \nz harmonogramem, w terminach ustalonych wspólnie z\
    \ Udzielającym zamówienia."
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 56,
        end: 80, bold: true}, {start: 322, end: 344, bold: true}, {start: 438, end: 462, bold: true}]}
  text: "Udzielający zamówienia zobowiązuje się do powiadamiania Przyjmującego zamówienie o zapotrzebowaniu na świadczenie konkretnej usługi transportu\
    \ z co najmniej z 24-godzinnym wyprzedzeniem. W uzasadnionych przypadkach powiadomienie takie może zostać dokonane \nw terminie krótszym,\
    \ aniżeli wskazany powyżej. W takim przypadku Przyjmujący zamówienie dołoży wszelkich starań aby spełnić świadczenie przy użyciu pojazdów\
    \ spełniających wymagania Udzielającego zamówienia."
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 31,
        end: 55, bold: true}]}
  text: Udzielający zamówienia zapewni Przyjmującemu zamówienie pojazdy do wykonania umowy wraz z niezbędnymi dokumentami i jednocześnie zobowiązuje
    się, że pojazdy te będą spełniały wszelkie wymogi techniczne i prawne.
- {p: 30, role: spacer}
- p: 31
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2., kind: paragraph, src: manual, level: 0}}
  text: § 2.
- {p: 32, role: spacer}
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 45, end: 67, bold: true}]}
  text: Usługi transportowe będące przedmiotem umowy Przyjmujący zamówienie zobowiązuje się wykonać w szczególności zgodnie z zasadami przyjętymi
    w zakresie czynności wykonywanych przez zawodowego kierowcę.
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 147,
        end: 171, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się zapoznać ze wszystkimi regulaminami, zarządzeniami oraz innymi aktami wewnętrznymi przedstawionymi
    mu przez Udzielającego zamówienie związanymi z wykonywaniem niniejszej umowy oraz stosować się do ich zapisów.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: 'Przyjmujący zamówienie zapewni na swój koszt odpowiednią ilość podstawowej odzieży oraz obuwie robocze wymagane do świadczenia usług
    wskazanych w § 1. '
- {p: 36, role: spacer}
- p: 37
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3., kind: paragraph, src: manual, level: 0}}
  text: § 3.
- {p: 38, role: spacer}
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 36,
        end: 61, bold: true}]}
  text: Przyjmujący zamówienie ponosi wobec Udzielającego zamówienia odpowiedzialność za udzielanie lub zaniechanie wykonywania przez siebie usług
    w pełnej wysokości.
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 121,
        end: 145, bold: true}]}
  text: Przyjmujący zamówienie ponosi odpowiedzialność materialną za szkody powstałe z jego winy w sprzęcie będącym w posiadaniu Udzielającego
    zamówienia.
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 101,
        end: 125, bold: true}]}
  text: Przyjmujący zamówienie obowiązany jest do niezwłocznego zgłoszenia właściwym komórkom organizacyjnym Udzielającego zamówienie wszelkich
    stwierdzonych uszkodzeń sprzętu, a w szczególności pojazdów — przed przystąpieniem do ich użytkowania oraz awarii, które wystąpiły w trakcie
    użytkowania.
- {p: 42, role: spacer}
- p: 43
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4., kind: paragraph, src: manual, level: 0}}
  text: § 4.
- {p: 44, role: spacer}
- p: 45
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się do wykonywania przedmiotu niniejszej umowy osobiście, z zastrzeżeniem postanowień poniższych.
- p: 46
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 74, end: 96, bold: true}, {start: 148,
        end: 172, bold: true}]}
  text: W razie wystąpienia potrzeby ustanowienia zastępstwa, przez osobę trzecią Przyjmujący zamówienie zobowiązany jest o tym fakcie powiadomić
    na piśmie Udzielającego zamówienia z co najmniej 7-dniowym wyprzedzeniem z jednoczesnym wskazaniem osoby zastępującej.
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 118, end: 142, bold: true}, {
        start: 144, end: 166, bold: true}, {start: 290, end: 314, bold: true}]}
  text: W razie wystąpienia potrzeby ustanowienia zastępstwa przez osobę trzecią, która była niemożliwa do przewidzenia przez Przyjmującego zamówienie,
    Przyjmujący zamówienie zobowiązany jest o tym fakcie powiadomić możliwie jak najszybciej telefonicznie lub mailowo lub o ile to możliwe na
    piśmie Udzielającego zamówienia z jednoczesnym wskazaniem osoby zastępującej.
- p: 48
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 199, end: 223, bold: true}]}
  text: Osoba zastępująca powinna posiadać wszystkie niezbędne kwalifikacje wymagane do wykonywania usług transportowych objętych przedmiotem
    niniejszej umowy, nie mniejsze od kwalifikacji posiadanych przez Przyjmującego zamówienie.
- p: 49
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: "Przyjmujący zamówienie odpowiada za wszelkie roszczenia związane z działaniami \ni zaniechaniami osoby zastępującej jak za działania\
    \ własne."
- p: 50
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}, {start: 149,
        end: 173, bold: true}, {start: 213, end: 237, bold: true}]}
  text: Przyjmujący zamówienie wykonuje wynikające z niniejszej umowy zobowiązania w sposób samodzielny, bez bezpośredniego nadzoru i kierownictwa
    ze strony Udzielającego zamówienia, z zastrzeżeniem uprawnień kontrolnych Udzielającego Zamówienie.
- {p: 51, role: spacer}
- p: 52
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5., kind: paragraph, src: manual, level: 0}}
  text: § 5.
