  layout: {align: justify, size: 10.0, spans: [{start: 0, end: 22, bold: true}, {start: 34, end: 58, bold: true}]}
  text: 'Przyjmujący zamówienie przedstawi Udzielającemu zamówienie na jego żądanie wszelkie informacje związane z:'
- p: 66
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
