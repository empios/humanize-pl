- {p: 73, role: spacer}
- p: 74
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8., kind: paragraph, src: manual, level: 0}}
  text: § 8.
- {p: 75, role: spacer}
- p: 76
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 7, bold: true}]}
  text: Strony mogą rozwiązać umowę z zachowaniem jednomiesięcznego okresu wypowiedzenia ze skutkiem na koniec miesiąca kalendarzowego.
- p: 77
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 26, end: 48, bold: true}, {start: 89,
        end: 113, bold: true}]}
  text: "W razie rozwiązania umowy Przyjmujący zamówienie zobowiązany jest niezwłocznie przekazać Udzielającemu zamówienie wszelkie dokumenty\
    \ jakie zebrał lub otrzymał \nw trakcie trwania umowy w związku z jej wykonaniem."
- {p: 78, role: spacer}
- p: 79
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9., kind: paragraph, src: manual, level: 0}}
  text: § 9.
- {p: 80, role: spacer}
- p: 81
  role: body
  layout: {align: justify, size: 10.0, spans: [{start: 59, end: 81, bold: true}, {start: 158, end: 182, bold: true}, {start: 320, end: 342, bold: true}]}
  text: W trakcie obowiązywania umowy, a także po jej rozwiązaniu, Przyjmujący zamówienie zobowiązany jest do zachowania w tajemnicy wszelkich
    informacji dotyczących Udzielającego Zamówienie, jego organizacji, działalności handlowej, finansów, transakcji, tajemnic handlowych, służbowych
    oraz wszelkich innych danych, o których Przyjmujący zamówienie dowiedział się w związku z wykonywaną pracą.
- p: 82
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10., kind: paragraph, src: manual, level: 0}}
  text: § 10.
- {p: 83, role: spacer}
- p: 84
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Strony zgodnie oświadczają, że ich wolą nie jest nawiązanie stosunku pracy.
- p: 85
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 22, bold: true}]}
  text: Przyjmujący zamówienie zobowiązuje się wykonywać powierzone czynności z należytą starannością.
- p: 86
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Zmiany umowy oraz jej rozwiązanie wymagają formy pisemnej pod rygorem nieważności.
- p: 87
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 137, end: 161, bold: true}]}
  text: Ewentualne spory mogące wyniknąć przy realizacji umowy, rozstrzygane będą przez właściwy miejscowo sąd powszechny ze względu na siedzibę
    Udzielającego zamówienie.
