  - {id: p70_2, span: [140, 150], type: amount, context: wynagrodzenie w kwocie słownie ▢ złotych brutto}
- p: 71
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Strony ustalają miesiąc kalendarzowy jako okres rozliczeniowy.
- p: 72
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Wynagrodzenie, o którym mowa w § 6 ust. 1 płatne będzie do ……… dnia każdego miesiąca,

    za miesiąc poprzedni.'
  slots:
  - {id: p72_1, span: [59, 62], type: date, context: 1 płatne będzie do ▢ dnia każdego}
- p: 73
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 86, end: 97, bold: true}]}
  text: Płatność wynagrodzenia, o którym mowa w § 6 ust. 3 nastąpi przelewem na konto bankowe Usługodawcy o numerze …………………………………………………………… .
  slots:
  - {id: p73_1, span: [108, 131], type: text, context: bankowe Usługodawcy o numerze ▢}
- p: 74
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 76, end: 88, bold: true}]}
  text: Zapłata jest uważana za dokonaną z chwilą zaksięgowania środków na rachunku Usługodawcy.
- {p: 75, role: spacer}
- p: 76
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- p: 77
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 31, end: 42, bold: true}, {start: 119,
        end: 133, bold: true}, {start: 269, end: 280, bold: true}]}
  text: W trakcie obowiązywania umowy, Usługodawca zobowiązany jest do zachowania w tajemnicy wszelkich informacji dotyczących Usługobiorcy, jego
    organizacji, działalności handlowej, finansów, transakcji, tajemnic handlowych, służbowych oraz wszelkich innych danych, o których Usługodawca
    dowiedział się w związku ze świadczeniem usług.
- p: 78
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 30, end: 41, bold: true}, {start: 68,
        end: 80, bold: true}]}
  text: W przypadku rozwiązania umowy Usługodawca zobowiązuje się do zwrotu Usługobiorcy najpóźniej w dniu rozwiązania umowy wszelkich dokumentów
    i innych materiałów dotyczących tajemnicy przedsiębiorstwa, jakie sporządził, zebrał, opracował lub otrzymał w czasie trwania umowy albo w
    związku lub przy okazji jej wykonywania.
- {p: 79, role: spacer}
- p: 80
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- p: 81
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Strony zgodnie oświadczają, że ich wolą nie jest nawiązanie stosunku pracy.
- p: 82
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}]}
  text: Usługodawca zobowiązuje się wykonywać powierzone czynności z należytą starannością.
- p: 83
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 51, end: 62, bold: true}, {start: 109,
        end: 122, bold: true}]}
  text: W razie niemożności dokonania określonej czynności Usługodawca obowiązany jest niezwłocznie powiadomić o tym Usługobiorcę.
- {p: 84, role: spacer}
- p: 85
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 86
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}, {start: 121,
        end: 133, bold: true}]}
  text: 'Usługodawca wyraża zgodę na przetwarzanie jego danych osobowych, określonych w komparycji  umowy oraz w jej treści przez Usługobiorcę,
    w celu i na okres realizacji umowy, zgodnie

    z postanowieniami niniejszego paragrafu.'
- p: 87
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: "Przetwarzanie danych osobowych z tytułu niniejszej umowy odbywać się będzie w zgodzie \ni w oparciu o przepisy rozporządzenia Parlamentu\
    \ Europejskiego i Rady (EU) 2016/679 z dnia 27 kwietnia 2016 r. w sprawie ochrony osób fizycznych w związku z przetwarzaniem danych osobowych\
    \ i w sprawie swobodnego przepływu takich danych oraz uchylenia dyrektywy 95/46/WE (ogólne rozporządzenie o ochronie danych), zwane dalej\
    \ „RODO”."
- p: 88
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Cel i zakres powierzenia przetwarzania danych osobowych wynika bezpośrednio i ogranicza się wyłącznie do zdań wynikających z umowy. Na
    powyższych danych będą wykonywane

    w szczególności operacje: przechowywanie, transfer, utrwalanie, analizowanie, a także czynności polegające na tworzeniu kopii bezpieczeństwa
    oraz czynności związane z odtwarzaniem z kopii bezpieczeństwa.'
- p: 89
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Do przetwarzania danych osobowych mogą być dopuszczone wyłącznie osoby posiadające upoważnienie, o których mowa w art. 29 RODO oraz przeszkolone
    z zakresu przepisów dotyczących ochrony danych osobowych.
- {p: 90, role: spacer}
- p: 91
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 92
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany niniejszej umowy wymagają zachowania formy pisemnej pod rygorem nieważności.
- p: 93
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'Umowa została sporządzona w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze Stron. '
- p: 94
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych umową będą miały zastosowanie przepisy ustawy z dnia 23 kwietnia 1964 r. – Kodeks cywilny, ustawy z dnia 6
    września 2001 r. – Prawo farmaceutyczne oraz inne przepisy powszechnie obowiązującego prawa.
- p: 95
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 135, end: 147, bold: true}]}
  text: Wszelkie spory, jakie mogą wyniknąć w związku z niniejszą umową będą rozpatrywane przez sąd powszechny właściwy ze względu na siedzibę
    Usługodawcy.
