- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}]}
  text: Usługodawca oświadcza, iż posiada kwalifikacje uprawniające do pełnienia funkcji farmaceuty zgodnie z przepisami ustawy o izbach aptekarskich.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}, {start: 40,
        end: 52, bold: true}]}
  text: Usługodawca zobowiązany jest przedłożyć Usługobiorcy dokumenty potwierdzające kwalifikacje zawodowe o których mowa w § 2 ust. 1 przed
    zawarciem niniejszej umowy.
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Czynności wskazane w § 1 ust. 1 będą wykonywane w dni i godziny ustalone w miesięcznym harmonogramie, uzgodnionym przez Strony.
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 14, end: 25, bold: true}]}
  text: '[opcjonalnie] Usługodawca w zakresie funkcji farmaceuty pełnionej w Aptece może wykonywać umowę wyłącznie osobiście, z zastrzeżeniem
    § 2 ust. 5.'
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 46, end: 57, bold: true}, {start: 230,
        end: 241, bold: true}, {start: 266, end: 280, bold: true}, {start: 324, end: 337, bold: true}]}
  text: '[opcjonalnie] Na czas planowanej nieobecności Usługodawca obowiązany jest wyznaczyć zastępcę, spełniającego warunki wymagane do pełnienia
    funkcji farmaceuty zgodnie z przepisami ustawy Prawo farmaceutyczne. O wyznaczeniu zastępcy Usługodawca powiadamia niezwłocznie Usługobiorcę.
    Ustanowienie zastępstwa odbywa się na koszt Usługobiorcy.'
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: 'Strony mogą określić dodatkowe zasady wykonywania umowy, w drodze aneksu zawartego

    w formie pisemnej pod rygorem nieważności.'
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}]}
  text: Usługodawcy przysługuje możliwość nieświadczenia usług objętych niniejszą umową przez okres do ……………………… dni roboczych rocznie z zachowaniem
    prawa do wynagrodzenia w wysokości odpowiadającej……… godzinom świadczenia usług (według wynagrodzenia z § 6 ust. 1 umowy) za jeden dzień możliwości
    nieświadczenia usług.
  slots:
  - {id: p40_1, span: [95, 104], type: date, context: umową przez okres do ▢ dni roboczych}
  - {id: p40_2, span: [190, 193], type: text, context: wynagrodzenia w wysokości odpowiadającej ▢ godzinom świadczenia}
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}, spans: [{start: 43, end: 54, bold: true}, {start: 101,
        end: 113, bold: true}, {start: 292, end: 303, bold: true}, {start: 364, end: 376, bold: true}, {start: 378, end: 390, bold: true}]}
  text: W celu ustalenia dni nieświadczenia usług, Usługodawca jest zobowiązany złożyć pisemną informację do Usługobiorcy ze wskazaniem, w jakich
    dniach dni nieświadczenia usług miałyby przypadać, co najmniej na 14 dni przed planowaną datą ich wykorzystania. Ustalenie dni nieświadczenia
    usług przez Usługodawcę w sposób określony w zdaniu poprzedzającym jest wiążące dla Usługobiorcy. Usługobiorca może wedle swobodnego uznania
    wyrazić zgodę na dni wolne jedynie w przypadku, gdy wniosek zostanie złożony z naruszeniem 14-dniowego terminu określonego w zdaniu pierwszym.
- p: 42
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '9.', kind: decimal, src: auto, level: 0}, spans: [{start: 88, end: 99, bold: true}]}
  text: '[opcjonalnie] Za niewykorzystane w danym roku kalendarzowym dni wskazanych w § 2 ust. 7 Usługodawcy nie przysługuje ekwiwalent pieniężny.'
- {p: 43, role: spacer}
