- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}, {start: 103,
        end: 115, bold: true}, {start: 196, end: 208, bold: true}]}
  text: 'Usługodawca zobowiązuje się, w zakresie prowadzonej działalności gospodarczej, do świadczenia na rzecz Usługobiorcy usług polegających
    na wykonywaniu usług farmaceutycznych realizowanych w aptece Usługobiorcy (zwanej dalej Apteką), polegających w szczególności na:'
- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: 'wydawaniu produktów leczniczych i wyrobów medycznych; '
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: sporządzaniu leków recepturowych, w terminie nie dłuższym niż 48 godzin od złożenia recepty przez pacjenta, a w przypadku recepty na lek
    recepturowy zawierający środki odurzające lub oznaczonej "wydać natychmiast" - w ciągu 4 godzin;
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 3), kind: decimal, src: auto, level: 0}}
  text: sporządzeniu leków aptecznych;
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 4), kind: decimal, src: auto, level: 0}}
  text: udzielaniu informacji o produktach leczniczych i wyrobach medycznych;
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 5), kind: decimal, src: auto, level: 0}}
  text: …………………………………………………………
  slots:
