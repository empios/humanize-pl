    rocznie z zachowaniem prawa do wynagrodzenia w wysokości odpowiadającej …………… godzinom świadczenia usług (według wynagrodzenia z § 4 ust.
    1 umowy) za jeden dzień możliwości nieświadczenia usług.'
  slots:
  - {id: p52_1, span: [109, 118], type: date, context: umową przez okres do ▢ dni roboczych}
  - {id: p52_2, span: [205, 210], type: text, context: wynagrodzenia w wysokości odpowiadającej ▢ godzinom świadczenia}
- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 57, end: 68, bold: true}, {start: 115,
        end: 128, bold: true}, {start: 306, end: 318, bold: true}, {start: 378, end: 390, bold: true}]}
  text: '[opcjonalnie] W celu ustalenia dni nieświadczenia usług, Usługodawca jest zobowiązany złożyć pisemną informację do Usługobiorcy ze wskazaniem,
    w jakich dniach dni nieświadczenia usług miałyby przypadać, co najmniej na 14 dni przed planowaną datą ich wykorzystania. Ustalenie dni nieświadczenia
    usług przez Usługodawcę w sposób określony

    w zdaniu poprzedzającym jest wiążące dla Usługobiorcy, który może wedle swobodnego uznania wyrazić zgodę na dni wolne jedynie w przypadku,
    gdy wniosek zostanie złożony

    z naruszeniem 14-dniowego terminu określonego w zdaniu pierwszym.'
- {p: 54, role: spacer}
- p: 55
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 6, kind: paragraph, src: manual, level: 0}}
  text: § 6
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 28,
        end: 41, bold: true}, {start: 85, end: 97, bold: true}, {start: 152, end: 163, bold: true}, {start: 226, end: 238, bold: true}]}
  text: "Usługodawca ponosi względem Usługobiorcy odpowiedzialność za szkody poniesione przez Usługobiorcę, a spowodowane zawinionym działaniem\
    \ lub zaniechaniem Usługodawcy, \na w szczególności niedołożeniem należytej staranności przez Usługodawcę przy wykonywaniu czynności, o których\
    \ mowa w § 1 ust. 1."
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 208,
        end: 222, bold: true}]}
  text: Usługodawca zobowiązany jest do utrzymywania ważnego ubezpieczenia odpowiedzialności cywilnej, w tym zakresie oraz nie zmniejszania jego
    zakresu, w stosunku do przedłożonej wraz z umową polisy, która stanowi Załącznik nr 2 do niniejszej umowy.
- {p: 58, role: spacer}
- p: 59
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 7, kind: paragraph, src: manual, level: 0}}
  text: § 7
- p: 60
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 132,
        end: 144, bold: true}]}
  text: "Usługodawca wyraża zgodę na przetwarzanie jej danych osobowych, określonych \nw komparycji  niniejszej umowy oraz w jej treści przez\
    \ Usługobiorcę, w celu i na okres realizacji niniejszej umowy, zgodnie z postanowieniami niniejszego paragrafu."
- p: 61
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 432, end: 436, bold: true}]}
  text: "Przetwarzanie danych osobowych z tytułu niniejszej umowy odbywać się będzie w zgodzie \ni w oparciu o przepisy rozporządzenia Parlamentu\
    \ Europejskiego i Rady (EU) 2016/679 z dnia 27 kwietnia 2016 roku w sprawie ochrony osób fizycznych w związku z przetwarzaniem danych osobowych\
    \ i w sprawie swobodnego przepływu takich danych oraz uchylenia dyrektywy 95/46/WE (ogólne rozporządzenie o ochronie danych), zwanym w dalszej\
    \ części umowy RODO."
- p: 62
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "Cel i zakres powierzenia przetwarzania danych osobowych wynika bezpośrednio i ogranicza się wyłącznie do zadań wynikających z niniejszej\
    \ umowy. Na powyższych danych będą wykonywane w szczególności operacje: przechowywanie, transfer, utrwalanie, analizowanie, a także czynności\
    \ polegające na tworzeniu kopii bezpieczeństwa oraz czynności związane \nz odtwarzaniem z kopii bezpieczeństwa."
- p: 63
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 122, end: 126, bold: true}]}
  text: Do przetwarzania danych osobowych mogą być dopuszczone wyłącznie osoby posiadające upoważnienie, o których mowa w art. 29 RODO oraz przeszkolone
    z zakresu przepisów dotyczących ochrony danych osobowych.
- {p: 64, role: spacer}
- p: 65
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 8, kind: paragraph, src: manual, level: 0}}
  text: § 8
- p: 66
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 6, bold: true}]}
  text: Strony umowy mogą rozwiązać umowę z zachowaniem ………… okresu wypowiedzenia ze skutkiem na koniec miesiąca kalendarzowego.
  slots:
  - {id: p66_1, span: [48, 52], type: text, context: rozwiązać umowę z zachowaniem ▢ okresu wypowiedzenia}
- p: 67
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 26, end: 38, bold: true}, {start: 78,
        end: 91, bold: true}]}
  text: W razie rozwiązania umowy Usługodawca zobowiązany jest niezwłocznie przekazać Usługobiorcy wszelką dokumentację medyczną oraz wszelkie
    inne dokumenty jakie sporządził, zebrał, opracował lub otrzymał w trakcie trwania umowy w związku z jej wykonaniem.
- p: 68
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 13, bold: true}, {start: 104,
        end: 116, bold: true}, {start: 184, end: 197, bold: true}, {start: 203, end: 215, bold: true}]}
  text: Usługobiorca ma prawo rozwiązać umowę ze skutkiem natychmiastowym w przypadku rażącego naruszenia przez Usługodawcę postanowień § 1, §
    2 i § 3 umowy oraz w razie utraty zaufania przez Usługobiorcę wobec Usługodawcy.
- p: 69
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}]}
  text: Usługodawca może rozwiązać umowę ze skutkiem natychmiastowym z ważnych powodów, m.in. w przypadku opóźnienia w wypłacie wynagrodzenia
    trwającego ponad 1 miesiąc.
- p: 70
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Oświadczenie o wypowiedzeniu umowy i rozwiązaniu umowy wymaga dla swej ważności zachowania formy pisemnej.
- {p: 71, role: spacer}
- p: 72
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 9, kind: paragraph, src: manual, level: 0}}
  text: § 9
- p: 73
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 59, end: 71, bold: true}, {start: 147,
        end: 159, bold: true}, {start: 297, end: 309, bold: true}]}
  text: W trakcie obowiązywania umowy, a także po jej rozwiązaniu, Usługodawca zobowiązany jest do zachowania w tajemnicy wszelkich informacji
    dotyczących Usługobiorcy, jego organizacji, działalności handlowej, finansów, transakcji, tajemnic handlowych, służbowych oraz wszelkich innych
    danych, o których Usługodawca dowiedział się w związku z wykonywaną pracą.
- p: 74
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 30, end: 42, bold: true}, {start: 68,
        end: 81, bold: true}]}
  text: W przypadku rozwiązania umowy Usługodawca zobowiązuje się do zwrotu Usługobiorcy najpóźniej w dniu rozwiązania umowy wszelkich dokumentów
    i innych materiałów dotyczących tajemnicy przedsiębiorstwa, jakie sporządził, zebrał, opracował lub otrzymał w czasie trwania umowy albo w
    związku lub przy okazji jej wykonywania.
- {p: 75, role: spacer}
- p: 76
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 10, kind: paragraph, src: manual, level: 0}}
  text: § 10
- p: 77
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany niniejszej umowy wymagają zachowania formy pisemnej pod rygorem nieważności.
- p: 78
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 6, bold: true}]}
  text: Strony mogą określić aneksem w formie pisemnej dodatkowe zasady wykonywania umowy.
- p: 79
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 6, bold: true}]}
  text: Strony zgodnie oświadczają, że ich wolą nie jest nawiązanie stosunku pracy.
- p: 80
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: "W sprawach nieuregulowanych niniejszą umową mają zastosowanie przepisy ustawy z dnia \n23 kwietnia 1964 r. – Kodeks cywilny, ustawy z\
    \ dnia 15 kwietnia 2011 r. o działalności leczniczej, ustawy z dnia 25 września 2015 r. o zawodzie fizjoterapeuty a także inne przepisy powszechnie\
    \ obowiązującego prawa, w szczególności z zakresu ochrony zdrowia."
- p: 81
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 135, end: 148, bold: true}]}
  text: Wszelkie spory, jakie mogą wyniknąć w związku z niniejszą umową będą rozpatrywane przez sąd powszechny właściwy ze względu na siedzibę
    Usługobiorcy.
- p: 82
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}, spans: [{start: 81, end: 86, bold: true}]}
  text: Umowę sporządzono w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze Stron.
