- p: 24
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 144,
        end: 158, bold: true}]}
  text: Usługodawca oświadcza, iż posiada aktualne prawo wykonywania zawodu fizjoterapeuty, na dowód czego przedkłada stosowne poświadczenie stanowiące
    Załącznik nr 3 do umowy.
- p: 25
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 109, end: 115, bold: true}]}
  text: Świadczenia zdrowotne będą udzielane w dni i godziny ustalone w miesięcznym harmonogramie, uzgodnionym przez Strony.
- p: 26
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 13, bold: true}, {start: 95,
        end: 107, bold: true}, {start: 276, end: 288, bold: true}]}
  text: "Usługobiorca zapewnia pomieszczenia spełniające warunki sanitarno-epidemiologiczne, \nw których Usługodawca udzielać będzie świadczeń,\
    \ będących przedmiotem niniejszej umowy wraz z niezbędnym wyposażeniem w sprzęt i aparaturę medyczną, których stan jest zgodny \nz wymogami\
    \ BHP. Usługodawca oświadcza, że pomieszczenia, w których udzielać będzie świadczeń, będących przedmiotem niniejszej umowy oraz ich wyposażenie\
    \ w sprzęt i aparaturę medyczną, użytkować będzie zgodnie z przyjętymi zasadami w tym zakresie oraz zgodnie \nz obowiązującymi przepisami."
- {p: 27, role: spacer}
- p: 28
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 46, end: 59, bold: true}]}
  text: "Świadczenia zdrowotne będące przedmiotem umowy Usługodawca zobowiązuje się wykonać \nz najwyższą starannością, zgodnie ze wskazaniami\
    \ aktualnej wiedzy medycznej, dostępnymi metodami i środkami zapobiegania, rozpoznawania i leczenia chorób, respektując prawa pacjenta oraz\
    \ zgodnie z zasadami etyki zawodowej."
- p: 30
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}]}
  text: Usługodawca dołoży starań zmierzających do stałego podnoszenia swoich kwalifikacji zawodowych, w tym uzupełniania wiedzy medycznej o aktualne
    wskazania.
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 136,
        end: 150, bold: true}]}
  text: "Usługodawca zobowiązuje się zapoznać ze wszystkimi regulaminami, zarządzeniami oraz innymi aktami wewnętrznymi przedstawionymi mu przez\
    \ Usługobiorcę, związanymi \nz wykonywaniem niniejszej umowy oraz zobowiązuje się ich przestrzegać."
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 13, bold: true}, {start: 35,
        end: 47, bold: true}, {start: 227, end: 239, bold: true}]}
  text: 'Usługobiorca zapewni na swój koszt Usługodawcy odpowiednią ilość podstawowej odzieży ochronnej z identyfikatorem oraz obuwie robocze
    wymagane do wykonywania świadczeń wskazanych w § 1, zgodne z przepisami prawa w tym zakresie. Usługodawca jest obowiązany do noszenia tej
    odzieży i obuwia przy świadczeniu tych usług. '
- {p: 33, role: spacer}
- p: 34
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 51, end: 63, bold: true}, {start: 109,
        end: 121, bold: true}]}
  text: 'W razie niemożności dokonania określonej czynności Usługodawca obowiązany jest niezwłocznie powiadomić o tym Usługobiorcę. '
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 115,
        end: 128, bold: true}]}
  text: Usługodawca nie może powierzyć wykonania czynności objętych zleceniem osobom trzecim bez uprzedniej pisemnej zgody Usługobiorcy.
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}, spans: [{start: 74, end: 86, bold: true}, {start: 137,
        end: 150, bold: true}]}
  text: W razie wystąpienia potrzeby ustanowienia zastępstwa przez osobę trzecią, Usługodawca zobowiązany jest o tym fakcie powiadomić na piśmie
    Usługobiorcę z co najmniej …..-dniowym wyprzedzeniem z jednoczesnym wskazaniem osoby zastępującej.
  slots:
  - {id: p37_1, span: [164, 167], type: text, context: Usługobiorcę z co najmniej ▢ dniowym wyprzedzeniem}
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}, spans: [{start: 198, end: 210, bold: true}]}
  text: Osoba zastępująca powinna posiadać wszystkie niezbędne kwalifikacje wymagane do wykonywania świadczeń zdrowotnych objętych przedmiotem
    niniejszej umowy, nie gorsze od kwalifikacji posiadanych przez Usługodawcę.
- p: 39
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 12, bold: true}, {start: 121,
        end: 134, bold: true}]}
  text: "Usługodawca ponosi odpowiedzialność materialną za szkody powstałe z jego winy \nw sprzęcie medycznym będącym w posiadaniu Usługobiorcy."
