  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 0, end: 11, bold: true}, {start: 103,
        end: 115, bold: true}, {start: 199, end: 285, italic: true}]}
  text: "Usługodawca zobowiązuje się, w zakresie prowadzonej działalności gospodarczej, do świadczenia na rzecz Usługobiorcy usług polegających\
    \ udzielaniu świadczeń zdrowotnych \nw zakresie ……………………………………………… (należy wskazać jakie usługi będzie świadczył fizjoterapeuta w ramach współpracy\
    \ B2B)."
  slots:
  - {id: nalezy_wskazac_jakie_uslugi_bedzie_swiadczyl_fiz, span: [180, 198], type: text, hint: należy wskazać jakie usługi będzie świadczył fizjoterapeuta
      w ramach współpracy B2B}
  inline_hints:
  - {span: [199, 284], text: należy wskazać jakie usługi będzie świadczył fizjoterapeuta w ramach współpracy B2B}
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}, spans: [{start: 106, end: 140, italic: true},
      {start: 178, end: 191, italic: true}]}
  text: Miejscem udzielania świadczeń zdrowotnych objętych przedmiotem niniejszej umowy jest …………………………………………………. (określenie podmiotu leczniczego)
    przy ul. …………..……… w ……………………………... . (miejscowość)
  slots:
  - {id: okreslenie_podmiotu_leczniczego, span: [85, 105], type: text, hint: określenie podmiotu leczniczego}
  - {id: p23_2, span: [149, 158], type: address, context: umowy jest przy ul. ▢ w}
  - {id: miejscowosc_3, span: [161, 175], type: place, hint: miejscowość}
