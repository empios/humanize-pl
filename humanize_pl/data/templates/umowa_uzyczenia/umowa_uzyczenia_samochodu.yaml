- p: 53
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: 'Użyczający może w każdym czasie rozwiązać niniejszą umowę bez zachowania okresu wypowiedzenia w przypadku, gdy:'
- p: 54
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 1), kind: decimal, src: auto, level: 0}}
  text: 'Biorący używa Przedmiotu użyczenia w sposób niezgodny z przeznaczeniem; '
- p: 55
  role: item
  layout: {align: justify, size: 10.0, marker: {text: 2), kind: decimal, src: auto, level: 0}}
  text: Biorący oddał Przedmiot użyczenia w podnajem lub do używania osobie trzeciej bez zgody Użyczającego.
- p: 56
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '7.', kind: decimal, src: auto, level: 0}}
  text: 'Biorący ma prawo rozwiązać umowę bez zachowania okresu wypowiedzenia w przypadku, gdy Przedmiot użyczenia okaże się posiadać wady lub
    usterki uniemożliwiające korzystanie z niego zgodnie z przeznaczeniem. '
- p: 57
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '8.', kind: decimal, src: auto, level: 0}}
  text: Wypowiedzenie lub rozwiązanie umowy, pod rygorem nieważności, powinno być dokonane w formie pisemnej.
- {p: 58, role: spacer}
