  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Biorący zobowiązuje się zwrócić Przedmiot użyczenia najpóźniej w terminie …… dni od dnia wygaśnięcia lub rozwiązania umowy z jakiegokolwiek
    powodu. '
