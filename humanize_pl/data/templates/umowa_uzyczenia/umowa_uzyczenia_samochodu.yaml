  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie zmiany i uzupełnienia niniejszej umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 62
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych niniejszą umową zastosowanie znajdą przepisy ustawy z dnia 23 kwietnia 1964 r. - Kodeks cywilny.
- p: 63
  role: item
