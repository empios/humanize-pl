- p: 17
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Użyczający oświadcza, że Przedmiot użyczenia jest wolny od obciążeń na rzecz osób trzecich, które mogłyby utrudnić lub uniemożliwić wykonywanie
    Biorącemu w używanie uprawnień wynikających z niniejszej umowy.
- p: 18
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- {p: 19, role: spacer}
- p: 20
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 110, end: 187, italic: true}]}
  text: 'Użyczający użycza i daje w bezpłatne używanie Biorącemu Przedmiot użyczenia wraz z wyposażeniem: ……………………………… (opis wyposażenia, np.
    komplet kluczyków, dowód rejestracyjny, koło zapasowe).'
  slots:
  - {id: opis_wyposazenia_np_komplet_kluczykow_dowod_reje, span: [97, 109], type: text, hint: 'opis wyposażenia, np. komplet kluczyków, dowód
      rejestracyjny, koło zapasowe'}
  inline_hints:
  - {span: [110, 187], text: 'opis wyposażenia, np. komplet kluczyków, dowód rejestracyjny, koło zapasowe'}
- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Biorący wraz z zawarciem niniejszej umowy potwierdza odbiór opisanego wyżej Przedmiotu użyczenia.
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: Biorący oświadcza, że jest mu znany stan Przedmiotu użyczenia oraz że jest on zdatny do użytku i nie ma on z tego tytułu żadnych zastrzeżeń.
- p: 23
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Biorący oświadcza, iż posiada odpowiednią wiedzę, kwalifikacje i umiejętności konieczne do korzystania z Przedmiotu użyczenia zgodnie
    z jego przeznaczeniem. W szczególności Biorący oświadcza, że posiada prawo jazdy kat. B.
- {p: 24, role: spacer}
- p: 25
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- {p: 26, role: spacer}
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Biorący nie ma prawa oddawać Przedmiotu użyczenia w najem albo użyczenie osobom trzecim, bez zgody Użyczającego wyrażonej w formie pisemnej
    pod rygorem nieważności. '
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Biorący zobowiązuje się korzystać z Przedmiotu użyczenia zgodnie z umową, w tym zgodnie z jego przeznaczeniem i właściwościami, oraz zasadami
    prawidłowej gospodarki, a w szczególności utrzymywać Przedmiot użyczenia w niepogorszonym stanie ponad jego zużycie będące następstwem prawidłowego
    używania.
- {p: 29, role: spacer}
- p: 30
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 4, kind: paragraph, src: manual, level: 0}}
  text: § 4
- {p: 31, role: spacer}
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie naprawy Przedmiotu użyczenia, których dokonanie stanie się konieczne w trakcie trwania niniejszego stosunku użyczenia, obciążają
    Biorącego.
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Wszystkie koszty wynikające z korzystania z przedmiotu użyczenia przez cały czas trwania Umowy poniesie Biorący.
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Biorący zobowiązuje się do niezwłocznego informowania Użyczającego o każdym przypadku pogorszenia stanu Przedmiotu użyczenia, jego uszkodzeniu,
    zniszczeniu lub utracie.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: 'Biorący zobowiązuje się do okazania Przedmiotu użyczenia na każde wezwanie Użyczającego

    w terminie przez niego wyznaczonym. Użyczający może w każdym czasie przeprowadzić kontrolę stanu technicznego Przedmiotu użyczenia. '
- p: 36
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: "Użyczający nie odpowiada za naruszenie przepisów o ruchu drogowym oraz kary pieniężne nałożone na Biorącego w czasie użytkowania przez\
    \ niego pojazdu. \nW przypadku naruszenia przepisów o których mowa, Biorący zobowiązany jest do pokrycia kar pieniężnych i złożenia stosownych\
    \ zeznań lub wyjaśnień."
- p: 37
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}}
  text: Biorący pokrywa koszty ubezpieczenia pojazdu (OC, AC).
- p: 38
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '6.', kind: decimal, src: auto, level: 0}}
  text: Wszelkie szkody nieobjęte OC i AC m.in. polegające na odbiegającym od naturalnego zużyciu pojazdu lub wynikające z kradzieży (kradzież
    pojazdu z dokumentami i kluczykami) pokrywa Biorący.
- {p: 39, role: spacer}
- p: 40
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 5, kind: paragraph, src: manual, level: 0}}
