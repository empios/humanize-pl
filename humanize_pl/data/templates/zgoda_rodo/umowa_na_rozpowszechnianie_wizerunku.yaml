  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: W sprawach nieuregulowanych w umowie zastosowanie znajdują w szczególności stosowne przepisy ustawy z dnia 23 kwietnia 1964 r. – Kodeks
    cywilny oraz ustawy z dnia 4 lutego 1994 r. o prawie autorskim i prawach pokrewnych.
- p: 47
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Zmiany umowy wymagają formy pisemnej pod rygorem nieważności.
- p: 48
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "Umowa została sporządzona w trzech jednobrzmiących egzemplarzach, po jednym dla każdej \nze Stron."
