- {p: 20, role: spacer}
- p: 21
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}, spans: [{start: 184, end: 216, italic: true},
      {start: 243, end: 266, italic: true}, {start: 301, end: 316, italic: true}]}
  text: Na mocy niniejszej umowy, Udostępniający wyraża zgodę na rozpowszechnienie swojego wizerunku (dalej jako „Zgoda”) utrwalonego w trakcie
    sesji zdjęciowej mającej miejsce w ………………………... (miejscowość, opcjonalnie adres) w dniu/dniach ……………………….. (data sesji zdjęciowej) w celu
    promocji szkoły ………………………… (nazwa szkoły), której właścicielem jest Korzystający.
  slots:
  - {id: miejscowosc_opcjonalnie_adres, span: [171, 183], type: address, hint: 'miejscowość, opcjonalnie adres'}
  - {id: data_sesji_zdjeciowej, span: [231, 242], type: date, hint: data sesji zdjęciowej}
  - {id: nazwa_szkoly, span: [290, 300], type: text, hint: nazwa szkoły}
  inline_hints:
  - {span: [184, 216], text: 'miejscowość, opcjonalnie adres'}
  - {span: [243, 266], text: data sesji zdjęciowej}
  - {span: [301, 315], text: nazwa szkoły}
  optional: true
  condition: miejscowość, opcjonalnie adres
- p: 22
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: Zgoda, o której mowa w ust. 1, zostaje udzielona na warunkach i za wynagrodzeniem przewidzianym niniejszą umową.
- {p: 23, role: spacer}
- p: 24
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 2, kind: paragraph, src: manual, level: 0}}
  text: § 2
- p: 25
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Zgoda na wykorzystanie wizerunku
- {p: 26, role: spacer}
- p: 27
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: Z chwilą zawarcia niniejszej umowy, Udostępniający udziela Zgody bez ograniczeń terytorialnych i czasowych, w zakresie wszelkich mediów,
    w szczególności Zgoda obejmuje wykorzystanie, utrwalenie i powielanie wykonanych zdjęć za pośrednictwem dowolnego medium w dowolnym celu zgodnym
    z obowiązującym prawem, włączając w to publikacje w prasie drukowanej i w Internecie, publiczne wykorzystanie zdjęć, wykorzystywanie w celach
    marketingowych, promocyjnych i komercyjnych.
- p: 28
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: 'W szczególności Korzystający jest uprawniony do:'
- p: 29
  role: item
  layout: {align: justify, size: 10.0, marker: {text: a), kind: lowerLetter, src: auto, level: 0}}
  text: nieograniczonego używania, rozpowszechniania, przekształcania, modyfikacji i innych;
- p: 30
  role: item
  layout: {align: justify, size: 10.0, marker: {text: b), kind: lowerLetter, src: auto, level: 0}}
  text: zmian w zakresie zdjęć utrwalających wizerunek Udostępniającego, według uznania Korzystającego;
- p: 31
  role: item
  layout: {align: justify, size: 10.0, marker: {text: c), kind: lowerLetter, src: auto, level: 0}}
  text: dowolnego łączenia zdjęć z tekstem i/lub innymi zdjęciami i/lub elementami graficznymi;
- p: 32
  role: item
  layout: {align: justify, size: 10.0, marker: {text: d), kind: lowerLetter, src: auto, level: 0}}
  text: "używania zdjęć utrwalającego wizerunek Udostępniającego w celach promocyjnych \ni reklamowych Korzystającego."
- p: 33
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '3.', kind: decimal, src: auto, level: 0}}
  text: "Korzystający jest uprawniony do przenoszenia wszelkich uprawnień wynikających ze Zgody \nbez konieczności uzyskania odrębnej zgody Udostępniającego."
- p: 34
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '4.', kind: decimal, src: auto, level: 0}}
  text: Udostępniający zobowiązuje się do niepodnoszenia względem Korzystającego, jakichkolwiek roszczeń związanych z wykorzystaniem zdjęć w zakresie,
    o którym mowa powyżej, w szczególności roszczeń odszkodowawczych.
- p: 35
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '5.', kind: decimal, src: auto, level: 0}, spans: [{start: 95, end: 137, italic: true}]}
  text: Udostępniający zobowiązuje się, iż niniejsza Zgoda nie zostanie cofnięta przed upływem ……… lat (należy wskazać stosowny okres np. 5 lat)
    od dnia jej udzielenia. W przypadku cofnięcia Zgody przez Udostępniającego postanawia się, że skutek wypowiedzenia nastąpi na koniec kolejnego
    roku kalendarzowego, w którym wypowiedzenie Zgody w formie pisemnej zostało prawidłowo doręczone Korzystającemu.
  slots:
  - {id: p35_1, span: [87, 90], type: text, context: zostanie cofnięta przed upływem ▢ lat od}
- {p: 36, role: spacer}
- p: 37
  role: clause_heading
  layout: {align: center, size: 12.0, bold: true, marker: {text: § 3, kind: paragraph, src: manual, level: 0}}
  text: § 3
- p: 38
  role: body
  layout: {align: center, size: 12.0, bold: true}
  text: Wynagrodzenie
- {p: 39, role: spacer}
- p: 40
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '1.', kind: decimal, src: auto, level: 0}}
  text: 'Z tytułu należytego i zgodnego z Umową udzielenia, a także z tytułu zobowiązania Udostępniający do niewypowiadania Zgody, Korzystający
    zapłaci Udostępniający wynagrodzenie w wysokości …………………….. zł (słownie: ……………………………..).'
  slots:
  - {id: p40_1, span: [184, 194], type: amount, context: Udostępniający wynagrodzenie w wysokości ▢ zł}
  - {id: p40_2, span: [208, 221], type: amount, context: w wysokości zł słownie ▢}
- p: 41
  role: item
  layout: {align: justify, size: 10.0, marker: {text: '2.', kind: decimal, src: auto, level: 0}}
  text: "Wynagrodzenie będzie płatne przelewem w terminie 30 dni od zawarcia niniejszej Umowy, \nna rachunek bankowy Udostępniającego."
- {p: 42, role: spacer}
- p: 43
