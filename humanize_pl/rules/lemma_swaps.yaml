- id: kancelaryzm:stosowny_to_odpowiedni
  from_lemma: stosowny
  to_lemma: odpowiedni
  upos: ADJ
  score: 0.57
  risk: 0.07
  stage: legal_rewrite
  operation_type: debureaucratization
  targeted_issue: bureaucratic_qualifier
  modes: [standard, strong]
  guards:
    # "stosowne przepisy/tryb/forma" carries a specific legal meaning that
    # "odpowiedni" would dilute — preserve it in those collocations.
    forbid_right_lemmas: [przepis, tryb, forma, organ]

