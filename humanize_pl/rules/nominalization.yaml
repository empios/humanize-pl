  - {light_verb: dokonać,    noun: podział,      replacement: podzielić,      modes: [standard, strong], risk: 0.11}
  - {light_verb: dokonywać,  noun: podział,      replacement: dzielić,        modes: [standard, strong], risk: 0.11}
  - {light_verb: dokonać,    noun: pomiar,       replacement: zmierzyć,       modes: [standard, strong], risk: 0.10}
  - {light_verb: dokonywać,  noun: pomiar,       replacement: mierzyć,        modes: [standard, strong], risk: 0.10}
