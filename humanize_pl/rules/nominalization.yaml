# Nominalization reduction: light verb + deverbal noun → simple verb
#
# entries: used by the NLP path (Stanza dep-parse + Morfeusz generate).
#   light_verb — lemma of the light verb as Stanza returns it
#   noun       — nominative lemma of the deverbal noun
#   replacement — lemma of the simple replacement verb
#
# patterns: regex fallback used in basic mode (no Stanza).
#   Patterns for dokonać+oceny/kontroli/weryfikacji live in kancelaryzmy.py
#   (conservative) and are intentionally omitted here to avoid double-firing.

entries:
  # ═══ dokonać (perf) / dokonywać (imperf) ═══
  - {light_verb: dokonać,    noun: analiza,      replacement: przeanalizować, modes: [standard, strong], risk: 0.10}
  - {light_verb: dokonywać,  noun: analiza,      replacement: analizować,     modes: [standard, strong], risk: 0.10}
  - {light_verb: dokonać,    noun: zmiana,       replacement: zmienić,        modes: [standard, strong], risk: 0.10}
  - {light_verb: dokonywać,  noun: zmiana,       replacement: zmieniać,       modes: [standard, strong], risk: 0.10}
  - {light_verb: dokonać,    noun: wybór,        replacement: wybrać,         modes: [standard, strong], risk: 0.11}
