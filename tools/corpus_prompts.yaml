# Scenariusze do generowania korpusu AI.
#
# Jeden prompt powtórzony trzysta razy mierzy prompt, nie model. Korpus
# powstaje z iloczynu: scenariusz (o czym) × rejestr polecenia (jak proszono)
# × temperatura. Trzy osie wystarczą, żeby dokumenty nie były wariantami
# jednego szkieletu.
#
# Polecenia celowo NIE proszą o zły tekst. Chodzi o to, jak model pisze, gdy
# stara się dobrze — bo tak właśnie powstają dokumenty, które narzędzie ma
# wyłapywać.

# Rejestry polecenia. `{zadanie}` wypełnia scenariusz kategorii.
styles:
  - id: zwiezly
    system: "Jesteś polskim prawnikiem. Piszesz dokumenty po polsku."
    user: "{zadanie}"

  - id: szczegolowy
    system: "Jesteś doświadczonym polskim prawnikiem. Piszesz kompletne dokumenty po polsku, z zachowaniem przyjętej struktury i numeracji."
    user: "{zadanie} Zadbaj o kompletność i poprawną strukturę dokumentu."

  - id: bez_roli
    system: "Odpowiadaj po polsku."
    user: "{zadanie}"

categories:

